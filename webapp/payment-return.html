<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата обработана</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:24px;background:#0e1630;color:#fff}
    .card{max-width:560px;margin:0 auto;border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px;background:rgba(255,255,255,.06)}
    a{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:10px;background:#5ba5ff;color:#051225;text-decoration:none;font-weight:700}
    .muted{opacity:.82}
  </style>
</head>
<body>
  <main class="card">
    <h1 style="margin:0 0 8px">Оплата обработана</h1>
    <p class="muted" style="margin:0">Вернитесь в Telegram</p>
    <a id="openBotLink" href="https://t.me/supplly_bot" target="_blank" rel="noopener">Открыть бота</a>
  </main>
  <script>
    (async function(){
      try {
        const res = await fetch('/api/config');
        const cfg = await res.json();
        const raw = String(cfg?.bot_username || 'supplly_bot').trim().replace(/^@+/, '');
        if (raw) {
          const href = `https://t.me/${encodeURIComponent(raw)}`;
          const a = document.getElementById('openBotLink');
          if (a) a.href = href;
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
