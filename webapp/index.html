      const value = form?.[k];
      if (k === 'heavy_menstrual_bleeding') return value === true;
      return String(value || '').trim() && String(value || '').trim() !== 'unknown' && String(value || '').trim() !== 'false';
    });
    if (!hasPersonal) return 1;
    const hasNutrition = ['fish_intake_frequency', 'meat_intake_frequency', 'dairy_intake_frequency', 'egg_intake_frequency'].some((k)=>String(form?.[k] || '').trim() && String(form?.[k] || '').trim() !== 'unknown');
    if (!hasNutrition) return 2;
    const hasSymptoms = !!String(form?.primary_goal || '').trim() || (Array.isArray(form?.symptoms) && form.symptoms.length > 0) || !!String(form?.gi_problems_text || '').trim() || !!String(form?.thyroid_conditions_text || '').trim();
    if (!hasSymptoms) return 3;
    const hasLabs = (Array.isArray(draftLabs) ? draftLabs : []).some((row)=>assistantLabRowReady(row));
    return hasLabs ? 4 : 3;
  }

  function renderProfile() {

    return `${renderProfileModulesGrid()}${moduleHtml}${renderProfileEditorModal()}${renderLabsModal('manual')}${renderLabsModal('upload')}${renderReviewModal()}${renderMyNutrientsModal()}`;

  function collectLabRows(containerId){ const rows=[]; document.querySelectorAll(`#${containerId} [data-lab-row]`).forEach((rowEl)=>{ const idx=rowEl.dataset.labRow; const analyte_code=document.querySelector(`[data-lab-field="analyte_code"][data-idx="${idx}"]`)?.value||''; const preset=ANALYTE_PRESETS.find((x)=>x.code===analyte_code); const value=document.querySelector(`[data-lab-field="value_num"][data-idx="${idx}"]`)?.value||''; rows.push({ analyte_code, analyte_name:preset?.title||analyte_code, value_text:String(value), value_num:Number(String(value).replace(',','.'))||null, unit:document.querySelector(`[data-lab-field="unit"][data-idx="${idx}"]`)?.value||'', ref_low:Number(document.querySelector(`[data-lab-field="ref_low"][data-idx="${idx}"]`)?.value||'')||null, ref_high:Number(document.querySelector(`[data-lab-field="ref_high"][data-idx="${idx}"]`)?.value||'')||null }); }); return rows.filter((x)=>x.analyte_code); }
  function collectAssistantLabs(){
    syncExpandedAssistantLabRow();
    return normalizeAssistantLabs(state.nutrientAssistant.manualLabs || []).filter((item)=>String(item.analyte_code || '').trim()).map((item)=>({
      analyte_code: item.analyte_code,
      analyte_name_ru: item.analyte_name_ru,
      value: item.value || '',
      unit: item.unit || '',
      ref_low: item.ref_low ?? '',
      ref_high: item.ref_high ?? '',
      measured_at: item.measured_at || ''
    }));
  }
  function syncExpandedAssistantLabRow(){
    const idx = Number(state.nutrientAssistant.expandedLabIdx || 0);
    if (!Array.isArray(state.nutrientAssistant.manualLabs)) state.nutrientAssistant.manualLabs = [];
    if (!state.nutrientAssistant.manualLabs[idx]) return;
    const next = { ...state.nutrientAssistant.manualLabs[idx] };
    ['analyte_code','value','unit','ref_low','ref_high','measured_at'].forEach((f)=>{
      const val = document.querySelector(`[data-assistant-lab="${f}"][data-idx="${idx}"]`)?.value;
      if (val !== undefined) next[f] = val;
    });
    state.nutrientAssistant.manualLabs[idx] = normalizeAssistantLabItem(next, { keepUnit: true });
  }
  function collectAssistantForm(){
    const next = { ...(state.nutrientAssistant.form || {}) };
    document.querySelectorAll('[data-assistant-field]').forEach((el)=>{
      const key = String(el.dataset.assistantField || '');

    next.malabsorption_risk = !!next.malabsorption_risk;

    return next;

  async function loadComplexes(force) {
    try {
      const res = await api('./api/complexes');
      state.complexes = res.items || [];
    } catch {}
  }

  async function loadComplexHubMeta(force) {
    const hub = state.complexHub;
    if ((hub.loading || hub.schedulesLoading || hub.slotsLoading) && !force) return;
    hub.loading = true;
    hub.schedulesLoading = true;
    hub.slotsLoading = true;
    renderActiveTab();
    try {
      const [complexRes, scheduleRes, slotsRes] = await Promise.all([
        api('./api/complexes'),
        api('./api/complex_schedules').catch(() => ({ items: [] })),
        api('./api/schedule').catch(() => ({ slots: [] })),
      ]);
      state.complexes = Array.isArray(complexRes.items) ? complexRes.items : [];
      hub.schedules = Array.isArray(scheduleRes.items) ? scheduleRes.items : [];
      hub.slots = Array.isArray(slotsRes.slots) ? slotsRes.slots : [];
    } catch {
      showToast('Не удалось загрузить комплексы');
    } finally {
      hub.loading = false;
      hub.schedulesLoading = false;
      hub.slotsLoading = false;
      renderActiveTab();
    }
  }

  async function loadComplexItems(complexId, force = false) {
    const cid = Number(complexId || 0);
    if (!cid) return;
    const hub = state.complexHub;
    if (hub.itemsLoading[cid] && !force) return;
    if (hub.itemsById[cid] && !force) return;
    hub.itemsLoading[cid] = true;
    renderActiveTab();
    try {
      const res = await api(`./api/complexes/${cid}/items`);
      hub.itemsById[cid] = Array.isArray(res.items) ? res.items : [];
    } catch {
      showToast('Не удалось загрузить состав комплекса');
    } finally {
      hub.itemsLoading[cid] = false;
      renderActiveTab();
    }
  }

  function slotProgress(slot) {
    const safeSlot = slot || {};
    const items = Array.isArray(safeSlot.items) ? safeSlot.items : [];
    const complexes = Array.isArray(safeSlot.complexes) ? safeSlot.complexes : [];
    const singleTaken = items.filter((i) => i?.status === "taken").length;
    const singleTotal = items.length;
    let complexTaken = 0;
    let complexTotal = 0;
    for (const complex of complexes) {
      const cItems = Array.isArray(complex?.items) ? complex.items : [];
      if (cItems.length) {
        complexTotal += cItems.length;
        complexTaken += cItems.filter((i) => i?.status === "taken").length;
      } else {
        complexTotal += Number(complex?.total_count || 0);
        complexTaken += Number(complex?.taken_count || 0);
      }
    }
    const total = singleTotal + complexTotal;
    const taken = singleTaken + complexTaken;
    return { total, taken, closed: total > 0 && taken >= total };
  }

  function findSlotBySupplementId(supplementId) {
    for (const slot of state.today?.slots || []) {
      const inItems = (slot.items || []).some((i) => String(i.supplement_id) === String(supplementId));
      const inComplex = (slot.complexes || []).some((c) => (c.items || []).some((i) => String(i.supplement_id) === String(supplementId)));
      if (inItems || inComplex) return slot;
    }
    return null;
  }

  function findSlotByComplexId(complexId) {
    for (const slot of state.today?.slots || []) {
      const found = (slot.complexes || []).some((c) => String(c.complex_id) === String(complexId));
      if (found) return slot;
    }
    return null;
  }

  function extractUnlockedPoints(payloads) {
    return (Array.isArray(payloads) ? payloads : []).reduce((acc, payload) => {
      const details = Array.isArray(payload?.newly_unlocked_details) ? payload.newly_unlocked_details : [];
      return acc + details.reduce((sum, x) => sum + Number(x?.points || 0), 0);
    }, 0);
  }

  function canShowMicroWow() {
    state.ui = state.ui || {};
    const now = Date.now();
    const last = Number(state.ui.microWowLastAt || 0);
    if (now - last < 20000) return false;
    state.ui.microWowLastAt = now;
    return true;
  }

  function maybeCelebrateSlotClosed() {
    if (!canShowMicroWow()) return;
    tg?.HapticFeedback?.impactOccurred?.("light");

  }

  function recalcTodaySnapshot() {
    const slots = state.today?.slots || [];
    let expected = 0;
    let taken = 0;
    for (const slot of slots) {
      for (const item of (slot.items || [])) {
        expected += 1;
        if (item.status === 'taken') taken += 1;
      }
      for (const complex of (slot.complexes || [])) {
        for (const item of (complex.items || [])) {
          expected += 1;
          if (item.status === 'taken') taken += 1;
        }
      }
    }
    state.today.expected = expected;
    state.today.taken = taken;
    state.today.adherence = expected > 0 ? Math.round((taken / expected) * 100) : 0;
    if (state.stats?.today) {
      state.stats.today.expected = expected;
      state.stats.today.taken = taken;
      state.stats.today.adherence = state.today.adherence;
    }
  }

  function digestTodaySnapshot(today, statsSummary) {
    const slots = Array.isArray(today?.slots) ? today.slots : [];
    const slotDigest = slots.map((slot) => ({
      slot_id: String(slot.slot_id || ''),
      time_local: String(slot.time_local || ''),
      items: (Array.isArray(slot.items) ? slot.items : []).map((item) => ({
        supplement_id: Number(item.supplement_id || 0),
        status: String(item.status || 'none'),
      })),
      complexes: (Array.isArray(slot.complexes) ? slot.complexes : []).map((complex) => ({
        complex_id: Number(complex.complex_id || 0),
        status: String(complex.status || 'none'),
        taken_count: Number(complex.taken_count || 0),
        total_count: Number(complex.total_count || 0),
        items: (Array.isArray(complex.items) ? complex.items : []).map((item) => ({
          supplement_id: Number(item.supplement_id || 0),
          status: String(item.status || 'none'),
        })),
      })),
    }));
    const stToday = statsSummary?.today || {};
    const st7 = statsSummary?.last7 || {};
    const statsDigest = {
      today: {
        expected: Number(stToday.expected || 0),
        taken: Number(stToday.taken || 0),
        adherence: stToday.adherence == null ? null : Number(stToday.adherence),
      },
      last7: {
        expected: Number(st7.expected || 0),
        taken: Number(st7.taken || 0),
        adherence: st7.adherence == null ? null : Number(st7.adherence),
      },
    };
    return JSON.stringify({ slotDigest, statsDigest });
  }

  async function loadToday(forceOrOptions = false) {
    const opts = typeof forceOrOptions === 'object' && forceOrOptions !== null
      ? forceOrOptions
      : { force: !!forceOrOptions };
    const force = !!opts.force;
    const silent = !!opts.silent;
    if (state.loadingToday && !force) return;
    const showLoading = !silent && !state.today;
    if (showLoading) {
      state.loadingToday = true;
      state.loadingStats = true;
      renderActiveTab();
    }
    let shouldRender = false;
    try {
      const [today, statsRes] = await Promise.all([
        api("./api/today"),
        api("./api/stats/summary").catch(()=>null),
      ]);
      const nextStats = statsRes?.summary || null;
      const prevDigest = digestTodaySnapshot(state.today, state.stats);
      const nextDigest = digestTodaySnapshot(today, nextStats);
      if (force || prevDigest !== nextDigest || !state.today) {
        state.today = today;
        state.stats = nextStats;
        shouldRender = true;
      }
    } catch (e) {
      if (e.message !== "PREMIUM_REQUIRED") showToast("Не удалось загрузить план");
    } finally {
      state.loadingToday = false;
      state.loadingStats = false;
      if (showLoading || shouldRender) renderActiveTab();
    }
  }

  async function loadMySupplements(forceOrOptions = false) {
    const opts = typeof forceOrOptions === 'object' && forceOrOptions !== null
      ? forceOrOptions
      : { force: !!forceOrOptions };

    const silent = !!opts.silent;
    const ms = state.mySupplements;
    if (ms.loading && !force) return;
    ms.loading = true;
    if (!silent) renderActiveTab();
    try {
      const res = await api("./api/my_supplements");
      ms.active = Array.isArray(res.active) ? res.active : [];
      ms.frozen = Array.isArray(res.frozen) ? res.frozen : [];
    } catch (e) {
      showToast("Не удалось загрузить список БАДов");
    } finally {
      ms.loading = false;
      if (!silent) renderActiveTab();
    }
  }

      return `<div class="muted">${label}: ${taken}/${expected} (${adherence}%)</div>`;
    };
    const extra = marksTotal > 0
      ? `<div class="muted">Отмечено приёмов: ${marksTotal}</div>`
      : `<div class="muted">Пока нет отмеченных приёмов.</div>`;
    return `<div class="muted" style="margin-top:8px">${line('Сегодня', today).replace('<div class="muted">','').replace('</div>','')}</div>${line('7 дней', d7)}${line('30 дней', d30)}${extra}`;

  function normalizeHHMM(value) {
    const raw = String(value || '').trim();
    const m = raw.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return '';
    const hh = Number(m[1]);
    const mm = Number(m[2]);
    if (!Number.isFinite(hh) || !Number.isFinite(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) return '';
    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  function isDefaultScheduleSlot(slotId) {
    const normalized = String(slotId || '').trim();
    return normalized === 'morning' || normalized === 'noon' || normalized === 'evening';
  }

  function parseIsoDate(value) {
    const raw = String(value || '').trim();
    if (!raw) return null;
    const dt = new Date(raw);
    if (Number.isNaN(dt.getTime())) return null;
    return dt;
  }

  function formatStartDateRu(value) {
    const dt = parseIsoDate(value);
    if (!dt) return '—';
    const y = dt.getUTCFullYear();
    const m = String(dt.getUTCMonth() + 1).padStart(2, '0');
    const d = String(dt.getUTCDate()).padStart(2, '0');
    return `${d}.${m}.${y}`;
  }

  function approxIntakeDurationRu(value) {
    const dt = parseIsoDate(value);
    if (!dt) return '—';
    const startUtc = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
    const now = new Date();
    const nowUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    const days = Math.max(0, Math.floor((nowUtc - startUtc) / 86400000)) + 1;
    if (days < 7) return `примерно ${days} дн.`;
    if (days < 30) return `примерно ${Math.max(1, Math.round(days / 7))} нед.`;
    if (days < 365) return `примерно ${Math.max(1, Math.round(days / 30))} мес.`;
    return `примерно ${Math.max(1, Math.round(days / 365))} г.`;
  }

  function timezoneOptionsHtml(selected) {
    const options = [];
    for (let h = -12; h <= 14; h += 1) {
      const sign = h >= 0 ? '+' : '-';
      const abs = String(Math.abs(h)).padStart(2, '0');
      const val = `UTC${sign}${abs}:00`;
      options.push(`<option value="${val}" ${val === selected ? 'selected' : ''}>${val}</option>`);
    }
    return options.join('');
  }

  async function loadSettingsData(force = false) {
    if (state.settingsData.loading && !force) return;
    state.settingsData.loading = true;
    try {
      const res = await api('./api/settings');
      state.settingsData.tz_name = String(res.tz_name || 'UTC');
      state.settingsData.reminders_enabled = res.reminders_enabled !== false;
      state.settingsData.offer_url = String(res.offer_url || '');
      state.settingsData.privacy_url = String(res.privacy_url || '');
      state.settingsData.offer_version = String(res.offer_version || '');
      state.settingsData.privacy_version = String(res.privacy_version || '');
    } catch {
      state.settingsData.tz_name = 'UTC';
      state.settingsData.reminders_enabled = true;
      state.settingsData.offer_url = '';
      state.settingsData.privacy_url = '';
      state.settingsData.offer_version = '';
      state.settingsData.privacy_version = '';
    } finally {
      state.settingsData.loading = false;
    }
  }

  async function loadScheduleData(force = false) {
    if (state.settingsUi.loadingSchedule && !force) return;
    state.settingsUi.loadingSchedule = true;
    try {
      const res = await api('./api/schedule');
      state.settingsSchedule.slots = Array.isArray(res.slots) ? res.slots : [];
    } catch {
      state.settingsSchedule.slots = [];
    } finally {
      state.settingsUi.loadingSchedule = false;
    }
  }

  async function createScheduleSlot(timeLocal, titleRu) {
    const time = normalizeHHMM(timeLocal || '');
    if (!time) throw new Error('invalid_time');
    const title = String(titleRu || '').trim() || `Слот ${time}`;
    const created = await api('./api/schedule/add_slot', { method: 'POST', body: { time_local: time, title_ru: title } });
    const scheduleRes = await api('./api/schedule');
    const nextSlots = Array.isArray(scheduleRes.slots) ? scheduleRes.slots : [];
    state.settingsSchedule.slots = nextSlots;
    state.complexHub.slots = nextSlots;
    if (state.suppHub.open || state.suppHub.slots?.length) {
      state.suppHub.slots = nextSlots;
      state.suppHub.schedules = Array.isArray(scheduleRes.schedules) ? scheduleRes.schedules : (state.suppHub.schedules || []);
      state.suppHub.scheduleCacheAt = Date.now();
    }
    return { slotId: String(created?.slot_id || ''), time };
  }

  async function deleteScheduleSlot(slotId) {
    const normalizedSlotId = String(slotId || '').trim();
    if (!normalizedSlotId) throw new Error('invalid_slot_id');
    const removed = await api('./api/schedule/delete_slot', { method: 'POST', body: { slot_id: normalizedSlotId } });
    const scheduleRes = await api('./api/schedule');
    const nextSlots = Array.isArray(scheduleRes.slots) ? scheduleRes.slots : [];
    state.settingsSchedule.slots = nextSlots;
    state.complexHub.slots = nextSlots;
    if (state.suppHub.open || state.suppHub.slots?.length) {
      state.suppHub.slots = nextSlots;
      state.suppHub.schedules = Array.isArray(scheduleRes.schedules) ? scheduleRes.schedules : (state.suppHub.schedules || []);
      state.suppHub.scheduleCacheAt = Date.now();
    }
    return removed || {};
  }

  function bindSettingsEvents() {
    document.querySelectorAll('[data-settings-section]').forEach((el) => {
      el.addEventListener('toggle', () => {
        const key = String(el.dataset.settingsSection || '');
        if (!key) return;
        state.settingsUi.sectionsOpen = { ...(state.settingsUi.sectionsOpen || {}), [key]: !!el.open };
      });
    });
    document.querySelector('[data-settings-back-complex]')?.addEventListener('click', async () => {
      state.complexHub.returnToToday = false;
      activateTab('today');
      await Promise.all([loadComplexHubMeta(true), loadToday(true)]);
    });

    document.getElementById('settingsTimezone')?.addEventListener('change', async (e) => {
      const tzName = String(e.target.value || '').trim();
      if (!tzName) return;
      try {
        await api('./api/settings/timezone', { method:'POST', body:{ tz_name: tzName } });
        state.settingsData.tz_name = tzName;
        showToast('Часовой пояс сохранён');
      } catch {
        showToast('Не удалось сохранить часовой пояс');
      }
    });
    document.getElementById('settingsNotificationsEnabled')?.addEventListener('change', async (e) => {
      const enabled = !!e?.target?.checked;
      if (state.settingsUi.savingNotifications) return;
      state.settingsUi.savingNotifications = true;
      try {
        await api('./api/settings/notifications', { method: 'POST', body: { reminders_enabled: enabled } });
        state.settingsData.reminders_enabled = enabled;
        if (!enabled) {
          const slots = state.settingsSchedule.slots || [];
          for (const slot of slots) {
            if (!slot?.slot_id) continue;
            await api('./api/schedule/slot_enabled', { method: 'POST', body: { slot_id: slot.slot_id, is_enabled: false } });
            slot.is_enabled = false;
          }
        }
        document.querySelectorAll('[data-slot-enabled]').forEach((slotEl) => {

    return '<span class="status-pill-icon">◻</span><span class="status-pill-label">Не отмечено</span>';

  async function openSupplementHub(supplementId) {
    const sid = Number(supplementId);
    if (!sid) return;
    const all = [...(state.mySupplements.active || []), ...(state.mySupplements.frozen || [])];
    const item = all.find((x) => Number(x.supplement_id) === sid);
    if (!item) return;
    state.suppHub.open = true;
    state.suppHub.loading = true;
    state.suppHub.item = item;
    state.suppHub.doseText = item.dose_text || '';
    state.suppHub.noteText = item.note_text || '';
    state.suppHub.reminderInput = '';
    state.suppHub.historyOpen = false;
    state.suppHub.history = null;
    state.suppHub.historyLoading = false;
    state.suppHub.deleting = false;
    renderActiveTab();
    try {
      const cacheAgeMs = Date.now() - Number(state.suppHub.scheduleCacheAt || 0);
      const scheduleRes = (cacheAgeMs < 30000 && state.suppHub.slots?.length)
        ? { slots: state.suppHub.slots, schedules: state.suppHub.schedules || [] }
        : await api('./api/schedule');
      const slots = Array.isArray(scheduleRes.slots) ? scheduleRes.slots : [];
      const schedules = Array.isArray(scheduleRes.schedules) ? scheduleRes.schedules : [];
      state.suppHub.scheduleCacheAt = Date.now();
      state.suppHub.schedules = schedules;
      const sch = schedules.find((x) => Number(x.supplement_id) === sid);
      state.suppHub.slots = slots;
      state.suppHub.slotId = sch?.slot_id || 'morning';
      const slotForSupp = slots.find((x) => String(x.slot_id || '') === String(state.suppHub.slotId || ''));
      const slotTime = normalizeHHMM(slotForSupp?.time_local || '');
      const customTime = normalizeHHMM(sch?.time_hhmm || '');
      state.suppHub.timeMode = customTime ? 'custom' : 'slot';
      state.suppHub.customTime = customTime;
      state.suppHub.time = customTime || slotTime || '';
      state.suppHub.reminderTimes = [];
      state.suppHub.remindersMode = 'slot';
    } catch {
      showToast('Не удалось загрузить меню добавки');
    } finally {
      state.suppHub.loading = false;
      renderActiveTab();
    }
  }

  function removeComplexFromToday(complexId) {
    const cid = Number(complexId || 0);
    if (!cid || !state.today?.slots) return;
    for (const slot of state.today.slots) {
      const complexes = Array.isArray(slot.complexes) ? slot.complexes : [];
      slot.complexes = complexes.filter((complex) => Number(complex?.complex_id || 0) !== cid);
    }
    recalcTodaySnapshot();
  }

  function removeSupplementFromComplexInToday(complexId, supplementId) {
    const cid = Number(complexId || 0);
    const sid = Number(supplementId || 0);
    if (!cid || !sid || !state.today?.slots) return;
    for (const slot of state.today.slots) {
      for (const complex of (slot.complexes || [])) {
        if (Number(complex?.complex_id || 0) !== cid) continue;
        const nextItems = (complex.items || []).filter((item) => Number(item?.supplement_id || 0) !== sid);
        complex.items = nextItems;
        complex.total_count = Math.max(0, Number(complex.total_count || 0) - 1);
        complex.taken_count = nextItems.filter((item) => item.status === 'taken').length;
        complex.status = complex.taken_count > 0 ? 'taken' : 'none';
      }
    }
    recalcTodaySnapshot();
  }

  function removeSupplementFromMySupplementsState(supplementId) {
    const sid = Number(supplementId || 0);
    if (!sid) return;
    state.mySupplements.active = (state.mySupplements.active || []).filter((item) => Number(item?.supplement_id || 0) !== sid);
    state.mySupplements.frozen = (state.mySupplements.frozen || []).filter((item) => Number(item?.supplement_id || 0) !== sid);
    delete state.mySupplements.busy[sid];
  }

  function removeSupplementEverywhereInToday(supplementId) {
    const sid = Number(supplementId || 0);
    if (!sid || !state.today?.slots) return;
    for (const slot of state.today.slots) {
      slot.items = (slot.items || []).filter((item) => Number(item?.supplement_id || 0) !== sid);
      const nextComplexes = [];
      for (const complex of (slot.complexes || [])) {
        const nextItems = (complex.items || []).filter((item) => Number(item?.supplement_id || 0) !== sid);
        if (!nextItems.length) continue;
        complex.items = nextItems;
        complex.total_count = nextItems.length;
        complex.taken_count = nextItems.filter((item) => item.status === 'taken').length;
        complex.status = complex.taken_count > 0 ? 'taken' : 'none';
        nextComplexes.push(complex);
      }
      slot.complexes = nextComplexes;
    }
    recalcTodaySnapshot();
  }

  function bindTodayEvents() {
    appEl.querySelectorAll("[data-item]").forEach((row) => {
      row.addEventListener("click", (e) => {
        e.preventDefault();

        const next = row.dataset.next;

      });

    appEl.querySelectorAll("[data-complex-toggle]").forEach((btn)=>{
      btn.addEventListener("click", async (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const complexId = Number(btn.dataset.complexToggle);
        const next = btn.dataset.next;
        const prevSlot = findSlotByComplexId(complexId);
        const wasClosedBefore = slotProgress(prevSlot).closed;
        const complex = (prevSlot?.complexes || []).find((c) => Number(c.complex_id) === complexId);
        const snapshot = complex ? {
          status: complex.status,
          takenCount: complex.taken_count,
          items: (complex.items || []).map((it) => ({ id: it.supplement_id, status: it.status })),
        } : null;
        if (complex) {
          complex.status = next;
          complex.taken_count = next === 'taken' ? Number(complex.total_count || 0) : 0;
          (complex.items || []).forEach((it) => { it.status = next; });
          recalcTodaySnapshot();
          renderActiveTab();
        }
        haptic();
        try {
          const out = await api("./api/today/toggle_complex", { method:"POST", body:{ complex_id: complexId, status: next } });
          recalcTodaySnapshot();
          renderActiveTab();
          if (next === "taken") {
            const afterSlot = findSlotByComplexId(complexId);
            const isClosedAfter = slotProgress(afterSlot).closed;
            const perfectDay = Number(state.today?.expected || 0) >= 3 && Number(state.today?.adherence || 0) === 100;
            const gain = extractUnlockedPoints([out]);
            if (perfectDay) maybeCelebratePerfectDay(gain);
            else if (!wasClosedBefore && isClosedAfter) maybeCelebrateSlotClosed();
          }
          await showUnlockToastFromPayload(out);
        } catch {
          if (complex && snapshot) {
            complex.status = snapshot.status;
            complex.taken_count = snapshot.takenCount;
            (complex.items || []).forEach((it) => {
              const prevItem = snapshot.items.find((x) => String(x.id) === String(it.supplement_id));
              if (prevItem) it.status = prevItem.status;

            recalcTodaySnapshot();

    appEl.querySelectorAll('[data-complex-open-supp]').forEach((el) => {
      el.addEventListener('click', async () => {
        const sid = Number(el.dataset.complexOpenSupp || 0);
        if (!sid) return;
        await openSupplementHub(sid);
      });
    });

    appEl.querySelectorAll('[data-complex-remove-item]').forEach((el) => {
      el.addEventListener('click', async () => {
        const cid = Number(el.dataset.complexRemoveItem || 0);
        const sid = Number(el.dataset.supplementId || 0);
        if (!cid || !sid) return;
        state.complexHub.actionBusy[cid] = true;
        renderActiveTab();
        try {
          await api(`./api/complexes/${cid}/items/remove`, { method: 'POST', body: { supplement_id: sid } });
          state.complexHub.itemsById[cid] = (state.complexHub.itemsById[cid] || []).filter((item) => Number(item?.supplement_id || 0) !== sid);
          const complex = (state.complexes || []).find((x) => Number(x.id || 0) === cid);
          if (complex) complex.items_count = Math.max(0, Number(complex.items_count || 0) - 1);
          removeSupplementFromComplexInToday(cid, sid);
          showToast('БАД удалён из комплекса');
        } catch {
          showToast('Не удалось удалить БАД из комплекса');
        } finally {
          delete state.complexHub.actionBusy[cid];
          renderActiveTab();
        }
      });
    });

    appEl.querySelectorAll('[data-complex-add-item]').forEach((el) => {
      el.addEventListener('click', async () => {
        const cid = Number(el.dataset.complexAddItem || 0);
        if (!cid) return;
        state.catalog.pickForComplexId = cid;
        state.catalog.focusSearchOnOpen = true;
        state.catalog.q = '';
        state.catalog.page = 0;
        state.catalog.hasMore = true;
        state.activeTab = 'catalog';
        renderMainApp();
        await loadCatalog(true);
        showToast('Выберите БАД в каталоге — он добавится в комплекс');
      });
    });

    appEl.querySelectorAll("[data-my-supp-close]").forEach((el) => {
      el.addEventListener("click", () => {
        state.mySupplements.open = false;
        renderActiveTab();
      });
    });

    appEl.querySelectorAll("[data-my-supp-tab]").forEach((el) => {
      el.addEventListener("click", () => {
        state.mySupplements.tab = el.dataset.mySuppTab === "frozen" ? "frozen" : "active";
        renderActiveTab();
      });
    });

    appEl.querySelectorAll("[data-my-supp-freeze]").forEach((el) => {
      el.addEventListener("click", async () => {
        const supplementId = Number(el.dataset.mySuppFreeze);
        const enabled = Number(el.dataset.enabled);
        state.mySupplements.busy[supplementId] = true;
        renderActiveTab();
        try {
          await api("./api/my_supplements/freeze", { method: "POST", body: { supplement_id: supplementId, enabled } });
          await Promise.all([loadMySupplements(true), loadToday(true)]);
          showToast(enabled ? "Добавка разморожена" : "Добавка заморожена");
        } catch {
          showToast("Не удалось изменить статус");
        } finally {
          delete state.mySupplements.busy[supplementId];
          renderActiveTab();
        }
      });
    });

    appEl.querySelectorAll("[data-my-supp-open]").forEach((el) => {
      el.addEventListener("click", async () => {
        await openSupplementHub(Number(el.dataset.mySuppOpen));
      });
    });

    appEl.querySelectorAll('[data-supp-hub-close]').forEach((el) => {
      el.addEventListener('click', () => {
        state.suppHub.open = false;
        renderActiveTab();
      });
    });

    const persistSuppHub = async ({ showSavedToast = false } = {}) => {
      const item = state.suppHub.item;
      if (!item || state.suppHub.saving) return false;
      const sid = Number(item.supplement_id);
      const customTime = normalizeHHMM(state.suppHub.customTime);
      const time = state.suppHub.timeMode === 'custom' ? (customTime || null) : null;
      const prevSchedule = (state.suppHub.schedules || []).find((x) => Number(x.supplement_id) === sid);
      const prevSlotId = String(prevSchedule?.slot_id || 'morning');
      const prevCustomTime = normalizeHHMM(prevSchedule?.time_hhmm || '') || null;
      const nextSlotId = String(state.suppHub.slotId || 'morning');
      const scheduleChanged = prevSlotId !== nextSlotId || prevCustomTime !== time;
      if (state.suppHub.timeMode === 'custom' && !time) {
        showToast('Введите время HH:MM');
        return false;
      }
      state.suppHub.saving = true;
      try {
        await api('./api/my_supplements/update', { method: 'POST', body: { supplement_id: sid, dose_text: state.suppHub.doseText || '', note_text: state.suppHub.noteText || '' } });
        await api('./api/schedule/set', { method: 'POST', body: { supplement_id: sid, slot_id: nextSlotId, time_hhmm: time } });
        if (scheduleChanged) {
          await api('./api/reminders/set', { method: 'POST', body: { supplement_id: sid, mode: 'slot', times: [] } });
        }
        const restSchedules = (state.suppHub.schedules || []).filter((x) => Number(x.supplement_id) !== sid);
        state.suppHub.schedules = [...restSchedules, { supplement_id: sid, slot_id: nextSlotId, time_hhmm: time }];
        await Promise.all([loadMySupplements(true), loadToday(true)]);
        if (showSavedToast) showToast('Изменения сохранены');
        return true;
      } catch {
        showToast('Не удалось сохранить изменения');
        return false;
      } finally {
        state.suppHub.saving = false;
      }
    };

    document.getElementById('hubDose')?.addEventListener('input', (e) => { state.suppHub.doseText = e.target.value || ''; });
    document.getElementById('hubNote')?.addEventListener('input', (e) => { state.suppHub.noteText = e.target.value || ''; });
    appEl.querySelectorAll('[data-hub-slot-choice]').forEach((el) => {
      el.addEventListener('click', async () => {
        const nextSlotId = String(el.dataset.hubSlotChoice || 'morning');
        if (String(state.suppHub.slotId || '') === nextSlotId && state.suppHub.timeMode !== 'custom') return;
        state.suppHub.slotId = nextSlotId;
        const slot = (state.suppHub.slots || []).find((x) => String(x.slot_id || '') === String(nextSlotId));
        const slotTime = normalizeHHMM(slot?.time_local || '');
        if (state.suppHub.timeMode !== 'custom') {
          state.suppHub.time = slotTime || '';
          await persistSuppHub();
        }
        renderActiveTab();
      });
    });

    appEl.querySelectorAll('[data-time-mode]').forEach((el) => {
      el.addEventListener('click', async () => {
        const mode = el.dataset.timeMode === 'custom' ? 'custom' : 'slot';
        if (state.suppHub.timeMode === mode) return;
        state.suppHub.timeMode = mode;
        if (mode === 'slot') {
          state.suppHub.customTime = '';
          const slot = (state.suppHub.slots || []).find((x) => String(x.slot_id || '') === String(state.suppHub.slotId || ''));
          state.suppHub.time = normalizeHHMM(slot?.time_local || '');
          await persistSuppHub();
        } else {
          const slot = (state.suppHub.slots || []).find((x) => String(x.slot_id || '') === String(state.suppHub.slotId || ''));
          const slotTime = normalizeHHMM(slot?.time_local || '');
          state.suppHub.customTime = normalizeHHMM(state.suppHub.customTime || state.suppHub.time || slotTime || '');
          state.suppHub.time = state.suppHub.customTime;
        }
        renderActiveTab();
      });
    });

    appEl.querySelector('[data-supp-hub-history]')?.addEventListener('click', async () => {
      state.suppHub.historyOpen = !state.suppHub.historyOpen;
      if (!state.suppHub.historyOpen) {
        renderActiveTab();
        return;
      }
      if (state.suppHub.history || state.suppHub.historyLoading) {
        renderActiveTab();
        return;
      }
      state.suppHub.historyLoading = true;
      renderActiveTab();
      try {
        state.suppHub.history = await api(`./api/my_supplements/history?supplement_id=${Number(state.suppHub.item?.supplement_id || 0)}`);
      } catch {
        showToast('Не удалось загрузить историю');
      } finally {
        state.suppHub.historyLoading = false;
        renderActiveTab();
      }
    });

    appEl.querySelector('[data-my-supp-delete]')?.addEventListener('click', async () => {
      haptic();
      const sid = Number(state.suppHub.item?.supplement_id || 0);
      if (!sid) return;
      if (!confirm('Удалить добавку из моих БАДов? История приёмов сохранится.')) return;
      const prevMySuppActive = [...(state.mySupplements.active || [])];
      const prevMySuppFrozen = [...(state.mySupplements.frozen || [])];
      const prevToday = state.today ? JSON.parse(JSON.stringify(state.today)) : null;
      state.suppHub.deleting = true;
      removeSupplementFromMySupplementsState(sid);
      removeSupplementEverywhereInToday(sid);
      renderActiveTab();
      try {
        await api('./api/my_supplements/remove', { method: 'POST', body: { supplement_id: sid } });
        state.suppHub.open = false;
        renderActiveTab();
        await Promise.all([
          loadMySupplements({ force: true, silent: true }),
          loadToday({ force: true, silent: true }),
        ]);
        showToast('Добавка удалена из списка');
      } catch {
        state.mySupplements.active = prevMySuppActive;
        state.mySupplements.frozen = prevMySuppFrozen;
        if (prevToday) state.today = prevToday;
        recalcTodaySnapshot();
        renderActiveTab();
        showToast('Не удалось удалить добавку');
      } finally {
        state.suppHub.deleting = false;
      }
    });
    document.getElementById('hubTime')?.addEventListener('input', (e) => {
      const val = normalizeHHMM(e.target.value || '');
      state.suppHub.customTime = val;
      if (state.suppHub.timeMode === 'custom') state.suppHub.time = val;
    });
    appEl.querySelectorAll('[data-schedule-add-slot]').forEach((el) => {
      el.addEventListener('click', async () => {
        const time = normalizeHHMM(state.suppHub.timeMode === 'custom' ? state.suppHub.customTime : state.suppHub.time);
        if (!time) return showToast('Укажите корректное время');
        try {
          const out = await createScheduleSlot(time, `Слот ${time}`);
          state.suppHub.slotId = out.slotId || state.suppHub.slotId;
          state.suppHub.timeMode = 'slot';
          state.suppHub.customTime = '';
          state.suppHub.time = out.time;
          await persistSuppHub();
          renderActiveTab();
          showToast('Слот создан');
        } catch {
          showToast('Не удалось создать слот');
        }
      });
    });

    appEl.querySelectorAll('[data-supp-hub-save]').forEach((el) => {
      el.addEventListener('click', async () => {
        await persistSuppHub({ showSavedToast: true });
        renderActiveTab();
      });
    });
  }

  function findItemById(id) {
    for (const slot of state.today?.slots || []) {
      const item = (slot.items || []).find(i => String(i.supplement_id) === String(id));
      if (item) return item;
    }
    return null;
  }

  async function toggleOne(supplementId, nextStatus) {
    haptic();
    const item = findItemById(supplementId);
    if (!item) return;

    const prevSlot = findSlotBySupplementId(supplementId);
    const wasClosedBefore = slotProgress(prevSlot).closed;
    const prev = item.status;
    item.status = nextStatus;
    recalcTodaySnapshot();
    renderActiveTab();

    try {
      const out = await api("./api/today/toggle", {
        method: "POST",
        body: { supplement_id: Number(supplementId), status: nextStatus }
      });
      recalcTodaySnapshot();
      if (nextStatus === "taken") {
        const afterSlot = findSlotBySupplementId(supplementId);
        const isClosedAfter = slotProgress(afterSlot).closed;
        const perfectDay = Number(state.today?.expected || 0) >= 3 && Number(state.today?.adherence || 0) === 100;
        const gain = extractUnlockedPoints([out]);
        if (perfectDay) maybeCelebratePerfectDay(gain);
        else if (!wasClosedBefore && isClosedAfter) maybeCelebrateSlotClosed();
      }
      await showUnlockToastFromPayload(out);
    } catch (e) {
      item.status = prev;
      recalcTodaySnapshot();
      renderActiveTab();
      showToast("Ошибка синхронизации, откат");
    }
  }

  async function setSlotStatus(slotId, status) {
    haptic();
    const slot = (state.today?.slots || []).find(s => String(s.slot_id) === String(slotId));
    if (!slot) return;

    const items = slot.items || [];
    const complexes = slot.complexes || [];
    if (!items.length && !complexes.length) return;

    const snapshot = {
      items: items.map((i) => ({ id: i.supplement_id, status: i.status })),
      complexes: complexes.map((c) => ({
        id: c.complex_id,
        status: c.status,
        takenCount: c.taken_count,
        itemStatuses: (c.items || []).map((item) => ({ id: item.supplement_id, status: item.status })),
      })),
    };

    items.forEach((i) => { i.status = status; });
    complexes.forEach((complex) => {
      complex.status = status;
      complex.taken_count = status === "taken" ? (complex.total_count || 0) : 0;
      (complex.items || []).forEach((item) => { item.status = status; });
    });
    recalcTodaySnapshot();
    renderActiveTab();

    try {
      const unlockPayloads = [];
      const complexPending = complexes.map((complex) => async () => {
        const out = await api("./api/today/toggle_complex", {
          method: "POST",
          body: { complex_id: Number(complex.complex_id), status }
        });
        unlockPayloads.push(out);
      });
      await runBatched(complexPending, 3);

      const complexItemIds = new Set(
        complexes.flatMap((complex) => (complex.items || []).map((item) => String(item.supplement_id)))
      );
      const singlePending = items
        .filter((item) => !complexItemIds.has(String(item.supplement_id)))
        .map((item) => async () => {
          const out = await api("./api/today/toggle", {
            method: "POST",
            body: { supplement_id: Number(item.supplement_id), status }
          });
          unlockPayloads.push(out);
        });

      await runBatched(singlePending, 3);
      showToast(status === "taken" ? "Отметил всё как принято" : "Слот сброшен");
      if (status === "taken") {
        const afterSlot = (state.today?.slots || []).find((s) => String(s.slot_id) === String(slotId));
        const wasClosedBefore = (snapshot.items.every((x) => x.status === "taken") && snapshot.complexes.every((c) => (c.itemStatuses || []).every((x) => x.status === "taken")));
        const isClosedAfter = slotProgress(afterSlot).closed;
        const perfectDay = Number(state.today?.expected || 0) >= 3 && Number(state.today?.adherence || 0) === 100;
        const gain = extractUnlockedPoints(unlockPayloads);
        if (perfectDay) maybeCelebratePerfectDay(gain);
        else if (!wasClosedBefore && isClosedAfter) maybeCelebrateSlotClosed();
      }
      const mergedDetails = unlockPayloads.flatMap((x) => Array.isArray(x?.newly_unlocked_details) ? x.newly_unlocked_details : []);
      if (mergedDetails.length) {
        await showUnlockToastFromPayload({ newly_unlocked_details: mergedDetails });
      }
    } catch (e) {
      items.forEach((item) => {
        const old = snapshot.items.find(s => String(s.id) === String(item.supplement_id));
        if (old) item.status = old.status;
      });
      complexes.forEach((complex) => {
        const oldComplex = snapshot.complexes.find((c) => String(c.id) === String(complex.complex_id));
        if (!oldComplex) return;
        complex.status = oldComplex.status;
        complex.taken_count = oldComplex.takenCount;
        (complex.items || []).forEach((item) => {
          const oldItem = oldComplex.itemStatuses.find((x) => String(x.id) === String(item.supplement_id));
          if (oldItem) item.status = oldItem.status;
        });
      });
      recalcTodaySnapshot();
      renderActiveTab();
      showToast("Не удалось применить к слоту");
    }
  }

  async function runBatched(tasks, batchSize) {
    for (let i = 0; i < tasks.length; i += batchSize) {
      const chunk = tasks.slice(i, i + batchSize).map((fn) => fn());
      await Promise.all(chunk);
      await new Promise((resolve) => setTimeout(resolve, 80));
    }
  }

  function renderSuppHistory(history) {
    if (!history) return '<div class="muted">История пока недоступна.</div>';
    const summary = history.summary || {};
    const rows = history.entries || [];
    const summaryHtml = `<div class="history-item"><strong>Последний приём: ${esc(summary.last_taken_day || '—')}</strong><div class="muted" style="margin-top:4px">Дней с приёмом: ${Number(summary.taken_days || 0)} · Период: ${esc(summary.first_taken_day || '—')} → ${esc(summary.last_taken_day || '—')}</div></div>`;
    const rowsHtml = rows.length ? rows.map((row)=>`<div class="history-item"><strong>${esc(formatRuDate(row.day))} · ${esc(row.status_label || '—')}</strong><div class="muted" style="margin-top:4px">Доза: ${esc(row.dose_text || 'не указана')} · Время: ${esc(row.time_hint || '—')}</div></div>`).join('') : '<div class="muted">Пока нет записей о приёме этой добавки.</div>';
    return `${summaryHtml}${rowsHtml}`;
  }

  window.addEventListener('focus', () => { checkPendingPaymentStatus({ silent: true }); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkPendingPaymentStatus({ silent: true });
  });

  boot();
})();
</script>
</body>
</html>
