<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>SupplyBot WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-1: #070b1a;
      --bg-2: #101a44;
      --bg-3: #1b0f3a;
      --card: rgba(16, 24, 52, 0.68);
      --card-strong: rgba(24, 36, 74, 0.82);
      --text: #eef2ff;
      --muted: rgba(218, 228, 248, 0.8);
      --accent: #7db7ff;
      --green: #49d88d;
      --red: #ff5a6f;
      --neutral: rgba(255,255,255,0.17);
    }

    html[data-theme="nebula"] { --bg-1:#0c0a23; --bg-2:#25125d; --bg-3:#130b2d; --accent:#b48bff; }
    html[data-theme="aurora"] { --bg-1:#041a18; --bg-2:#0f3c3e; --bg-3:#12252f; --accent:#7df0c2; }
    html[data-theme="noir"] { --bg-1:#090909; --bg-2:#171717; --bg-3:#101010; --accent:#bbbbbb; }
    html[data-theme="solar"] { --bg-1:#2a1d08; --bg-2:#4e3310; --bg-3:#2b1a0b; --accent:#ffd36d; }
    html[data-theme="emerald"] { --bg-1:#062015; --bg-2:#0c4630; --bg-3:#0a2c1f; --accent:#6ff0b8; }
    html[data-theme="bloodline"] { --bg-1:#28050d; --bg-2:#4a0d1d; --bg-3:#25050f; --accent:#ff6a86; }
    html[data-theme="glitch"] { --bg-1:#0b1129; --bg-2:#1e255f; --bg-3:#13223e; --accent:#68e4ff; }
    html[data-theme="ivory"] { --bg-1:#1a1b20; --bg-2:#2a2d36; --bg-3:#1f2229; --accent:#f0e6ce; }
    html[data-theme="graphite"] { --bg-1:#101114; --bg-2:#1b1e24; --bg-3:#14161b; --accent:#c6ced9; }
    html[data-theme="sakura"] { --bg-1:#201824; --bg-2:#32243a; --bg-3:#261b2d; --accent:#ffbcd4; }
    html[data-theme="deepsea"] { --bg-1:#071a2b; --bg-2:#0f2f49; --bg-3:#0b2337; --accent:#7dd9ff; }
    html[data-theme="ember"] { --bg-1:#24130f; --bg-2:#3f241b; --bg-3:#2b1913; --accent:#ffb27d; }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 640px at 12% -8%, rgba(67, 132, 255, 0.42) 0%, transparent 62%),
        radial-gradient(980px 580px at 92% 2%, rgba(66, 48, 143, 0.42) 0%, transparent 58%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 54%, var(--bg-3) 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(900px 520px at 50% 10%, rgba(255,255,255,0.06), transparent 55%),
                  radial-gradient(1200px 900px at 50% 120%, rgba(0,0,0,0.65), transparent 55%);
      mix-blend-mode: soft-light;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px calc(100px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .headline { margin: 0; font-size: 20px; }
    .subline { color: var(--muted); font-size: 13px; margin-top: 3px; }

    .btn, .chip {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      color: var(--text);
      background: linear-gradient(170deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
      box-shadow:
        0 12px 24px rgba(0,0,0,0.34),
        0 2px 0 rgba(255,255,255,0.18) inset,
        0 -2px 0 rgba(0,0,0,0.4) inset;
    }

    .btn {
      cursor: pointer;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:active, .pressed {
      transform: translateY(1px);
      box-shadow:
        0 3px 8px rgba(0,0,0,0.35),
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 -1px 0 rgba(0,0,0,0.55) inset;
    }

    .btn.secondary { opacity: 0.88; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }

    .card {
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 22px 42px rgba(3,7,20,0.44),
        0 7px 14px rgba(2,6,18,0.4),
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 -2px 0 rgba(0,0,0,0.35) inset;
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .row > * { min-width: 0; }
    .muted { color: var(--muted); }

    .tabs {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border-radius: 22px;
      background: rgba(6, 10, 24, 0.78);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 44px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.12) inset;
      z-index: 20;
    }

    .tabs.admin-enabled { grid-template-columns: repeat(6, minmax(0, 1fr)); }

    .tab {
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      color: rgba(210, 222, 246, 0.8);
      background: rgba(255,255,255,0.03);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .tab.active {
      color: white;
      background: linear-gradient(180deg, rgba(125,183,255,0.34), rgba(73,109,198,0.24));
      box-shadow:
        0 10px 16px rgba(6,13,34,0.42),
        0 0 0 1px rgba(182, 213, 255, 0.35) inset,
        0 1px 0 rgba(255,255,255,0.2) inset;
    }

    .tab-emoji { font-size: 17px; line-height: 1; }
    .tab-emoji-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .tab-unseen-dot {
      position: absolute;
      top: -4px;
      right: -6px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #ff4d6d;
      box-shadow: 0 0 0 2px rgba(6, 10, 24, 0.92);
    }
    .tabs[data-skin="neon"] .tab.active { box-shadow: 0 0 0 1px rgba(125,210,255,.65) inset, 0 0 18px rgba(96,190,255,.55); }
    .tabs[data-skin="neon"] .tab.active::after { content:""; position:absolute; inset:-3px; border-radius:16px; border:1px solid rgba(117,226,255,.65); }
    .tabs[data-skin="thumbs"] .tab.active::after { content:"👍"; position:absolute; top:-10px; right:6px; font-size:12px; }
    .tabs[data-skin="gold"] .tab.active { box-shadow:0 0 0 1px rgba(255,211,122,.9) inset,0 8px 20px rgba(165,118,36,.45); }
    .tabs[data-skin="plasma"] .tab.active::after { content:""; position:absolute; inset:-2px; border-radius:15px; background:linear-gradient(120deg, rgba(96,163,255,.2), rgba(249,112,255,.2)); z-index:-1; filter:blur(1px);}
    .tabs[data-skin="frost"] .tab.active { box-shadow:0 0 0 1px rgba(172,236,255,.7) inset,0 0 16px rgba(141,218,255,.4);}
    .tabs[data-skin="minimal"] .tab.active { background:rgba(255,255,255,.08); box-shadow: inset 0 -2px 0 var(--accent);}
    .tabs[data-skin="glitch"] .tab.active { text-shadow: 1px 0 rgba(255,80,80,.5), -1px 0 rgba(80,220,255,.5); box-shadow:0 0 0 1px rgba(121,200,255,.35) inset, 2px 0 10px rgba(255,88,122,.2), -2px 0 10px rgba(88,195,255,.2);}
    .tabs[data-skin="glass"] { background: rgba(16,24,38,.58); border-color: rgba(198,224,255,.34); backdrop-filter: blur(18px); }
    .tabs[data-skin="glass"] .tab.active { background: rgba(168,212,255,.2); box-shadow: 0 0 0 1px rgba(194,229,255,.55) inset; }
    .tabs[data-skin="mono"] .tab { background: rgba(255,255,255,.015); color: rgba(221,226,233,.78); }
    .tabs[data-skin="mono"] .tab.active { background: rgba(255,255,255,.06); box-shadow: inset 0 -2px 0 #e1e5ec; color: #fff; }
    .tabs[data-skin="pulse2"] .tab.active { box-shadow: 0 0 0 1px rgba(255,170,200,.55) inset, 0 0 18px rgba(255,126,184,.28); animation: pulse2Active 1.4s ease-in-out infinite; }
    @keyframes pulse2Active { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } 100% { transform: translateY(0); } }
    .tab { position: relative; }
    .topbar-title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .badge-pill { font-size:11px; padding:5px 10px; border-radius:999px; border:1px solid rgba(130,167,255,.55); background:linear-gradient(170deg, rgba(125,183,255,0.26), rgba(73,109,198,0.16)); box-shadow: 0 1px 0 rgba(255,255,255,.2) inset; white-space:nowrap; }
    .ach-grid{display:grid;gap:8px;margin-top:8px;}
    .ach-item{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px;background:rgba(255,255,255,.05);}
    .ach-item.locked{opacity:.72;}
    .ach-category { margin-top: 10px; }
    .ach-category-title { font-size: 13px; color: var(--muted); margin: 8px 0 6px; text-transform: uppercase; letter-spacing: .02em; }
    .new-pill { margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: rgba(255,77,109,.18); border:1px solid rgba(255,77,109,.5); color:#ffd7df; font-size:11px; font-weight:800; }
    .cos-meta { margin-top:6px; font-size:12px; color: var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .unlock-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(6, 10, 24, 0.35);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 12px calc(12px + env(safe-area-inset-bottom));
    }
    .unlock-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.2);
      background: linear-gradient(180deg, rgba(36,56,112,.95), rgba(21,30,56,.96));
      box-shadow: 0 26px 40px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.2) inset;
      animation: unlockSheetIn .22s ease-out;
      overflow: hidden;
    }
    .unlock-card.sparkle::after {
      content: "";
      position: absolute;
      inset: -40% -10%;
      background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,.2) 50%, transparent 90%);
      transform: translateX(-120%) rotate(8deg);
      animation: unlockSparkle 1s ease-out;
      pointer-events: none;
    }
    .unlock-title { font-size: 17px; font-weight: 800; margin: 0 0 10px; }
    .unlock-list { display: grid; gap: 8px; max-height: 32vh; overflow: auto; padding-right: 2px; }
    .unlock-item { border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 10px; background: rgba(255,255,255,.05); }
    .unlock-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .unlock-rewards { margin-top: 10px; border-top: 1px dashed rgba(255,255,255,.2); padding-top: 8px; }
    .unlock-actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
    @keyframes unlockSparkle {
      0% { transform: translateX(-120%) rotate(8deg); opacity: 0; }
      20% { opacity: .95; }
      100% { transform: translateX(120%) rotate(8deg); opacity: 0; }
    }
    @keyframes unlockSheetIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .slot-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top: 8px; }
    .chip { border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
    .chip.green { background: rgba(72,216,141,0.2); color: #bbffd9; }
    .ach-progress { margin-top: 8px; }
    .ach-progress .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
    .ach-progress .bar > i { display:block; height:100%; background: linear-gradient(90deg, #82a7ff, #49d88d); }
    .level-mini { margin-bottom: 10px; }
    .level-mini .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
    .level-mini .bar > i { display:block; height:100%; background: linear-gradient(90deg, #8fb0ff, #66e0a6); }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.14) inset;
    }

    .seg-btn {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      min-width: 84px;
    }

    .seg-btn.active {
      color: #fff;
      background: linear-gradient(180deg, rgba(125,183,255,0.32), rgba(73,109,198,0.22));
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 14px rgba(7,15,38,0.42);
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.14);
      text-align: left;
      padding: 10px;
      border-radius: 13px;
      margin-top: 8px;
      background: rgba(255,255,255,0.05);
      color: inherit;
      overflow: hidden;
    }

    .item-row > span,
    .item-row > strong {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .catalog-toolbar,
    .catalog-row,
    .catalog-list,
    .catalog-meta,
    .catalog-active-filters,
    .catalog-item-head {
      min-width: 0;
    }

    .catalog-toolbar { display: grid; gap: 8px; }
    .catalog-row { display: flex; align-items: center; gap: 8px; }
    .catalog-row > * { min-width: 0; }
    .catalog-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .catalog-active-filters { display:flex; flex-wrap:wrap; gap:8px; }
    .catalog-list { display:grid; gap:10px; }
    .catalog-status { text-align:center; font-size:12px; color: var(--muted); padding: 6px 0; }
    .catalog-skeleton { height: 72px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(110deg, rgba(255,255,255,0.05) 8%, rgba(255,255,255,0.12) 18%, rgba(255,255,255,0.05) 33%); background-size: 180% 100%; animation: shimmer 1.4s linear infinite; }
    .supp-name {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.35;
    }
    .catalog-quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; margin-top: 8px; }
    @media (min-width: 860px) {
      .catalog-quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .catalog-quick-card {
      display:flex;
      align-items:center;
      gap:8px;
      width:100%;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      color: inherit;
      padding: 8px 10px;
      text-align:left;
    }
    .catalog-quick-card.active {
      border-color: rgba(129,185,255,0.7);
      box-shadow: 0 0 0 1px rgba(129,185,255,0.35) inset, 0 8px 20px rgba(44,84,166,0.28);
    }
    .catalog-quick-icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      background: rgba(125,183,255,0.14);
      color: rgba(157,203,255,0.95);
      flex: 0 0 30px;
    }
    .catalog-quick-icon svg { width: 18px; height: 18px; display:block; color: inherit; fill: currentColor; stroke: currentColor; }


    .input, .select, .textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      background: rgba(255,255,255,0.11);
      color: var(--text);
      padding: 10px 12px;
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.12) inset;
    }
    .textarea { min-height: 88px; resize: vertical; }

    .btn, .chip, .card, .tab, .input, .select, .textarea, .search-input {
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .search-input {
      width: 100%;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.14) inset;
    }

    .search-input:focus,
    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: rgba(125,183,255,0.75);
      box-shadow: 0 0 0 3px rgba(125,183,255,0.18), 0 10px 24px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.18) inset;
    }

    .card.item-row:active,
    button.item-row:active,
    .tab:active,
    .chip:active {
      transform: translateY(1px);
      box-shadow: 0 8px 14px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.12) inset;
    }
    .error-text { color: #ffb3bb; font-size: 12px; margin-top: 4px; }
    .admin-grid { display:grid; gap:10px; }
    .admin-card { cursor:pointer; }
    .admin-card.selecting { display:flex; align-items:flex-start; gap:10px; }
    .admin-select-count { margin-top:8px; font-size:12px; color: var(--muted); }
    .bulk-bar { position: fixed; left:10px; right:10px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 29; display:flex; gap:8px; overflow-x:auto; padding:10px; border-radius:16px; background: rgba(8,13,34,0.92); border:1px solid rgba(255,255,255,0.2); }
    .bulk-quick { display:flex; gap:8px; }
    .bulk-more { position: relative; }
    .bulk-menu { position:absolute; right:0; bottom:42px; display:grid; gap:6px; min-width:180px; padding:8px; border-radius:12px; background: rgba(8,13,34,0.96); border:1px solid rgba(255,255,255,0.2); }

    .status-pill {
      width: clamp(86px, 15%, 112px);
      min-width: clamp(86px, 15%, 112px);
      max-width: clamp(86px, 15%, 112px);
      flex: 0 0 clamp(86px, 15%, 112px);
      text-align: center;
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: normal;
      line-height: 1.15;
      min-height: 44px;
      display: grid;
      align-items: center;
    }

    .status-pill-icon { display:block; font-size:13px; line-height:1; margin-bottom:2px; }
    .status-pill-label { display:block; }

    .today-item-row { align-items: flex-start; }
    .today-item-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.35;
      padding-top: 2px;
    }

    .status-taken { background: rgba(73,216,141,0.24); border-color: rgba(158,255,205,0.72); box-shadow: 0 0 12px rgba(73,216,141,0.42); }
    .status-skipped { background: rgba(255,107,121,0.24); border-color: rgba(255,167,177,0.65); box-shadow: 0 0 10px rgba(255,107,121,0.35); }
    .status-none { background: var(--neutral); border-color: rgba(255,255,255,0.2); }

    .fade { animation: fadeIn .22s ease; }
    @keyframes fadeIn { from {opacity: 0; transform: translateY(6px);} to {opacity: 1; transform: translateY(0);} }
    @keyframes shimmer { 0% { background-position: 180% 0; } 100% { background-position: -20% 0; } }

    .preview-grid { display: grid; gap: 10px; }
    .preview-card {
      border-radius: 16px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      filter: blur(2px);
      opacity: 0.75;
    }

    .plans { display: grid; gap: 10px; }

    .toast-wrap {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(80px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 25;
    }

    .toast {
      background: rgba(10, 12, 28, 0.94);

<body>
  <div id="app"></div>
  <div id="toastWrap" class="toast-wrap"></div>
<script>
(function () {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const state = {
    initData: tg?.initData || "",
    me: null,
    userId: null,
    activeTab: "today",
    today: null,
    complexes: [],
    loadingToday: false,
    loadingStats: false,
    stats: null,
    ach: null,
    ui: { unseenAchCount: 0, achFilter: "all", achQuery: "", microWowLastAt: 0 },
    unlockToast: { open: false, applying: false, items: [], sparkleTick: 0 },
    mySupplements: { open: false, tab: "active", loading: false, busy: {}, active: [], frozen: [] },
    suppHub: { open: false, loading: false, saving: false, item: null, slots: [], slotId: "morning", time: "", doseText: "", noteText: "", remindersMode: "slot", reminderTimes: [], reminderInput: "", historyOpen: false, historyLoading: false, history: null, deleting: false },
    toastTimer: null,
    catalog: {
      q: "", page: 0, items: [], total: 0, loading: false,
      loadingMore: false,
      hasMore: true,
      error: false,
      filters: { evidence: [], targets: [], burdens: [], sort: "alpha" },
      detail: null, detailLoading: false, filtersOpen: false,
      detailSection: null
    },
    searchDebounce: null,
    bodyMap: null,
    loadingBodyMap: false,
    bodyMapSheet: null,
    profile: { data: null, loading: false, saving: false },
    profileLabs: { reports: [], loading: false, saving: false },
    profileNutrients: { items: [], loading: false },
    profileOverview: null,
    nutrientAssistant: { selectedCode: "vitamin_d", preview: null, loadingPreview: false, plan: null, loadingPlan: false, plans: [], loadingPlans: false, explanation: null, loadingExplanation: false, explanationMeta: null, currentPlanId: null, reminders: [], loadingReminders: false, dashboard: null, onboarding: null, onboardingStep: 0 },
    profileUi: { editOpen: false, manualOpen: false, uploadOpen: false, reviewOpen: false, selectedReportId: null, uploading: false, savingManual: false, savingReview: false },
    survey: {
      step: 0,
      loading: false,
      view: "wizard",
      target: null,
      loadedKey: "",
      checkinId: null,
      recommendations: [],
      selected: {},
      applying: false,
      helpOpen: false,
      answers: { energy:"", sleep:"", stress:"", training:"", goals:[], note:"" }
    },
    admin: {
      q: "",
      page: 0,
      pageSize: 20,
      loading: false,
      items: [],
      total: 0,
      filters: { is_active: "", evidence: "" },
      detail: null,
      auditOpen: false,
      searchDebounce: null,
      savingField: "",
      errors: {},
      selectionMode: false,
      selectedIds: {},
      bulkMenuOpen: false,
      bulkPrompt: "",
      bulkConfirm: null,
      userLookupId: "",
      userDetail: null,
      userBanReason: "",
      userDeleteConfirm: "",
      roleTargetId: "",
      diagnostics: null,
      diagConfirmText: "",
      diagLoading: false,
      purchaseImportText: "",
      purchaseImportLoading: false,
      purchaseImportReport: null,
      duplicates: [],
      duplicatesLoading: false,
      duplicateResolveBusy: ""
    },
    settingsUi: { openMySuppBusy: false },
    settingsData: { tz_name: 'UTC', loading: false, offer_url: '', privacy_url: '', offer_version: '', privacy_version: '' }
  };

  const APP_NAME = "SupplyBot";
  const appEl = document.getElementById("app");
  const TARGET_LABELS_RU = {
    brain: "Мозг",
    heart: "Сердце",
    gut: "ЖКТ",
    liver: "Печень",
    kidney: "Почки",
    joints: "Суставы",
    muscle: "Мышцы",
    skin: "Кожа",
    immune: "Иммунитет",
    sleep: "Сон",
    mood: "Настроение"
  };
  const BURDEN_LABELS_RU = {
    liver: "Печень",
    kidney: "Почки",
    gut: "ЖКТ"
  };
  const CATALOG_QUICK_CATEGORIES = [
    { token: "liver", label: "Печень" },
    { token: "kidney", label: "Почки" },
    { token: "heart", label: "Сердце" },
    { token: "brain", label: "Мозг" },
    { token: "gut", label: "ЖКТ" },
    { token: "sleep", label: "Сон" },
    { token: "mood", label: "Настроение" },
    { token: "immune", label: "Иммунитет" },
  ];
  const tabs = [
    { id: "today", title: "Сегодня", icon: "✅" },
    { id: "catalog", title: "Каталог", icon: "📚" },
    { id: "survey", title: "Опрос", icon: "📝" },
    { id: "profile", title: "Профиль", icon: "👤" },
    { id: "settings", title: "Настройки", icon: "⚙️" }
  ];
  let catalogObserver = null;
  state.organSvgs = state.organSvgs || {};

  function activeTabs() {
    return state.me?.role && state.me.role !== "none" ? tabs.concat([{ id: "admin", title: "Админ", icon: "🛠" }]) : tabs;
  }

  const themeText = tg?.themeParams?.text_color || "#eef2ff";
  document.documentElement.style.setProperty("--text", themeText);

  function haptic() {
    tg?.HapticFeedback?.impactOccurred?.("light");
  }

  function showToast(text) {
    const wrap = document.getElementById("toastWrap");
    wrap.innerHTML = `<div class="toast fade">${text}</div>`;
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { wrap.innerHTML = ""; }, 2200);
  }

  function formatUtcShort(iso) {
    const value = String(iso || "").trim();
    if (!value) return "";
    const d = new Date(value.replace(" ", "T").replace("Z", "") + (value.endsWith("Z") ? "" : ""));
    if (Number.isNaN(d.getTime())) return value;
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }


  function applyCosmetics(c) {
    const cosmetics = c || {};
    document.documentElement.dataset.theme = cosmetics.theme_id || "base";
    document.documentElement.dataset.tabSkin = cosmetics.tab_skin_id || "classic";
    document.documentElement.dataset.badge = cosmetics.badge_id || "none";
  }

  function getThemeMeta(id) {
    const themes = state.ach?.catalogs?.themes || [];
    return themes.find((x) => x.id === id) || { id: String(id || ""), emoji: "", title_ru: String(id || "") };
  }

  function getTabMeta(id) {
    const tabs = state.ach?.catalogs?.tab_skins || [];
    return tabs.find((x) => x.id === id) || { id: String(id || ""), emoji: "", title_ru: String(id || "") };
  }

  function getBadgeMeta(id) {
    const badges = state.ach?.catalogs?.badges || [];
    return badges.find((b) => b.id === id) || { id: String(id || ""), emoji: "", title_ru: String(id || "") };
  }

  function getUnseenAchievementsCount() {
    const achCount = Number(state.ach?.unseen_count || 0);
    const uiCount = Number(state.ui?.unseenAchCount || 0);
    return Math.max(0, achCount, uiCount);
  }

  async function loadAchievements(force = false) {
    if (state.ach && !force) return state.ach;
    const data = await api("./api/achievements/summary");
    state.ach = data;
    state.ui = state.ui || {};
    state.ui.unseenAchCount = Number(data.unseen_count || 0);
    applyCosmetics(data.cosmetics || {});
    return data;
  }

  async function markAchievementsSeen() {
    try {
      await api("./api/achievements/mark_seen", { method: "POST" });
    } catch {}
    state.ach = state.ach || {};
    state.ui = state.ui || {};
    state.ach.unseen_count = 0;
    state.ui.unseenAchCount = 0;
  }

  function getUnlockPatchFromItems(items) {
    const details = Array.isArray(items) ? items : [];
    if (!details.length) return null;
    const byKey = new Map((state.ach?.achievements || []).map((a) => [String(a.key || ""), a]));
    const patch = {};
    for (const detail of details) {
      const ach = byKey.get(String(detail?.key || ""));
      const unlock = ach?.reward?.unlock || {};
      const theme = (unlock.themes || []).slice(-1)[0];
      const tabSkin = (unlock.tab_skins || []).slice(-1)[0];
      const badge = (unlock.badges || []).slice(-1)[0];
      if (theme) patch.theme_id = theme;
      if (tabSkin) patch.tab_skin_id = tabSkin;
      if (badge) patch.badge_id = badge;
    }
    return Object.keys(patch).length ? patch : null;
  }

  async function showUnlockToastFromPayload(payload) {
    const details = Array.isArray(payload?.newly_unlocked_details) ? payload.newly_unlocked_details : [];
    if (!details.length) return;
    try { await loadAchievements(true); } catch {}
    state.unlockToast = {
      open: true,
      applying: false,
      items: details,
      sparkleTick: Date.now(),
    };
    tg?.HapticFeedback?.notificationOccurred?.("success");
    renderMainApp();
  }

  async function applyUnlockCosmeticsFromModal() {
    if (state.unlockToast?.applying) return;
    state.unlockToast = { ...(state.unlockToast || {}), applying: true };
    renderMainApp();
    try {
      const patch = getUnlockPatchFromItems(state.unlockToast?.items || []);
      if (!patch) {
        state.unlockToast = { open: false, applying: false, items: [], sparkleTick: 0 };
        renderMainApp();
        return;
      }
      const res = await api("./api/cosmetics/set", { method: "POST", body: patch });
      state.ach = state.ach || {};
      state.ach.cosmetics = res.cosmetics;
      state.me = { ...(state.me || {}), cosmetics: res.cosmetics };
      applyCosmetics(res.cosmetics);
      showToast("Косметика применена");
    } catch {
      showToast("Не удалось применить косметику");
    } finally {
      state.unlockToast = { open: false, applying: false, items: [], sparkleTick: 0 };
      renderMainApp();
    }
  }

  function closeUnlockToast() {
    state.unlockToast = { open: false, applying: false, items: [], sparkleTick: 0 };
    renderMainApp();
  }

  function renderUnlockToastCard() {
    const toast = state.unlockToast || {};
    if (!toast.open) return "";
    const items = Array.isArray(toast.items) ? toast.items : [];
    const patch = getUnlockPatchFromItems(items);
    const hasCosmeticReward = !!patch;
    const rarityMap = { common: "Обычная", rare: "Редкая", epic: "Эпическая", legendary: "Легендарная" };
    return `
      <div class="unlock-overlay" data-unlock-overlay>
        <section class="unlock-card sparkle" data-sparkle-key="${toast.sparkleTick || 0}">
          <h3 class="unlock-title">🏆 Достижение открыто</h3>
          <div class="unlock-list">
            ${items.map((item) => `
              <div class="unlock-item">
                <div><strong>${esc(item.title_ru || "Достижение")}</strong></div>
                <div class="unlock-meta">${esc(rarityMap[item.rarity] || item.rarity || "Обычная")} · ${Number(item.points || 0)} очков</div>
                ${(Array.isArray(item.reward_verbose) && item.reward_verbose.length) ? `<div class="unlock-rewards"><div class="muted" style="margin-bottom:6px">Открылось</div>${item.reward_verbose.map((x) => `<div>${esc(x)}</div>`).join("")}</div>` : ""}
              </div>
            `).join("")}
          </div>
          <div class="unlock-actions">
            <button class="btn secondary" data-unlock-close>Закрыть</button>
            <button class="btn" data-unlock-apply ${toast.applying ? "disabled" : ""}>${hasCosmeticReward ? (toast.applying ? "Применяю..." : "Применить") : "Ок"}</button>
          </div>
        </section>
      </div>
    `;
  }

  function showBannedScreen(reason) {
    appEl.innerHTML = `
      <div class="main-content">
        <div class="card fade" style="margin-top:24px; text-align:center;">
          <h3 style="margin:0">Доступ ограничен</h3>
          <p class="muted">${reason ? esc(reason) : 'Если это ошибка — напишите в поддержку.'}</p>
          <button class="btn" id="closeBannedBtn">Закрыть</button>
        </div>
      </div>
    `;
    document.getElementById('closeBannedBtn')?.addEventListener('click', ()=> tg?.close?.());
  }

  function formatDate() {
    return new Date().toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "short" });
  }

  function evidenceUserLabel(value) {
    const key = String(value || '').trim().toUpperCase();
    const map = {
      A: 'A — сильная база',

  async function api(path, { method = "GET", body } = {}) {
    const res = await fetch(path, {
      method,
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": state.initData
      },
      body: body ? JSON.stringify(body) : undefined
    });

    if (res.status === 401) {
      showToast("Открой WebApp внутри Telegram");
      throw new Error("UNAUTHORIZED");
    }

    if (res.status === 402) {
      state.me = { ...(state.me || {}), premium: false, starter_trial_active: false, webapp_access: false };
      renderPaywall();
      throw new Error("PREMIUM_REQUIRED");
    }

    if (res.status === 403) {
      const data403 = await res.json().catch(() => ({}));
      if (data403?.code === "ADMIN_REQUIRED" || data403?.code === "PERMISSION_DENIED") throw new Error("PERMISSION_DENIED");
      if (data403?.code === "BANNED") {
        showBannedScreen(data403?.reason || "");
        throw new Error("BANNED");
      }
      throw new Error("FORBIDDEN");
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      const err = new Error(data.message || data.error || data.code || `HTTP_${res.status}`);
      if (data && typeof data === 'object') {
        if (data.code) err.code = String(data.code);
        if (data.message) err.serverMessage = String(data.message);
      }
      throw err;
    }
    return data;
  }

  async function apiText(path, textBody) {
    const res = await fetch(path, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain; charset=utf-8",
        "X-Telegram-Init-Data": state.initData
      },
      body: String(textBody || "")
    });
    if (res.status === 401) {
      showToast("Открой WebApp внутри Telegram");
      throw new Error("UNAUTHORIZED");
    }
    if (res.status === 402) {
      showToast("Требуется Premium");
      throw new Error("PREMIUM_REQUIRED");
    }
    if (res.status === 403) {
      const data403 = await res.json().catch(() => ({}));
      if (data403?.code === "ADMIN_REQUIRED" || data403?.code === "PERMISSION_DENIED") throw new Error("PERMISSION_DENIED");
      throw new Error("FORBIDDEN");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      throw new Error(data.code || data.error || `HTTP_${res.status}`);
    }
    return data;
  }

  function localDateISO(d = new Date()) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function defaultSurveyTarget() {
    return new Date().getHours() >= 18 ? 'tomorrow' : 'today';
  }

  function surveyTargetDateISO(target) {
    const d = new Date();
    if (target === 'tomorrow') d.setDate(d.getDate() + 1);
    return localDateISO(d);
  }

  function surveyTargetKey() {
    const uid = state.userId || tg?.initDataUnsafe?.user?.id || 'anon';
    return `supply:survey_target:${uid}:${localDateISO()}`;
  }

  function initSurveyTarget() {
    if (state.survey.target) return;
    const saved = localStorage.getItem(surveyTargetKey());
    state.survey.target = (saved === 'today' || saved === 'tomorrow') ? saved : defaultSurveyTarget();
    localStorage.setItem(surveyTargetKey(), state.survey.target);
  }

  function surveyStorageKey() {
    initSurveyTarget();
    const uid = state.userId || tg?.initDataUnsafe?.user?.id || "anon";
    const target = state.survey.target || 'today';
    return `survey:${uid}:${surveyTargetDateISO(target)}:${target}`;
  }

  async function loadSurveyForTarget(force=false) {
    initSurveyTarget();
    const key = `${state.survey.target}:${surveyTargetDateISO(state.survey.target)}`;
    if (state.survey.loadedKey === key && !force) return;
    state.survey.step = 0;
    state.survey.view = 'wizard';
    state.survey.checkinId = null;
    state.survey.recommendations = [];
    state.survey.selected = {};
    state.survey.helpOpen = false;
    state.survey.answers = { energy:"", sleep:"", stress:"", training:"", goals:[], note:"" };
    try {
      const data = await api(`./api/checkin/today?target=${state.survey.target}`);
      const saved = localStorage.getItem(surveyStorageKey());
      if (saved) state.survey.answers = { ...state.survey.answers, ...JSON.parse(saved) };
      if (data?.checkin) {
        state.survey.checkinId = data.checkin.id;
        state.survey.answers = { ...state.survey.answers, ...(data.checkin.answers || {}) };
        state.survey.recommendations = data.checkin.recommendations || [];
        state.survey.selected = Object.fromEntries((state.survey.recommendations || []).map((x) => [x.supplement_id, true]));
        if (state.survey.recommendations.length) state.survey.view = 'review';
      }
      state.survey.loadedKey = key;
    } catch {}
  }

  async function openSupplementDetail(slug, { silent = false } = {}) {
    const key = String(slug || '').trim();
    if (!key) return;
    state.catalog.detailCache = state.catalog.detailCache || {};
    const cached = state.catalog.detailCache[key];
    state.catalog.detail = cached || { slug: key, name_ru: 'Карточка добавки', _loading: true };
    state.catalog.detailSection = cached ? defaultDetailSection(cached) : null;
    renderActiveTab();
    if (cached && !silent) return;
    try {
      const d = await api(`./api/supplement/${key}`);
      state.catalog.detailCache[key] = d.item;
      state.catalog.detail = d.item;
      state.catalog.detailSection = defaultDetailSection(d.item);
      renderActiveTab();
    } catch {
      if (!cached) {
        state.catalog.detail = null;
        state.catalog.detailSection = null;
        renderActiveTab();
      }
      showToast('Не удалось открыть карточку');
    }
  }

  async function loadCatalog(force) {
    const c = state.catalog;
    if ((c.loading || c.loadingMore) && !force) return;
    if (c.page > 0) c.loadingMore = true;
    else c.loading = true;
    if (!c.items.length || c.page > 0) renderActiveTab();

    const f = c.filters;
    const qp = new URLSearchParams({ q: c.q || '', page: String(c.page), page_size: '20', sort: f.sort || 'alpha' });
    if (f.evidence.length) qp.set('evidence', f.evidence.join(','));
    if (f.targets.length) qp.set('targets', f.targets.join(','));
    if (f.burdens.length) qp.set('burdens', f.burdens.join(','));
    try {
      const res = await api(`./api/catalog?${qp.toString()}`);
      const nextItems = Array.isArray(res.items) ? res.items : [];
      const mergedItems = c.page === 0 ? nextItems : c.items.concat(nextItems);
      state.catalog.items = mergedItems;

      let total = Number(res.total);
      if (!Number.isFinite(total) || total < 0) total = 0;

      if (c.page === 0 && total === 0 && nextItems.length > 0) {
        try {
          const verify = await api(`./api/catalog?${qp.toString()}&_verify_total=1`);
          const verifiedTotal = Number(verify.total);
          if (Number.isFinite(verifiedTotal) && verifiedTotal > 0) total = verifiedTotal;
        } catch {}
        if (total === 0) {
          total = nextItems.length;
        }
      }

      if (c.page > 0) {
        total = Math.max(total, mergedItems.length, Number(state.catalog.total) || 0);
      }

      state.catalog.total = total;
      state.catalog.hasMore = mergedItems.length < total;
      state.catalog.error = false;
    } catch (e) {
      state.catalog.error = e.message !== 'PREMIUM_REQUIRED';
      if (c.page > 0) state.catalog.page = Math.max(0, c.page - 1);
    } finally {
      state.catalog.loading = false;
      state.catalog.loadingMore = false;
      renderActiveTab();
    }
  }

  async function loadCatalogMore() {
    const c = state.catalog;
    if (c.loading || c.loadingMore || !c.hasMore || c.filtersOpen || c.error) return;
    state.catalog.page += 1;
    await loadCatalog(true);
  }

  function setupCatalogInfiniteScroll() {
    catalogObserver?.disconnect?.();
    catalogObserver = null;
    const sentinel = document.getElementById('catalogSentinel');
    if (!sentinel || state.activeTab !== 'catalog') return;
    catalogObserver = new IntersectionObserver((entries) => {
      const hit = entries.some((entry) => entry.isIntersecting);
      if (!hit) return;
      loadCatalogMore();
    }, { root: null, rootMargin: '600px 0px', threshold: 0 });
    catalogObserver.observe(sentinel);
  }

  function duplicateDisplayName(item) {
    const ru = String(item?.name_ru || '').trim();
    const en = String(item?.name_en || '').trim();
    const base = String(item?.name || '').trim();
    if (ru && en && ru !== en) return `${ru} (${en})`;
    return ru || en || base || String(item?.slug || 'Без названия');
  }

  function renderAdminDuplicateAlert() {
    const groups = Array.isArray(state.admin.duplicates) ? state.admin.duplicates : [];
    if (!groups.length) return '<div class="muted">Дубликаты не найдены.</div>'; 
    const busy = String(state.admin.duplicateResolveBusy || '');
    return `<div class="card fade" style="border:1px solid rgba(255,145,107,.45)">
      <div class="row"><strong>⚠️ Найдены дубликаты по имени</strong><span class="muted">${groups.length}</span></div>
      <div class="muted" style="margin-top:6px">Выберите, какую запись оставить. Вторая будет удалена.</div>
      <div style="margin-top:8px; display:grid; gap:8px;">
        ${groups.map((g)=>{
          const candidates = Array.isArray(g.candidates) ? g.candidates : [];
          if (candidates.length < 2) return '';
          const left = candidates[0];
          const right = candidates[1];
          const pairKey = `${Math.min(left.id, right.id)}:${Math.max(left.id, right.id)}`;
          const disable = busy === pairKey;
          return `<div class="card" style="padding:10px; background:rgba(255,255,255,.02)">
            <div><strong>${esc(g.name || 'duplicate')}</strong></div>
            <div class="muted" style="margin-top:4px">${candidates.length} совпадения</div>
            <div style="display:grid; gap:6px; margin-top:8px">
              <div>1) ${esc(duplicateDisplayName(left))} <span class="muted">#${left.id} · ${esc(left.slug || '')}</span></div>
              <div>2) ${esc(duplicateDisplayName(right))} <span class="muted">#${right.id} · ${esc(right.slug || '')}</span></div>
            </div>
            <div class="row" style="margin-top:8px; gap:6px; flex-wrap:wrap">
              <button class="btn" data-dup-keep="${left.id}" data-dup-remove="${right.id}" ${disable ? 'disabled' : ''}>Оставить #${left.id}</button>
              <button class="btn secondary" data-dup-keep="${right.id}" data-dup-remove="${left.id}" ${disable ? 'disabled' : ''}>Оставить #${right.id}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

function adminField(label, field, value, kind='input') {

      : `<input class="input" data-admin-field="${field}" value="${esc(value || '')}" />`;
    return `<div class="card" style="margin-bottom:8px"><div class="row"><strong>${label}</strong><button class="btn" data-admin-save="${field}">Сохранить</button></div>${input}${err ? `<div class="error-text">${esc(err)}</div>` : ''}</div>`;
  }

  async function loadAdminSupplements(force) {
    if (state.admin.loading && !force) return;
    state.admin.loading = true;
    renderActiveTab();
    try {
      const a = state.admin;
      const qp = new URLSearchParams({ q: a.q || '', page: String(a.page), page_size: String(a.pageSize) });
      if (a.filters.is_active !== '') qp.set('is_active', a.filters.is_active);
      if (a.filters.evidence) qp.set('evidence', a.filters.evidence);
      const res = await api(`./api/admin/supplements?${qp.toString()}`);
      a.items = a.page === 0 ? (res.items || []) : a.items.concat(res.items || []);
      a.total = res.total || 0;
    } catch (e) {
      if (e.message === 'PERMISSION_DENIED') showToast('Только для админов');
      else showToast('Ошибка загрузки admin-списка');
    } finally {
      state.admin.loading = false;
      renderActiveTab();
    }
  }

  async function loadAdminDuplicates() {
    state.admin.duplicatesLoading = true;
    try {
      const res = await api('./api/admin/duplicates');
      state.admin.duplicates = Array.isArray(res.groups) ? res.groups : [];
    } catch {
      state.admin.duplicates = [];
    } finally {
      state.admin.duplicatesLoading = false;
      renderActiveTab();
    }
  }

  async function resolveAdminDuplicate(keepId, removeId) {
    const k = Number(keepId || 0);
    const r = Number(removeId || 0);
    if (!k || !r || k === r) return;
    if (!confirm(`Оставить запись #${k} и удалить #${r}?`)) return;
    state.admin.duplicateResolveBusy = `${Math.min(k, r)}:${Math.max(k, r)}`;
    renderActiveTab();
    try {
      await api('./api/admin/duplicates/resolve', { method:'POST', body:{ keep_id: k, remove_id: r } });
      showToast('Дубликат обработан');
      state.admin.page = 0;
      await loadAdminSupplements(true);
      await loadAdminDuplicates();
    } catch (e) {
      const code = String(e?.code || '').trim();
      const messageMap = {
        duplicate_name_mismatch: 'Название дублей не совпало',
        duplicate_merge_failed: 'Не удалось объединить записи',
        supplement_not_found: 'Запись не найдена',
      };
      const humanText = messageMap[code] || e?.serverMessage || e?.message || 'Не удалось обработать дубликат';
      showToast(humanText);
    } finally {
      state.admin.duplicateResolveBusy = '';
      renderActiveTab();
    }
  }

  async function loadAdminSupplement(id) {
    try {
      const res = await api(`./api/admin/supplement/${id}`);
      state.admin.detail = res;
      state.admin.errors = {};
      renderActiveTab();
    } catch (e) {
      showToast('Не удалось открыть запись');
    }
  }

  async function saveAdminField(field) {
    const detail = state.admin.detail?.item;
    if (!detail) return;
    const value = detail[field] ?? '';
    try {
      await api(`./api/admin/supplement/${detail.id}/set_field`, { method:'POST', body:{ field, value } });
      state.admin.errors[field] = '';
      await loadAdminSupplement(detail.id);
      showToast('Сохранено');
    } catch (e) {
      state.admin.errors[field] = `Ошибка: ${e.message}`;
      renderActiveTab();
    }
  }

  async function runDiagnostics(applyMode) {
    state.admin.diagLoading = true;
    renderActiveTab();
    try {
      const res = await api('./api/admin/diagnostics/run', { method:'POST', body:{ apply: !!applyMode } });
      state.admin.diagnostics = res;
      showToast(applyMode ? 'Ремонт завершён' : 'Проверка завершена');
    } catch (e) {
      if (e.message === "PERMISSION_DENIED") { showToast('Нет прав'); }
      else showToast('Не удалось выполнить диагностику');
    } finally {
      state.admin.diagLoading = false;
      renderActiveTab();
    }
  }

  async function runBulk(op, params) {
    const ids = selectedAdminIds();
    if (!ids.length) { showToast('Выберите элементы'); return; }
    try {
      const preview = await api('./api/admin/bulk/preview', { method:'POST', body:{ ids, op, params } });
      state.admin.bulkConfirm = { preview, op, params };
      renderActiveTab();
    } catch (e) {
      if (e.message === 'PERMISSION_DENIED') { state.me.role = "none"; state.me.perms = {}; state.activeTab = 'today'; renderMainApp(); renderActiveTab(); showToast('нет прав'); return; }
      showToast('Ошибка preview');
    }
  }

  function bindAdminEvents() {
    document.getElementById('adminUserTgId')?.addEventListener('input', (e)=>{ state.admin.userLookupId = e.target.value; });
    document.getElementById('adminUserBanReason')?.addEventListener('input', (e)=>{ state.admin.userBanReason = e.target.value; });
    document.getElementById('adminUserDeleteConfirm')?.addEventListener('input', (e)=>{ state.admin.userDeleteConfirm = e.target.value; });
    document.getElementById('adminUserFind')?.addEventListener('click', async ()=>{
      const raw = String(state.admin.userLookupId || '').trim();
      if (!/^\d+$/.test(raw)) return showToast('Введите numeric tg_id');
      try {
        const res = await api(`./api/admin/user/${raw}`);
        state.admin.userDetail = res.item;
        state.admin.userBanReason = res.item?.banned_reason || '';
        state.admin.userDeleteConfirm = '';
        renderActiveTab();
      } catch { showToast('Пользователь не найден'); }
    });
    appEl.querySelectorAll('[data-admin-user-ban]').forEach((el)=>el.addEventListener('click', async (e)=>{
      const target = state.admin.userDetail;
      if (!target) return;
      const to = Number(e.currentTarget.dataset.adminUserBan || 0);
      if (to === 1 && !confirm('Подтвердить бан пользователя?')) return;
      if (to === 0 && !confirm('Подтвердить разбан пользователя?')) return;
      try {
        await api(`./api/admin/user/${target.tg_user_id}/ban`, { method:'POST', body:{ is_banned: to, reason: state.admin.userBanReason || '' } });
        const fresh = await api(`./api/admin/user/${target.tg_user_id}`);
        state.admin.userDetail = fresh.item;
        showToast(to ? 'Пользователь забанен' : 'Пользователь разбанен');
        renderActiveTab();
      } catch { showToast('Не удалось выполнить действие'); }
    }));
    document.getElementById('adminUserDeleteBtn')?.addEventListener('click', async ()=>{
      const target = state.admin.userDetail;
      if (!target) return;
      if (String(state.admin.userDeleteConfirm || '').trim() !== 'DELETE') return showToast('Введите DELETE для подтверждения');
      if (!confirm('Удалить пользователя? Данные будут очищены, доступ заблокирован.')) return;
      try {
        await api(`./api/admin/user/${target.tg_user_id}/delete`, { method:'POST' });
        const fresh = await api(`./api/admin/user/${target.tg_user_id}`);
        state.admin.userDetail = fresh.item;
        showToast('Пользователь удалён');
        renderActiveTab();
      } catch { showToast('Ошибка удаления'); }
    });
    document.getElementById('adminDupRefresh')?.addEventListener('click', async ()=>{ await loadAdminDuplicates(); });
    document.getElementById('adminSearch')?.addEventListener('input', (e)=>{
      state.admin.q = e.target.value;
      clearTimeout(state.admin.searchDebounce);
      state.admin.searchDebounce = setTimeout(async ()=>{ state.admin.page = 0; await loadAdminSupplements(true); }, 250);
    });
    document.getElementById('adminSelectionToggle')?.addEventListener('click', ()=>{
      state.admin.selectionMode = !state.admin.selectionMode;
      state.admin.bulkPrompt = '';
      state.admin.bulkConfirm = null;
      state.admin.bulkMenuOpen = false;
      if (!state.admin.selectionMode) clearAdminSelection();
      renderActiveTab();
    });
    document.getElementById('adminActive')?.addEventListener('change', async (e)=>{ state.admin.filters.is_active = e.target.value; state.admin.page=0; await loadAdminSupplements(true); });
    document.getElementById('adminEvidence')?.addEventListener('change', async (e)=>{ state.admin.filters.evidence = e.target.value; state.admin.page=0; await loadAdminSupplements(true); });
    document.getElementById('adminMore')?.addEventListener('click', async ()=>{ state.admin.page += 1; await loadAdminSupplements(true); });

  function bodyMapSystem(key) {

  async function fetchOrganSvg(key) {
    if (state.organSvgs[key]) return state.organSvgs[key];
    const fallback = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="icon"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
    try {

      state.organSvgs[key] = res.ok ? await res.text() : fallback;
    } catch {
      state.organSvgs[key] = fallback;
    }
    return state.organSvgs[key];
  }

  async function hydrateOrganIcons(keys) {
    for (const key of keys) {
      await fetchOrganSvg(key);

    keys.forEach((key) => {
      appEl.querySelectorAll(`[data-organ-icon="${key}"]`).forEach((el) => {

  function renderBodyMap() {
    if (state.loadingBodyMap && !state.bodyMap) return '<div class="card">Загружаем BodyMap...</div>';
    if (!state.bodyMap) return '<div class="card">Нет данных BodyMap. Нажмите refresh.</div>';
    const systems = BODYMAP_ORDER.map((key) => bodyMapSystem(key));
    const maxBenefitSum = Math.max(1, ...systems.map((s) => Number(s.benefit_strength_sum || 0)));
    const maxBurdenSum = Math.max(1, ...systems.map((s) => Number(s.burden_strength_sum || 0)));
    const sheet = state.bodyMapSheet ? renderBodyMapSheet(state.bodyMapSheet) : '';
    return `
      <div class="card fade"><strong>BodyMap · ${esc(state.bodyMap.day || '')}</strong></div>
      <div class="card fade">
        <div class="organs-grid">
          ${BODYMAP_ORDER.map((key)=>{
            const s = bodyMapSystem(key);
            const benefitSum = Number(s.benefit_strength_sum || 0);
            const burdenSum = Number(s.burden_strength_sum || 0);
            const mixedCount = Number(s.mixed_count || 0);
            const total = Number(s.benefit_count || 0) + Number(s.burden_count || 0) + mixedCount;
            const mixedBalanced = mixedCount > 0 && Number(s.benefit_count || 0) === Number(s.burden_count || 0);
            const benefitI = benefitSum > 0 ? clamp(benefitSum / maxBenefitSum, 0.12, 1) : 0;
            const burdenI = burdenSum > 0 ? clamp(burdenSum / maxBurdenSum, 0.12, 1) : 0;
            const colorBias = mixedBalanced ? 0.44 : null;
            const tileBenefitI = colorBias === null ? benefitI : colorBias;
            const tileBurdenI = colorBias === null ? burdenI : colorBias;
            
            return `<button class="organ-tile" data-system="${key}" data-total="${total}" style="--bI:${tileBenefitI.toFixed(3)};--rI:${tileBurdenI.toFixed(3)};">
              <div class="organ-icon" data-organ-icon="${key}"></div>
              <div class="organ-text">
                <div class="title">${SYSTEM_LABELS[key] || key}</div>
                <div class="muted">${(() => { const mc = s.mixed_count || 0; return `${s.benefit_count||0} + / ${s.burden_count||0} -${mc ? ` · ${mc} ±` : ''}`; })()}</div>
              </div>
              
            </button>`;
          }).join('')}
        </div>
      </div>
      <div class="card fade">
        <div class="legend-grid">

  function analyteOptions(selected){ return ANALYTE_PRESETS.map((a)=>`<option value="${a.code}" ${a.code===selected?'selected':''}>${a.title}</option>`).join(''); }

  function renderLabRow(idx,row={}){ const code=row.analyte_code||ANALYTE_PRESETS[0].code; return `<div class="lab-result-row" data-lab-row="${idx}"><label class="muted">Показатель<select class="select" data-lab-field="analyte_code" data-idx="${idx}">${analyteOptions(code)}</select></label><div class="field-grid two"><label class="muted">Значение<input class="input" inputmode="decimal" data-lab-field="value_num" data-idx="${idx}" value="${esc(row.value_num??row.value_text??'')}"/></label><label class="muted">Единица<select class="select" data-lab-field="unit" data-idx="${idx}">${unitOptions(code,row.unit||'')}</select></label></div><div class="field-grid two"><label class="muted">Референс от<input class="input" inputmode="decimal" data-lab-field="ref_low" data-idx="${idx}" value="${esc(row.ref_low??'')}"/></label><label class="muted">Референс до<input class="input" inputmode="decimal" data-lab-field="ref_high" data-idx="${idx}" value="${esc(row.ref_high??'')}"/></label></div></div>`; }

  function renderReviewModal(){ if(!state.profileUi.reviewOpen) return ''; const r=(state.profileLabs.reports||[]).find((x)=>String(x.id)===String(state.profileUi.selectedReportId)); if(!r) return ''; return `<div class="modal-overlay" data-close-review><section class="card modal-card" onclick="event.stopPropagation()"><div class="row"><strong>Проверка распознанных данных</strong><button class="btn secondary" data-close-review>Закрыть</button></div><div class="muted" style="margin-top:8px">${r.parse_status==='needs_manual_review'?'Документ загружен, но данные нужно проверить вручную':'Проверьте распознанные значения'}</div><div class="field-grid" style="margin-top:8px"><label class="muted">Дата анализа<input type="date" class="input" id="reviewReportDate" value="${esc(r.report_date||'')}"/></label><label class="muted">Лаборатория<input class="input" id="reviewLabName" value="${esc(r.lab_name||'')}"/></label><label class="muted">Комментарий<textarea class="textarea" id="reviewNotes">${esc(r.notes||'')}</textarea></label><div id="reviewRows">${(r.results||[]).map((row,idx)=>renderLabRow(idx,row)).join('') || renderLabRow(0)}</div><button class="btn" data-save-review>${state.profileUi.savingReview?'Сохраняем…':'Сохранить результат'}</button></div></section></div>`; }

  function renderProfile() {

    ];
    const onboardingBlock = onboarding.show_onboarding ? `<section class="card fade"><div class="row"><strong>Как работает Нутриентный помощник</strong><button class="btn secondary" data-onboarding-dismiss>Пропустить</button></div><div class="muted" style="margin-top:8px">Шаг ${Math.min(4, (na.onboardingStep || 0) + 1)} из 4</div><div style="margin-top:8px">${esc(onboardingCards[Math.min(3, na.onboardingStep || 0)])}</div><div class="row" style="margin-top:10px;gap:8px"><button class="btn secondary" data-onboarding-prev>Назад</button><button class="btn" data-onboarding-next>${(na.onboardingStep || 0) >= 3 ? 'Завершить' : 'Далее'}</button></div></section>` : '';

    const previewHtml = !preview ? '' : `<div class="card" style="margin-top:10px"><div><strong>${esc(preview.title_ru || selectedCode)}</strong></div><div class="muted">Статус: ${esc(preview.interpreted_status || 'unknown')} · Уверенность: ${esc(preview.confidence_level || 'low')}</div></div>`;
    const explanation = na.explanation || null;
    const explanationHtml = !explanation ? '' : `<div class="card" style="margin-top:10px"><div class="row"><strong>${esc(explanation.title_ru || 'Понятное объяснение')}</strong><span class="muted">${esc((na.explanationMeta?.source_type==='fallback') ? 'резервный режим' : 'объяснение')}</span></div><div class="muted" style="margin-top:6px">${esc(explanation.summary_ru || '')}</div>${(explanation.main_points_ru||[]).map((x)=>`<div class="muted">• ${esc(x)}</div>`).join('')}<div style="margin-top:8px"><strong>Почему такая стратегия</strong><div class="muted">${esc(explanation.why_this_plan_ru || '')}</div></div><div style="margin-top:8px"><strong>Что делать сейчас</strong><div class="muted">${esc(explanation.what_to_do_now_ru || '')}</div></div><div class="muted" style="margin-top:8px">Если есть выраженные симптомы, хронические заболевания, беременность, лактация или проблемы с почками/печенью/ЖКТ — приоритет за врачом и свежими анализами.</div></div>`;
    const planHtml = !plan ? '<div class="muted" style="margin-top:8px">План пока не собран. Начните с оценки данных.</div>' : `<div class="card" style="margin-top:10px"><div class="row"><strong>Текущий план</strong><span class="muted">${esc(plan.confidence_level || 'low')}</span></div><div class="muted" style="margin-top:6px">Режим: ${esc(plan.plan_mode || '-')} · Фаза: ${esc(plan.plan_phase || '-')}</div><div class="muted">Стратегия: ${esc(plan.action_strategy || '-')}</div>${(plan.ui_summary_lines||[]).length?`<div style="margin-top:8px">${plan.ui_summary_lines.map((x)=>`<div class="muted">• ${esc(x)}</div>`).join('')}</div>`:''}<div class="muted" style="margin-top:8px">План носит информационно-аналитический характер и не заменяет консультацию врача.</div><div class="row" style="margin-top:10px; gap:8px"><button class="btn secondary" data-nutrient-explain>${na.loadingExplanation ? 'Формируем…' : 'Понятное объяснение'}</button><button class="btn" data-activate-reminders>${activePlanReminders.length?`Напоминания включены (${activePlanReminders.length})`:'Включить follow-up напоминания'}</button></div>${explanationHtml}</div>`;

    const diff = dashboard.latest_diff_summary;
    const diffHtml = !diff ? '<div class="muted">Пока нет обновлений для сравнения.</div>' : `<div class="muted">Статус: ${esc(diff.from_status || '—')} → ${esc(diff.to_status || '—')}</div><div class="muted">Фаза: ${esc(diff.from_phase || '—')} → ${esc(diff.to_phase || '—')}</div><div class="muted">Причина: ${esc((diff.reasons || []).join(', ') || 'обновление данных')}</div>`;

    return `
      ${onboardingBlock}
      <section class="card fade"><div class="row"><strong>🧪 Нутриентный помощник</strong><button class="btn secondary" data-open-onboarding>Как это работает</button></div><div style="margin-top:8px"><strong>${esc(stateTitle)}</strong></div><div class="muted">${esc(stateSubtitle)}</div><div class="row" style="margin-top:10px;gap:8px"><button class="btn" data-dashboard-primary-cta>${esc(dashboard.primary_cta || 'Начать')}</button></div><div class="muted" style="margin-top:10px">${esc(dashboard.trust_copy || 'Помощник не ставит диагнозы. Качество рекомендаций зависит от полноты данных.')}</div></section>

      <section class="card fade"><div class="row"><strong>Готовность данных</strong><span class="muted">${Number(readiness.percent||0)}%</span></div><div style="margin-top:8px">${(readiness.steps||[]).map((s)=>`<div class="item-row"><span>${s.done ? '✓' : '•'} ${esc(s.title||'Шаг')}</span><span class="muted">${s.done ? 'готово' : 'нужно заполнить'}</span></div>`).join('') || '<div class="muted">Данные пока не заполнены.</div>'}</div></section>

      <section class="card fade"><div class="row"><strong>Следующий шаг</strong></div><div class="muted" style="margin-top:8px">${esc(dashboard.primary_cta || 'Открыть помощник')}</div><div style="margin-top:10px; display:grid; gap:8px"><select class="select" id="nutrientPreviewSelect">${nutrientOptions || '<option value="vitamin_d">vitamin_d</option>'}</select><button class="btn secondary" data-nutrient-preview>${na.loadingPreview ? 'Проверяем…' : 'Проверить текущие данные'}</button><button class="btn" data-nutrient-plan>${na.loadingPlan ? 'Собираем…' : 'Собрать план'}</button></div>${previewHtml}${planHtml}</section>

      <section class="card fade"><div class="row"><strong>Последнее обновление плана</strong></div><div style="margin-top:8px">${diffHtml}</div></section>

      <section class="card fade"><div class="row"><strong>История планов</strong></div><div style="margin-top:8px">${history.length ? history.map((x)=>`<button class="item-row" data-open-plan="${x.id}"><span>${esc(x.nutrient_code||'')}</span><span class="muted">${esc(x.status||'версия')}</span></button><div class="muted" style="margin-bottom:8px">${esc(x.summary||'')} ${x.update_reason_human ? `· ${esc(x.update_reason_human)}` : ''}</div>`).join('') : '<div class="muted">История пока пустая. После первой сборки здесь появятся версии планов.</div>'}</div></section>

      <section class="card fade"><div class="row"><strong>🔔 Follow-up и напоминания</strong></div><div style="margin-top:8px">${(na.reminders||[]).length ? (na.reminders.slice(0,10).map((r)=>`<div class="history-item"><div class="row"><strong>${esc(r.nutrient_code||'')}</strong><span class="muted">${esc(r.status||'')}</span></div><div class="muted">${esc(r.reminder_type||'followup')}</div><div class="muted">Дата: ${esc(r.scheduled_for_utc||'')}</div><div class="row" style="margin-top:8px; gap:6px"><button class="btn secondary" data-reminder-open-plan="${r.plan_run_id}">Открыть план</button><button class="btn secondary" data-reminder-done="${r.id}">Готово</button><button class="btn secondary" data-reminder-snooze="${r.id}" data-days="3">Отложить +3д</button></div></div>`).join('')) : '<div class="muted">Активных follow-up напоминаний пока нет.</div>'}</div></section>

      <section class="card fade" data-open-edit><div class="profile-hero"><div class="profile-avatar">👤</div><div><div class="row"><strong>Мой профиль</strong><button class="btn secondary" data-open-edit>Редактировать профиль</button></div><div class="profile-summary-grid">${summary}</div></div></div></section>
      <section class="card fade"><div class="row"><strong>📄 Мои анализы</strong></div><div class="muted" style="margin-top:8px">Лучше добавлять свежие анализы: со старыми результатами итог может быть менее точным.</div><div style="margin-top:10px">${labs.length?labs.map((r)=>`<button class="item-row" data-open-review="${r.id}"><span>${esc(r.report_date||'без даты')} · ${esc(r.lab_name||'Лаборатория не указана')}</span><span class="muted">${Array.isArray(r.results)?r.results.length:0} показ.</span></button><div class="muted" style="margin-bottom:8px">${r.source==='manual'?'Добавлен вручную':'Загружен из документа'}${r.parse_status==='needs_manual_review'?' · Требует проверки':''}</div>`).join(''):labsEmptyState()}</div><div class="row" style="margin-top:10px; gap:8px"><button class="btn" data-open-upload>Загрузить документ</button><button class="btn secondary" data-open-manual>Ввести вручную</button></div></section>
      ${renderProfileEditorModal()}${renderLabsModal('manual')}${renderLabsModal('upload')}${renderReviewModal()}
    `;
  }

  function collectLabRows(containerId){ const rows=[]; document.querySelectorAll(`#${containerId} [data-lab-row]`).forEach((rowEl)=>{ const idx=rowEl.dataset.labRow; const analyte_code=document.querySelector(`[data-lab-field="analyte_code"][data-idx="${idx}"]`)?.value||''; const preset=ANALYTE_PRESETS.find((x)=>x.code===analyte_code); const value=document.querySelector(`[data-lab-field="value_num"][data-idx="${idx}"]`)?.value||''; rows.push({ analyte_code, analyte_name:preset?.title||analyte_code, value_text:String(value), value_num:Number(String(value).replace(',','.'))||null, unit:document.querySelector(`[data-lab-field="unit"][data-idx="${idx}"]`)?.value||'', ref_low:Number(document.querySelector(`[data-lab-field="ref_low"][data-idx="${idx}"]`)?.value||'')||null, ref_high:Number(document.querySelector(`[data-lab-field="ref_high"][data-idx="${idx}"]`)?.value||'')||null }); }); return rows.filter((x)=>x.analyte_code); }

  function bindProfileEvents() {
    document.querySelectorAll('[data-open-edit]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.editOpen=true; renderActiveTab(); }));
    document.querySelectorAll('[data-close-edit]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.editOpen=false; renderActiveTab(); }));
    document.querySelectorAll('[data-open-manual]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.manualOpen=true; renderActiveTab(); }));
    document.querySelectorAll('[data-close-manual]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.manualOpen=false; renderActiveTab(); }));
    document.querySelectorAll('[data-open-upload]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.uploadOpen=true; renderActiveTab(); }));
    document.querySelectorAll('[data-close-upload]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.uploadOpen=false; renderActiveTab(); }));
    document.querySelectorAll('[data-close-review]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.reviewOpen=false; renderActiveTab(); }));
    document.querySelectorAll('[data-open-review]').forEach((el)=>el.addEventListener('click', ()=>{ state.profileUi.selectedReportId=Number(el.dataset.openReview); state.profileUi.reviewOpen=true; renderActiveTab(); }));

    document.querySelector('[data-profile-save]')?.addEventListener('click', async () => {
      if (state.profile.saving) return;
      state.profile.saving = true;
      const payload = {};
      document.querySelectorAll('[data-profile-field]').forEach((el) => payload[el.dataset.profileField] = el.value);
      document.querySelectorAll('[data-profile-lines]').forEach((el)=>payload[el.dataset.profileLines]=parseLinesToJson(el.value));
      try {
        const by = Number(payload.birth_year||0); if (by && (by<1900 || by>new Date().getFullYear()-10)) throw new Error('Год рождения вне диапазона');
        const h = Number(payload.height_cm||0); if (h && (h<100 || h>250)) throw new Error('Рост должен быть в диапазоне 100–250 см');
        const w = Number(payload.weight_kg||0); if (w && (w<30 || w>300)) throw new Error('Вес должен быть в диапазоне 30–300 кг');
        const res = await api('./api/profile', { method:'POST', body: payload });
        state.profile.data = res.profile || payload;
        state.profileUi.editOpen = false;
        showToast('Профиль сохранён');
      } catch (e) { showToast(e.message || 'Ошибка сохранения профиля'); }
      state.profile.saving = false;
      renderActiveTab();
    });

    document.querySelector('[data-add-manual-row]')?.addEventListener('click', ()=>{ const wrap=document.getElementById('manualRows'); const idx=wrap.querySelectorAll('[data-lab-row]').length; wrap.insertAdjacentHTML('beforeend', renderLabRow(idx)); bindProfileEvents(); });
    document.querySelector('[data-save-manual]')?.addEventListener('click', async ()=>{
      if(state.profileUi.savingManual) return; state.profileUi.savingManual=true;
      try {
        const body={ source:'manual', report_date:document.getElementById('manualReportDate')?.value||'', lab_name:document.getElementById('manualLabName')?.value||'', notes:document.getElementById('manualNotes')?.value||'', results:collectLabRows('manualRows') };
        await api('./api/profile/labs',{method:'POST',body});
        state.profileUi.manualOpen=false; showToast('Анализ добавлен'); await loadProfileLabs(true);
      } catch { showToast('Не удалось сохранить анализ'); }
      state.profileUi.savingManual=false; renderActiveTab();
    });

    document.querySelector('[data-upload-labs]')?.addEventListener('click', async ()=>{
      if (state.profileUi.uploading) return;
      const file = document.getElementById('labsFile')?.files?.[0];
      if (!file) return showToast('Выберите файл');
      state.profileUi.uploading = true;
      try {
        const form = new FormData();
        form.append('file', file);
        form.append('report_date', document.getElementById('uploadReportDate')?.value || '');
        form.append('lab_name', document.getElementById('uploadLabName')?.value || '');
        form.append('notes', document.getElementById('uploadNotes')?.value || '');
        const res = await fetch('./api/profile/labs/upload', { method:'POST', headers: { 'X-Telegram-Init-Data': state.initData }, body: form });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Ошибка загрузки');
        await loadProfileLabs(true);
        state.profileUi.uploadOpen = false;
        state.profileUi.selectedReportId = data.report_id;
        state.profileUi.reviewOpen = true;
      } catch (e) { showToast(e.message || 'Не удалось загрузить документ'); }
      state.profileUi.uploading = false;
      renderActiveTab();
    });

    document.querySelector('[data-save-review]')?.addEventListener('click', async ()=>{
      if (state.profileUi.savingReview) return;
      state.profileUi.savingReview=true;
      const id = state.profileUi.selectedReportId;
      try {
        const body={ report_date:document.getElementById('reviewReportDate')?.value||'', lab_name:document.getElementById('reviewLabName')?.value||'', notes:document.getElementById('reviewNotes')?.value||'', parse_status:'manual_reviewed', parse_notes:'Проверено пользователем', results:collectLabRows('reviewRows') };
        await api(`./api/profile/labs/${id}`,{method:'PUT',body});
        await loadProfileLabs(true);
        state.profileUi.reviewOpen=false;
        showToast('Результаты сохранены');
      } catch { showToast('Не удалось сохранить проверку'); }
      state.profileUi.savingReview=false;
      renderActiveTab();
    });

    document.querySelector('[data-profile-open-bodymap]')?.addEventListener('click', async () => { await loadBodyMap(true); const target = document.getElementById('tabContent'); target.innerHTML += `<section class="card fade">${renderBodyMap()}</section>`; bindBodyMapEvents(); });
    document.querySelector('[data-open-settings-ach]')?.addEventListener('click', async ()=>{ state.activeTab = 'settings'; renderMainApp(); });
    document.getElementById('nutrientPreviewSelect')?.addEventListener('change', (e) => { state.nutrientAssistant.selectedCode = String(e.target.value || 'vitamin_d'); });
    document.querySelector('[data-open-onboarding]')?.addEventListener('click', async ()=>{
      state.nutrientAssistant.onboardingStep = 0;

  function slotProgress(slot) {
    const safeSlot = slot || {};
    const items = Array.isArray(safeSlot.items) ? safeSlot.items : [];
    const complexes = Array.isArray(safeSlot.complexes) ? safeSlot.complexes : [];
    const singleTaken = items.filter((i) => i?.status === "taken").length;
    const singleTotal = items.length;
    let complexTaken = 0;
    let complexTotal = 0;
    for (const complex of complexes) {
      const cItems = Array.isArray(complex?.items) ? complex.items : [];
      if (cItems.length) {
        complexTotal += cItems.length;
        complexTaken += cItems.filter((i) => i?.status === "taken").length;
      } else {
        complexTotal += Number(complex?.total_count || 0);
        complexTaken += Number(complex?.taken_count || 0);
      }
    }
    const total = singleTotal + complexTotal;
    const taken = singleTaken + complexTaken;
    return { total, taken, closed: total > 0 && taken >= total };
  }

  function findSlotBySupplementId(supplementId) {
    for (const slot of state.today?.slots || []) {
      const inItems = (slot.items || []).some((i) => String(i.supplement_id) === String(supplementId));
      const inComplex = (slot.complexes || []).some((c) => (c.items || []).some((i) => String(i.supplement_id) === String(supplementId)));
      if (inItems || inComplex) return slot;
    }
    return null;
  }

  function findSlotByComplexId(complexId) {
    for (const slot of state.today?.slots || []) {
      const found = (slot.complexes || []).some((c) => String(c.complex_id) === String(complexId));
      if (found) return slot;
    }
    return null;
  }

  function extractUnlockedPoints(payloads) {
    return (Array.isArray(payloads) ? payloads : []).reduce((acc, payload) => {
      const details = Array.isArray(payload?.newly_unlocked_details) ? payload.newly_unlocked_details : [];
      return acc + details.reduce((sum, x) => sum + Number(x?.points || 0), 0);
    }, 0);
  }

    state.ui.microWowLastAt = now;

  function recalcTodaySnapshot() {
    const slots = state.today?.slots || [];
    let expected = 0;
    let taken = 0;
    for (const slot of slots) {
      for (const item of (slot.items || [])) {
        expected += 1;
        if (item.status === 'taken') taken += 1;
      }
      for (const complex of (slot.complexes || [])) {
        for (const item of (complex.items || [])) {
          expected += 1;
          if (item.status === 'taken') taken += 1;
        }
      }
    }
    state.today.expected = expected;
    state.today.taken = taken;
    state.today.adherence = expected > 0 ? Math.round((taken / expected) * 100) : 0;
    if (state.stats?.today) {
      state.stats.today.expected = expected;
      state.stats.today.taken = taken;
      state.stats.today.adherence = state.today.adherence;
    }
  }

  function normalizeHHMM(value) {
    const raw = String(value || '').trim();
    const m = raw.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return '';
    const hh = Number(m[1]);
    const mm = Number(m[2]);
    if (!Number.isFinite(hh) || !Number.isFinite(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) return '';
    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  function timezoneOptionsHtml(selected) {
    const options = [];
    for (let h = -12; h <= 14; h += 1) {
      const sign = h >= 0 ? '+' : '-';

      const val = `UTC${sign}${abs}:00`;
      options.push(`<option value="${val}" ${val === selected ? 'selected' : ''}>${val}</option>`);
    }
    return options.join('');
  }

      state.settingsData.offer_version = '';
      state.settingsData.privacy_version = '';
    } finally {
      state.settingsData.loading = false;
    }
  }

  function renderSettings() {
    const adminHint = !!(state.me?.role && state.me.role !== "none");
    const me = state.me || {};
    const accessLabel = me.premium ? "Premium" : (me.starter_trial_active ? "Starter" : "Нет активного доступа");
    const accessHint = me.premium
      ? "Полный доступ активен."
      : (me.starter_trial_active
          ? `Starter активен до ${String(me.starter_trial_until_utc || '').slice(0, 10) || '—'}.`
          : "Оформи Premium, чтобы вернуть полный доступ к WebApp.");
    const ach = state.ach || {};
    const items = Array.isArray(ach.achievements) ? ach.achievements : [];
    const unlocked = items.filter((x) => x.unlocked);
    const locked = items.filter((x) => !x.unlocked);
    const allowed = ach.allowed_cosmetics || { themes:["base"], tab_skins:["classic"], badges:["none"] };

    const rewardChips = (reward) => {
      const unlock = reward?.unlock || {};

      (unlock.themes||[]).forEach((x)=> { const m=getThemeMeta(x); chips.push(`Тема: ${(m.emoji||"").trim()} ${m.title_ru||x}`.trim()); });
      (unlock.tab_skins||[]).forEach((x)=> { const m=getTabMeta(x); chips.push(`Таб-меню: ${(m.emoji||"").trim()} ${m.title_ru||x}`.trim()); });
