<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>SupplyBot WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-1: #070b1a;
      --bg-2: #101a44;
      --bg-3: #1b0f3a;
      --card: rgba(16, 24, 52, 0.68);
      --card-strong: rgba(24, 36, 74, 0.82);
      --text: #eef2ff;
      --muted: rgba(218, 228, 248, 0.8);
      --accent: #7db7ff;
      --green: #49d88d;
      --red: #ff5a6f;
      --neutral: rgba(255,255,255,0.17);
    }

    html[data-theme="nebula"] { --bg-1:#0c0a23; --bg-2:#25125d; --bg-3:#130b2d; --accent:#b48bff; }
    html[data-theme="aurora"] { --bg-1:#041a18; --bg-2:#0f3c3e; --bg-3:#12252f; --accent:#7df0c2; }
    html[data-theme="noir"] { --bg-1:#090909; --bg-2:#171717; --bg-3:#101010; --accent:#bbbbbb; }
    html[data-theme="solar"] { --bg-1:#2a1d08; --bg-2:#4e3310; --bg-3:#2b1a0b; --accent:#ffd36d; }
    html[data-theme="emerald"] { --bg-1:#062015; --bg-2:#0c4630; --bg-3:#0a2c1f; --accent:#6ff0b8; }
    html[data-theme="bloodline"] { --bg-1:#28050d; --bg-2:#4a0d1d; --bg-3:#25050f; --accent:#ff6a86; }
    html[data-theme="glitch"] { --bg-1:#0b1129; --bg-2:#1e255f; --bg-3:#13223e; --accent:#68e4ff; }
    html[data-theme="ivory"] { --bg-1:#1a1b20; --bg-2:#2a2d36; --bg-3:#1f2229; --accent:#f0e6ce; }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 640px at 12% -8%, rgba(67, 132, 255, 0.42) 0%, transparent 62%),
        radial-gradient(980px 580px at 92% 2%, rgba(66, 48, 143, 0.42) 0%, transparent 58%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 54%, var(--bg-3) 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(900px 520px at 50% 10%, rgba(255,255,255,0.06), transparent 55%),
                  radial-gradient(1200px 900px at 50% 120%, rgba(0,0,0,0.65), transparent 55%);
      mix-blend-mode: soft-light;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px calc(100px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .headline { margin: 0; font-size: 20px; }
    .subline { color: var(--muted); font-size: 13px; margin-top: 3px; }

    .btn, .chip {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      color: var(--text);
      background: linear-gradient(170deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
      box-shadow:
        0 12px 24px rgba(0,0,0,0.34),
        0 2px 0 rgba(255,255,255,0.18) inset,
        0 -2px 0 rgba(0,0,0,0.4) inset;
    }

    .btn {
      cursor: pointer;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:active, .pressed {
      transform: translateY(1px);
      box-shadow:
        0 3px 8px rgba(0,0,0,0.35),
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 -1px 0 rgba(0,0,0,0.55) inset;
    }

    .btn.secondary { opacity: 0.88; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }

    .card {
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 22px 42px rgba(3,7,20,0.44),
        0 7px 14px rgba(2,6,18,0.4),
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 -2px 0 rgba(0,0,0,0.35) inset;
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .muted { color: var(--muted); }

    .tabs {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border-radius: 22px;
      background: rgba(6, 10, 24, 0.78);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 44px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.12) inset;
      z-index: 20;
    }

    .tabs.admin-enabled { grid-template-columns: repeat(6, minmax(0, 1fr)); }

    .tab {
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      color: rgba(210, 222, 246, 0.8);
      background: rgba(255,255,255,0.03);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .tab.active {
      color: white;
      background: linear-gradient(180deg, rgba(125,183,255,0.34), rgba(73,109,198,0.24));
      box-shadow:
        0 10px 16px rgba(6,13,34,0.42),
        0 0 0 1px rgba(182, 213, 255, 0.35) inset,
        0 1px 0 rgba(255,255,255,0.2) inset;
    }

    .tab-emoji { font-size: 17px; line-height: 1; }
    .tabs[data-skin="neon"] .tab.active { box-shadow: 0 0 0 1px rgba(125,210,255,.65) inset, 0 0 18px rgba(96,190,255,.55); }
    .tabs[data-skin="neon"] .tab.active::after { content:""; position:absolute; inset:-3px; border-radius:16px; border:1px solid rgba(117,226,255,.65); }
    .tabs[data-skin="thumbs"] .tab.active::after { content:"👍"; position:absolute; top:-10px; right:6px; font-size:12px; }
    .tabs[data-skin="gold"] .tab.active { box-shadow:0 0 0 1px rgba(255,211,122,.9) inset,0 8px 20px rgba(165,118,36,.45); }
    .tabs[data-skin="plasma"] .tab.active::after { content:""; position:absolute; inset:-2px; border-radius:15px; background:linear-gradient(120deg, rgba(96,163,255,.2), rgba(249,112,255,.2)); z-index:-1; filter:blur(1px);}
    .tabs[data-skin="frost"] .tab.active { box-shadow:0 0 0 1px rgba(172,236,255,.7) inset,0 0 16px rgba(141,218,255,.4);}
    .tabs[data-skin="minimal"] .tab.active { background:rgba(255,255,255,.08); box-shadow: inset 0 -2px 0 var(--accent);}
    .tabs[data-skin="glitch"] .tab.active { text-shadow: 1px 0 rgba(255,80,80,.5), -1px 0 rgba(80,220,255,.5); box-shadow:0 0 0 1px rgba(121,200,255,.35) inset, 2px 0 10px rgba(255,88,122,.2), -2px 0 10px rgba(88,195,255,.2);}
    .tab { position: relative; }
    .badge-pill { font-size:12px; padding:4px 9px; border-radius:999px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12); }
    .ach-grid{display:grid;gap:8px;margin-top:8px;}
    .ach-item{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px;background:rgba(255,255,255,.05);}
    .ach-item.locked{opacity:.72;}

    .slot-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top: 8px; }
    .chip { border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
    .chip.green { background: rgba(72,216,141,0.2); color: #bbffd9; }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.14) inset;
    }

    .seg-btn {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      min-width: 84px;
    }

    .seg-btn.active {
      color: #fff;
      background: linear-gradient(180deg, rgba(125,183,255,0.32), rgba(73,109,198,0.22));
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 14px rgba(7,15,38,0.42);
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.14);
      text-align: left;
      padding: 10px;
      border-radius: 13px;
      margin-top: 8px;
      background: rgba(255,255,255,0.05);
      color: inherit;
    }

    .catalog-toolbar,
    .catalog-row,
    .catalog-list,
    .catalog-meta,
    .catalog-active-filters,
    .catalog-item-head {
      min-width: 0;
    }

    .catalog-toolbar { display: grid; gap: 8px; }
    .catalog-row { display: flex; align-items: center; gap: 8px; }
    .catalog-row > * { min-width: 0; }
    .catalog-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .catalog-active-filters { display:flex; flex-wrap:wrap; gap:8px; }
    .catalog-list { display:grid; gap:10px; }
    .catalog-status { text-align:center; font-size:12px; color: var(--muted); padding: 6px 0; }
    .catalog-skeleton { height: 72px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(110deg, rgba(255,255,255,0.05) 8%, rgba(255,255,255,0.12) 18%, rgba(255,255,255,0.05) 33%); background-size: 180% 100%; animation: shimmer 1.4s linear infinite; }
    .supp-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }


    .input, .select, .textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      background: rgba(255,255,255,0.11);
      color: var(--text);
      padding: 10px 12px;
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.12) inset;
    }
    .textarea { min-height: 88px; resize: vertical; }

    .btn, .chip, .card, .tab, .input, .select, .textarea, .search-input {
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .search-input {
      width: 100%;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.14) inset;
    }

    .search-input:focus,
    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: rgba(125,183,255,0.75);
      box-shadow: 0 0 0 3px rgba(125,183,255,0.18), 0 10px 24px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.18) inset;
    }

    .card.item-row:active,
    button.item-row:active,
    .tab:active,
    .chip:active {
      transform: translateY(1px);
      box-shadow: 0 8px 14px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.12) inset;
    }
    .error-text { color: #ffb3bb; font-size: 12px; margin-top: 4px; }
    .admin-grid { display:grid; gap:10px; }
    .admin-card { cursor:pointer; }
    .admin-card.selecting { display:flex; align-items:flex-start; gap:10px; }
    .admin-select-count { margin-top:8px; font-size:12px; color: var(--muted); }
    .bulk-bar { position: fixed; left:10px; right:10px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 29; display:flex; gap:8px; overflow-x:auto; padding:10px; border-radius:16px; background: rgba(8,13,34,0.92); border:1px solid rgba(255,255,255,0.2); }
    .bulk-quick { display:flex; gap:8px; }
    .bulk-more { position: relative; }
    .bulk-menu { position:absolute; right:0; bottom:42px; display:grid; gap:6px; min-width:180px; padding:8px; border-radius:12px; background: rgba(8,13,34,0.96); border:1px solid rgba(255,255,255,0.2); }

    .status-pill {
      min-width: 72px;
      text-align: center;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .status-taken { background: rgba(73,216,141,0.24); border-color: rgba(158,255,205,0.72); box-shadow: 0 0 12px rgba(73,216,141,0.42); }
    .status-skipped { background: rgba(255,107,121,0.24); border-color: rgba(255,167,177,0.65); box-shadow: 0 0 10px rgba(255,107,121,0.35); }
    .status-none { background: var(--neutral); border-color: rgba(255,255,255,0.2); }

    .fade { animation: fadeIn .22s ease; }
    @keyframes fadeIn { from {opacity: 0; transform: translateY(6px);} to {opacity: 1; transform: translateY(0);} }
    @keyframes shimmer { 0% { background-position: 180% 0; } 100% { background-position: -20% 0; } }

    .preview-grid { display: grid; gap: 10px; }
    .preview-card {
      border-radius: 16px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      filter: blur(2px);
      opacity: 0.75;
    }

    .plans { display: grid; gap: 10px; }

    .toast-wrap {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(80px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 25;
    }

    .toast {
      background: rgba(10, 12, 28, 0.94);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    }

    .devbox textarea {
      width: 100%;
      min-height: 80px;
      margin-top: 8px;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      background: rgba(10, 13, 31, 0.85);
    }

    .cta-sticky {
      position: sticky;
      bottom: 10px;
      padding-top: 8px;
      background: linear-gradient(to top, rgba(10,13,33,0.96) 40%, transparent);
    }

    .legend-grid { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap:8px; margin-top:8px; }
    .legend-pill { border-radius: 12px; padding: 8px; font-size: 12px; text-align:center; background: rgba(255,255,255,0.06); }
    .legend-benefit { box-shadow: 0 0 14px rgba(73,216,141,0.55); }
    .legend-burden { box-shadow: 0 0 14px rgba(255,107,121,0.6); }
    .legend-mixed { box-shadow: 0 0 14px rgba(255,191,92,0.7); }
    .organs-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
    @media (min-width: 860px) {
      .organs-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    .organ-tile {
      width: 100%;
      display:flex;
      align-items:center;
      gap: 10px;
      text-align:left;
      border-radius:16px;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 10px;
      background: linear-gradient(160deg, rgba(25,34,66,0.95), rgba(14,18,36,0.92));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -12px 22px rgba(125,183,255, calc(0.08 + var(--bI) * 0.24)),
        0 8px 24px rgba(0,0,0,0.35),
        0 0 calc(20px * var(--bI)) rgba(116,225,170, calc(0.14 + var(--bI) * 0.3)),
        0 0 calc(20px * var(--rI)) rgba(255,90,111, calc(0.10 + var(--rI) * 0.25));
      outline: 2px solid rgba(255,90,111, calc(var(--rI) * 0.6));
      outline-offset: -1px;
      transition: transform .16s ease, box-shadow .18s ease;
      cursor: pointer;
    }
    .organ-tile:hover { transform: translateY(-2px); }
    .organ-tile:active { transform: translateY(1px) scale(0.995); }
    .organ-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      background: rgba(125,183,255, calc(0.08 + var(--bI) * 0.18));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
      color: rgba(125,183,255, calc(0.35 + var(--bI) * 0.65));
      filter: drop-shadow(0 0 calc(18px * var(--bI)) rgba(125,183,255, calc(0.16 + var(--bI) * 0.35)));
    }
    .organ-icon svg { width: 26px; height: 26px; display:block; color: inherit; fill: currentColor; stroke: currentColor; }
    .organ-text { min-width:0; flex:1; }
    .organ-text .title { font-weight:700; }
    .organ-text .muted { font-size:12px; }
    .organ-emoji { font-size: 19px; line-height:1; filter: drop-shadow(0 0 8px rgba(255,255,255,0.25)); }
    .badge { border-radius:999px; padding:2px 8px; font-size:12px; font-weight:700; }
    .badge.plus { background: rgba(73,216,141,0.2); color:#b7ffd5; }
    .badge.minus { background: rgba(255,107,121,0.24); color:#ffd0d5; }
    .badge.mixed { background: rgba(255,191,92,0.26); color:#ffe1b0; }
    .sheet-backdrop { position: fixed; inset:0; background: rgba(2,5,16,0.58); z-index: 32; }
    .sheet { position: fixed; left:10px; right:10px; bottom: calc(82px + env(safe-area-inset-bottom)); z-index: 33; max-height: 66vh; overflow: auto; opacity:1; transform: translateY(0); transition: all .18s ease; }
    .sheet-empty { padding:12px; border-radius: 14px; background: rgba(255,255,255,0.05); color: var(--muted); text-align:center; }

    .progress { height:8px; border-radius:999px; background: rgba(255,255,255,.15); overflow:hidden; margin-top:8px; }
    .progress > i { display:block; height:100%; background: linear-gradient(90deg, #82a7ff, #49d88d); }
    .survey-option { width:100%; border-radius:14px; border:1px solid rgba(255,255,255,.2); padding:12px; margin-top:8px; background: rgba(255,255,255,.07); color:var(--text); text-align:left; font-weight:700; }
    .survey-option.active { box-shadow: 0 0 0 1px rgba(130,167,255,.8) inset, 0 0 16px rgba(130,167,255,.45); background: rgba(130,167,255,.2); }
    .survey-goals { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .survey-note { width:100%; min-height:110px; border-radius:14px; border:1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color:var(--text); padding:10px; }
    .rec-card { border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:10px; margin-top:8px; background: rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toastWrap" class="toast-wrap"></div>
<script>
(function () {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const state = {
    initData: tg?.initData || "",
    me: null,
    userId: null,
    activeTab: "today",
    today: null,
    complexes: [],
    loadingToday: false,
    loadingStats: false,
    stats: null,
    ach: null,
    mySupplements: { open: false, tab: "active", loading: false, busy: {}, active: [], frozen: [] },
    suppHub: { open: false, loading: false, saving: false, item: null, slots: [], slotId: "morning", time: "", doseText: "", noteText: "", remindersMode: "slot", reminderTimes: [], reminderInput: "" },
    toastTimer: null,
    catalog: {
      q: "", page: 0, items: [], total: 0, loading: false,
      loadingMore: false,
      hasMore: true,
      error: false,
      filters: { evidence: [], targets: [], burdens: [], sort: "alpha" },
      detail: null, detailLoading: false, filtersOpen: false
    },
    searchDebounce: null,
    bodyMap: null,
    loadingBodyMap: false,
    bodyMapSheet: null,
    survey: {
      step: 0,
      loading: false,
      view: "wizard",
      target: null,
      loadedKey: "",
      checkinId: null,
      recommendations: [],
      selected: {},
      applying: false,
      answers: { energy:"", sleep:"", stress:"", training:"", goals:[], note:"" }
    },
    admin: {
      q: "",
      page: 0,
      pageSize: 20,
      loading: false,
      items: [],
      total: 0,
      filters: { is_active: "", evidence: "" },
      detail: null,
      auditOpen: false,
      searchDebounce: null,
      savingField: "",
      errors: {},
      selectionMode: false,
      selectedIds: {},
      bulkMenuOpen: false,
      bulkPrompt: "",
      bulkConfirm: null,
      userLookupId: "",
      userDetail: null,
      userBanReason: "",
      userDeleteConfirm: "",
      roleTargetId: "",
      diagnostics: null,
      diagConfirmText: "",
      diagLoading: false
    }
  };

  const APP_NAME = "SupplyBot";
  const appEl = document.getElementById("app");
  const TARGET_LABELS_RU = {

    muscle: "Мышцы",

  };

    { id: "today", title: "Сегодня", icon: "✅" },

    { id: "survey", title: "Опрос", icon: "📝" },

  ];

  function showToast(text) {
    const wrap = document.getElementById("toastWrap");
    wrap.innerHTML = `<div class="toast fade">${text}</div>`;
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { wrap.innerHTML = ""; }, 2200);
  }



  function applyCosmetics(c) {
    const cosmetics = c || {};
    document.documentElement.dataset.theme = cosmetics.theme_id || "base";
    document.documentElement.dataset.tabSkin = cosmetics.tab_skin_id || "classic";
    document.documentElement.dataset.badge = cosmetics.badge_id || "none";
  }

  function getBadgeMeta(id) {
    const badges = state.ach?.catalogs?.badges || [];
    return badges.find((b) => b.id === id) || { id: "none", emoji: "", title_ru: "" };

  async function loadAchievements(force = false) {
    if (state.ach && !force) return state.ach;
    const data = await api("./api/achievements/summary");
    state.ach = data;
    applyCosmetics(data.cosmetics || {});
    return data;
  }

  function showBannedScreen(reason) {
    appEl.innerHTML = `
      <div class="main-content">
        <div class="card fade" style="margin-top:24px; text-align:center;">
          <h3 style="margin:0">Доступ ограничен</h3>
          <p class="muted">${reason ? esc(reason) : 'Если это ошибка — напишите в поддержку.'}</p>
          <button class="btn" id="closeBannedBtn">Закрыть</button>
        </div>
      </div>
    `;
    document.getElementById('closeBannedBtn')?.addEventListener('click', ()=> tg?.close?.());
  }

  function formatDate() {
    return new Date().toLocaleDateString("ru-RU", { weekday: "short", day: "2-digit", month: "short" });
  }

  async function api(path, { method = "GET", body } = {}) {
    const res = await fetch(path, {
      method,
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": state.initData
      },
      body: body ? JSON.stringify(body) : undefined
    });

    if (res.status === 401) {
      showToast("Открой WebApp внутри Telegram");
      throw new Error("UNAUTHORIZED");
    }

    if (res.status === 402) {
      state.me = { ...(state.me || {}), premium: false };
      renderPaywall();
      throw new Error("PREMIUM_REQUIRED");
    }

    if (res.status === 403) {
      const data403 = await res.json().catch(() => ({}));
      if (data403?.code === "ADMIN_REQUIRED" || data403?.code === "PERMISSION_DENIED") throw new Error("PERMISSION_DENIED");
      if (data403?.code === "BANNED") {
        showBannedScreen(data403?.reason || "");
        throw new Error("BANNED");
      }
      throw new Error("FORBIDDEN");
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      throw new Error(data.error || `HTTP_${res.status}`);
    }
    return data;
  }

  async function boot() {
    try {
      const me = await api("./api/me");
      state.me = me;
      applyCosmetics(me.cosmetics || {});
      state.userId = tg?.initDataUnsafe?.user?.id || me?.tg_user_id || me?.id || "anon";
      if (me.banned) {
        showBannedScreen(me.banned_reason || "");
        return;
      }
      if (!me.premium) {
        renderPaywall();
      } else {
        renderMainApp();
        await loadToday();
        await loadSurveyForTarget();
      }
    } catch (e) {
      if (String(e.message).includes("UNAUTHORIZED") && !state.initData) {
        renderInitDataFallback();
      } else if (!state.me) {
        renderInitDataFallback("Не удалось загрузить /api/me");
      }
    }
  }

  function renderInitDataFallback(errorText) {
    appEl.innerHTML = `
      <div class="main-content">
        <div class="card devbox fade">
          <h3 style="margin:0">Dev fallback</h3>
          <p class="muted">Вставьте initData для теста в обычном браузере.</p>
          ${errorText ? `<p class="muted">${errorText}</p>` : ""}
          <textarea id="initDataInput" placeholder="query_id=...&user=...&hash=..."></textarea>
          <div style="margin-top:8px">
            <button class="btn" id="saveInitBtn">Применить</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("saveInitBtn")?.addEventListener("click", async () => {
      const value = document.getElementById("initDataInput").value.trim();
      if (!value) return showToast("Нужно вставить initData");
      state.initData = value;
      showToast("initData сохранён");
      await boot();
    });
  }

  function renderPaywall() {
    const plans = state.me?.plans || [];
    const plansHtml = plans.map((p) => {
      const rub = p.price_rub ? Math.round(p.price_rub / 100) : null;
      return `
        <div class="card fade">
          <div class="row">
            <strong>${p.months} мес.</strong>
            <span class="muted">${p.plan_id}</span>
          </div>
          <div class="muted" style="margin-top:6px;">
            ${p.price_stars || "—"} ⭐ ${rub !== null ? `• ${rub} ₽` : ""}
          </div>
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            ${p.stars_enabled ? `<button class="btn" data-plan="${p.plan_id}" data-method="stars">Купить за ⭐</button>` : ""}
            ${p.rub_enabled ? `<button class="btn secondary" data-plan="${p.plan_id}" data-method="yookassa">Купить за ₽</button>` : ""}
          </div>
        </div>
      `;
    }).join("");

    appEl.innerHTML = `
      <div class="main-content">
        <div class="card fade">
          <h2 style="margin:0 0 4px">Премиум открывает WebApp</h2>
          <div class="muted">Today • Каталог • Карта • Опрос</div>
        </div>

        <div class="preview-grid">
          ${["Today: чекбоксы и прогресс", "Catalog: RU/EN каталог", "BodyMap: органы и протоколы", "Survey: умные карточки"].map(t => `<div class="preview-card">${t}<br><span class="muted">Контент скрыт до Premium</span></div>`).join("")}
        </div>

        <div class="cta-sticky">
          <div class="card" style="margin-top:12px; margin-bottom:8px;"><b>Купить подписку</b><div class="muted">Выберите удобный план и оплату ⭐ или ₽</div></div>
        </div>

        <div class="plans">${plansHtml || '<div class="card">Планы пока недоступны.</div>'}</div>
      </div>
      ${renderTabs(true)}
    `;

    appEl.querySelectorAll("[data-plan]").forEach((el) => {
      el.addEventListener("click", () => purchase(el.dataset.plan, el.dataset.method, el));
    });
  }

  async function purchase(planId, method, btnEl) {
    haptic();
    if (!tg?.openInvoice) {
      showToast("Оплата доступна только в Telegram");
      return;
    }
    const prevText = btnEl.textContent;
    btnEl.textContent = "Создаю счёт...";
    btnEl.disabled = true;
    try {
      const data = await api("./api/billing/create_invoice_link", {
        method: "POST",
        body: { plan_id: planId, method }
      });

      tg.openInvoice(data.invoice_link, async (status) => {
        if (["paid", "success"].includes(status)) {
          showToast("Оплата успешна, обновляю доступ...");
          try {
            state.me = await api("./api/me");
            if (state.me.premium) {
              renderMainApp();
              await loadToday();
            } else {
              showToast("Платёж обработан, ждём активацию");
            }
          } catch (_) {
            showToast("Не удалось обновить доступ");
          }
        } else if (status === "cancelled") {
          showToast("Платёж отменён");
        } else {
          showToast(`Статус оплаты: ${status}`);
        }
      });
    } catch (e) {
      showToast("Не удалось создать счёт");
    } finally {
      btnEl.textContent = prevText;
      btnEl.disabled = false;
    }
  }

  function renderTabs(isLocked) {
    const list = activeTabs();
    return `<nav class="tabs ${(state.me?.role && state.me.role !== "none") ? "admin-enabled" : ""}" data-skin="${document.documentElement.dataset.tabSkin || "classic"}">
      ${list.map(t => `<button class="tab ${state.activeTab === t.id ? "active" : ""}" data-tab="${t.id}" ${isLocked ? "disabled" : ""}>
        <span class="tab-emoji">${t.icon}</span>
        <span>${t.title}</span>
      </button>`).join("")}
    </nav>`;
  }

  function renderMainApp() {
    appEl.innerHTML = `
      <div class="main-content" id="mainContent">
        <header class="topbar fade">
          <div>
            <h1 class="headline">${APP_NAME}</h1>
            <div class="subline">${formatDate()}</div>
            ${(() => { const bid = document.documentElement.dataset.badge || "none"; const b = getBadgeMeta(bid); return bid !== "none" ? `<span class="badge-pill">${esc(b.emoji || "")} ${esc(b.title_ru || bid)}</span>` : ""; })()}
          </div>
          <button class="btn" id="refreshBtn" aria-label="Обновить">⟳</button>
        </header>
        <section id="tabContent" class="fade"></section>
      </div>
      ${renderTabs(false)}
    `;

    bindMainEvents();
    renderActiveTab();
  }

  function bindMainEvents() {
    appEl.querySelectorAll(".tab[data-tab]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const tab = btn.dataset.tab;
        if (state.activeTab === tab) return;
        haptic();
        state.activeTab = tab;
        renderMainApp();
        if (tab === "today" && !state.today) {
          await loadToday();
        }
        if (tab === "catalog" && !state.catalog.items.length) {
          await loadCatalog();
        }
        if (tab === "bodymap" && !state.bodyMap) {
          await loadBodyMap();
        }
        if (tab === "admin" && !state.admin.items.length) {
          await loadAdminSupplements(true);
        }
        if (tab === "survey") {
          await loadSurveyForTarget();
        }
        if (tab === "settings") {
          try { await loadAchievements(); } catch {}
        }
      });
    });

    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn?.addEventListener("click", async () => {
      haptic();
      if (state.activeTab === "today") {
        await loadComplexes(true);
        await loadToday(true);
      } else if (state.activeTab === "catalog") {
        await loadCatalog(true);
      } else if (state.activeTab === "bodymap") {
        await loadBodyMap(true);
      } else if (state.activeTab === "admin") {
        await loadAdminSupplements(true);
      } else if (state.activeTab === "settings") {
        await loadStatsOnly();
        try { await loadAchievements(true); } catch {}
        showToast("Статистика обновлена");
      } else {
        showToast("Раздел обновлён");
      }
    });
  }

  function renderActiveTab() {
    const target = document.getElementById("tabContent");
    if (!target) return;

    if (state.activeTab === "today") {
      if (state.loadingToday) {
        target.innerHTML = `<div class="card">Загружаем план...</div>`;
      } else if (!state.today) {
        target.innerHTML = `<div class="card">Нет данных по плану. Нажмите refresh.</div>`;
      } else {
        target.innerHTML = renderToday();
        bindTodayEvents();
      }
      return;
    }

    if (state.activeTab === "catalog") {
      target.innerHTML = renderCatalog();
      bindCatalogEvents();
      return;
    }

    if (state.activeTab === "bodymap") {
      target.innerHTML = renderBodyMap();
      bindBodyMapEvents();
      return;
    }

    if (state.activeTab === "admin") {
      target.innerHTML = renderAdmin();
      bindAdminEvents();
      return;
    }

    if (state.activeTab === "settings") {
      target.innerHTML = renderSettings();
      bindSettingsEvents();
      return;
    }

    if (!state.survey.target) initSurveyTarget();
    target.innerHTML = renderSurvey();
    bindSurveyEvents();
  }


  function esc(text) {
    return String(text || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }


  const GOAL_LABELS_RU = {
    brain: "Мозг",
    mood: "Настроение",
    sleep: "Сон",
    recovery: "Восстановление",
    gut: "ЖКТ",
    immune: "Иммунитет",
    joints: "Суставы",
    performance: "Результативность"
  };

  const SURVEY_STEPS = [
    { key: "energy", title: "Энергия", options: [["low","Низкая"],["ok","Нормальная"],["high","Высокая"]] },
    { key: "sleep", title: "Сон", options: [["poor","Плохой"],["ok","Ок"],["great","Отличный"]] },
    { key: "stress", title: "Стресс", options: [["low","Низкий"],["medium","Средний"],["high","Высокий"]] },
    { key: "training", title: "Тренировка сегодня", options: [["none","Нет"],["light","Легкая"],["hard","Тяжелая"]] },
    { key: "goals", title: "Фокус целей", goals: ["brain","mood","sleep","recovery","gut","immune","joints","performance"] },
    { key: "note", title: "Заметка", note: true }
  ];

  function localDateISO(d = new Date()) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function defaultSurveyTarget() {
    return new Date().getHours() >= 18 ? 'tomorrow' : 'today';
  }

  function surveyTargetDateISO(target) {
    const d = new Date();
    if (target === 'tomorrow') d.setDate(d.getDate() + 1);
    return localDateISO(d);
  }

  function surveyTargetKey() {
    const uid = state.userId || tg?.initDataUnsafe?.user?.id || 'anon';
    return `supply:survey_target:${uid}:${localDateISO()}`;
  }

  function initSurveyTarget() {
    if (state.survey.target) return;
    const saved = localStorage.getItem(surveyTargetKey());
    state.survey.target = (saved === 'today' || saved === 'tomorrow') ? saved : defaultSurveyTarget();
    localStorage.setItem(surveyTargetKey(), state.survey.target);
  }

  function surveyStorageKey() {
    initSurveyTarget();
    const uid = state.userId || tg?.initDataUnsafe?.user?.id || "anon";
    const target = state.survey.target || 'today';
    return `survey:${uid}:${surveyTargetDateISO(target)}:${target}`;
  }

  async function loadSurveyForTarget(force=false) {
    initSurveyTarget();
    const key = `${state.survey.target}:${surveyTargetDateISO(state.survey.target)}`;
    if (state.survey.loadedKey === key && !force) return;
    state.survey.step = 0;
    state.survey.view = 'wizard';
    state.survey.checkinId = null;
    state.survey.recommendations = [];
    state.survey.selected = {};
    state.survey.answers = { energy:"", sleep:"", stress:"", training:"", goals:[], note:"" };
    try {
      const data = await api(`./api/checkin/today?target=${state.survey.target}`);
      const saved = localStorage.getItem(surveyStorageKey());
      if (saved) state.survey.answers = { ...state.survey.answers, ...JSON.parse(saved) };
      if (data?.checkin) {
        state.survey.checkinId = data.checkin.id;
        state.survey.answers = { ...state.survey.answers, ...(data.checkin.answers || {}) };
        state.survey.recommendations = data.checkin.recommendations || [];
        state.survey.selected = Object.fromEntries((state.survey.recommendations || []).map((x) => [x.supplement_id, true]));
        if (state.survey.recommendations.length) state.survey.view = 'review';
      }
      state.survey.loadedKey = key;
    } catch {}
  }

  function renderSurvey() {
    initSurveyTarget();
    const sv = state.survey;
    if (sv.loading) return `<div class="card">⏳ анализ…</div>`;
    if (sv.view === 'review') {
      const todaySet = new Set();
      for (const slot of (state.today?.slots || [])) {
        for (const item of (slot.items || [])) todaySet.add(Number(item.supplement_id || 0));
        for (const c of (slot.complexes || [])) for (const ci of (c.items || [])) todaySet.add(Number(ci.supplement_id || 0));
      }
      const rows = (sv.recommendations || []).map((r) => {
        const already = todaySet.has(Number(r.supplement_id || 0));
        return `<div class="rec-card"><div class="row"><label><input type="checkbox" data-rec-toggle="${r.supplement_id}" ${sv.selected[r.supplement_id] !== false ? 'checked' : ''}/> <strong>${esc(r.name_ru || r.slug)}</strong></label><span class="badge ${r.action==='remove'?'minus':(r.action==='adjust'?'':'plus')}">${r.action==='add'?'+':(r.action==='remove'?'−':'≈')}</span></div><div class="muted" style="margin-top:6px">${esc(r.reason || '')}${already ? ' • уже в плане' : ''}</div></div>`;
      }).join('');
      return `<div class="card fade"><div class="row"><h3 style="margin:0">Рекомендации</h3><div class="segmented" data-survey-target><button class="seg-btn ${sv.target==='today'?'active':''}" data-set-target="today">Сегодня</button><button class="seg-btn ${sv.target==='tomorrow'?'active':''}" data-set-target="tomorrow">Завтра</button></div></div>${rows || '<div class="muted">Нет рекомендаций</div>'}<div style="margin-top:10px"><button class="btn" id="applyAll" style="width:100%; font-weight:800" ${sv.applying ? 'disabled' : ''}>✅ Применить всё</button></div><div class="row" style="margin-top:10px"><button class="btn secondary" id="applySelected" ${sv.applying ? 'disabled' : ''}>Применить выбранное</button><button class="btn secondary" id="cancelSurvey" ${sv.applying ? 'disabled' : ''}>Отмена</button></div></div>`;
    }
    const step = SURVEY_STEPS[sv.step];
    const p = Math.round(((sv.step+1)/SURVEY_STEPS.length)*100);
    let body = '';
    if (step.options) {
      body = step.options.map(([v,t]) => `<button class="survey-option ${sv.answers[step.key]===v?'active':''}" data-survey-pick="${step.key}:${v}">${t}</button>`).join('');
    } else if (step.goals) {
      body = `<div class="survey-goals">${step.goals.map((g)=>`<button class="chip ${sv.answers.goals.includes(g)?'green':''}" data-goal-toggle="${g}">${GOAL_LABELS_RU[g] || g}</button>`).join('')}</div>`;
    } else {
      body = `<textarea id="surveyNote" maxlength="280" class="survey-note" placeholder="Короткая заметка">${esc(sv.answers.note || '')}</textarea><div class="muted" style="margin-top:6px">${(sv.answers.note||'').length}/280</div>`;
    }
    return `<div class="card fade"><div class="row"><strong>${step.title}</strong><div class="row" style="gap:6px"><div class="segmented" data-survey-target><button class="seg-btn ${sv.target==='today'?'active':''}" data-set-target="today">Сегодня</button><button class="seg-btn ${sv.target==='tomorrow'?'active':''}" data-set-target="tomorrow">Завтра</button></div><span class="muted">${sv.step+1}/${SURVEY_STEPS.length}</span></div></div><div class="progress"><i style="width:${p}%"></i></div>${body}<div class="row" style="margin-top:12px"><button class="btn secondary" id="surveyBack" ${sv.step===0?'disabled':''}>Назад</button><button class="btn" id="surveyNext">${sv.step===SURVEY_STEPS.length-1?'Получить рекомендации':'Далее'}</button></div></div>`;
  }

  function bindSurveyEvents() {
    appEl.querySelectorAll('[data-set-target]').forEach((el)=>el.addEventListener('click', async ()=>{
      const next = el.dataset.setTarget;
      if (next === state.survey.target) return;
      haptic();
      state.survey.target = next;
      localStorage.setItem(surveyTargetKey(), next);
      state.survey.loadedKey = '';
      await loadSurveyForTarget(true);
      renderActiveTab();
    }));

    appEl.querySelectorAll('[data-survey-pick]').forEach((el)=>el.addEventListener('click', ()=>{ haptic(); const [k,v]=el.dataset.surveyPick.split(':'); state.survey.answers[k]=v; localStorage.setItem(surveyStorageKey(), JSON.stringify(state.survey.answers)); renderActiveTab(); }));
    appEl.querySelectorAll('[data-goal-toggle]').forEach((el)=>el.addEventListener('click', ()=>{ haptic(); const g=el.dataset.goalToggle; const set=new Set(state.survey.answers.goals||[]); if (set.has(g)) set.delete(g); else set.add(g); state.survey.answers.goals=[...set]; localStorage.setItem(surveyStorageKey(), JSON.stringify(state.survey.answers)); renderActiveTab(); }));
    document.getElementById('surveyNote')?.addEventListener('input', (e)=>{ state.survey.answers.note=String(e.target.value||'').slice(0,280); localStorage.setItem(surveyStorageKey(), JSON.stringify(state.survey.answers)); renderActiveTab(); });
    document.getElementById('surveyBack')?.addEventListener('click', ()=>{ haptic(); state.survey.step=Math.max(0,state.survey.step-1); renderActiveTab(); });

    document.getElementById('surveyNext')?.addEventListener('click', async ()=>{
      haptic();
      if (state.survey.step < SURVEY_STEPS.length-1) {
        state.survey.step += 1;
        renderActiveTab();
        return;
      }
      state.survey.loading=true;
      renderActiveTab();
      try {
        const res=await api('./api/checkin',{method:'POST', body:{answers: state.survey.answers, target: state.survey.target, client_local_iso: new Date().toISOString()}});
        state.survey.loading=false;
        state.survey.checkinId=res.checkin_id;
        state.survey.recommendations=res.recommendations||[];
        state.survey.selected=Object.fromEntries((state.survey.recommendations||[]).map((x)=>[x.supplement_id,true]));
        state.survey.view='review';
        renderActiveTab();
      } catch(e){
        state.survey.loading=false;
        showToast('AI временно недоступен, попробуйте ещё раз');
        renderActiveTab();
      }
    });

      <div style="margin-top:8px">Куда/зачем: ${tgts.map(v=>chip(v,filters.targets,'targets',TARGET_LABELS_RU)).join(' ')}</div>
      <div style="margin-top:8px">Нагрузка: ${br.map(v=>chip(v,filters.burdens,'burdens',BURDEN_LABELS_RU)).join(' ')}</div>
      <div style="margin-top:8px"><select id="sortSelect" style="width:100%;padding:8px;border-radius:10px"><option value="alpha" ${filters.sort==='alpha'?'selected':''}>По алфавиту</option><option value="evidence" ${filters.sort==='evidence'?'selected':''}>По доказательности</option><option value="trials" ${filters.sort==='trials'?'selected':''}>По исследованиям</option><option value="effect" ${filters.sort==='effect'?'selected':''}>По эффекту</option></select></div>
      <div class="row" style="margin-top:10px"><button class="btn" id="applyFilters">Применить</button><button class="btn secondary" id="resetFilters">Сбросить</button></div>

  async function loadCatalog(force) {
    const c = state.catalog;
    if ((c.loading || c.loadingMore) && !force) return;
    if (c.page > 0) c.loadingMore = true;
    else c.loading = true;
    renderActiveTab();

    const f = c.filters;
    const qp = new URLSearchParams({ q: c.q || '', page: String(c.page), page_size: '20', sort: f.sort || 'alpha' });
    if (f.evidence.length) qp.set('evidence', f.evidence.join(','));
    if (f.targets.length) qp.set('targets', f.targets.join(','));
    if (f.burdens.length) qp.set('burdens', f.burdens.join(','));
    try {
      const res = await api(`./api/catalog?${qp.toString()}`);
      const nextItems = res.items || [];
      state.catalog.items = c.page === 0 ? nextItems : c.items.concat(nextItems);
      state.catalog.total = res.total || 0;
      state.catalog.hasMore = state.catalog.items.length < state.catalog.total;
      state.catalog.error = false;
    } catch (e) {
      state.catalog.error = e.message !== 'PREMIUM_REQUIRED';
      if (c.page > 0) state.catalog.page = Math.max(0, c.page - 1);
    } finally {
      state.catalog.loading = false;
      state.catalog.loadingMore = false;
      renderActiveTab();
    }
  }

  async function loadCatalogMore() {
    const c = state.catalog;
    if (c.loading || c.loadingMore || !c.hasMore || c.filtersOpen || c.error) return;
    state.catalog.page += 1;
    await loadCatalog(true);
  }

  function setupCatalogInfiniteScroll() {
    catalogObserver?.disconnect?.();
    catalogObserver = null;
    const sentinel = document.getElementById('catalogSentinel');
    if (!sentinel || state.activeTab !== 'catalog') return;
    catalogObserver = new IntersectionObserver((entries) => {
      const hit = entries.some((entry) => entry.isIntersecting);
      if (!hit) return;
      loadCatalogMore();
    }, { root: null, rootMargin: '600px 0px', threshold: 0 });
    catalogObserver.observe(sentinel);
  }

  function bindDetailModalEvents() {
    appEl.querySelector('[data-detail-close]')?.addEventListener('click', ()=>{ state.catalog.detail=null; renderActiveTab(); });
    appEl.querySelector('[data-open-shop]')?.addEventListener('click', ()=>{ const u=state.catalog.detail?.purchase_url; if(u) tg?.openLink?.(u); });
    appEl.querySelector('[data-add-complex]')?.addEventListener('click', async (e)=>{
      haptic();
      const id=Number(e.currentTarget.dataset.id);
      try {
        if (!state.complexes.length) {
          const name = prompt('Название нового комплекса');
          if (!name) return;
          await api('./api/complexes/create',{method:'POST',body:{name}});
          await loadComplexes(true);
        }
        const names=state.complexes.map((c)=>c.name).join('\n');
        const pick=prompt('В какой комплекс добавить?\n'+names);
        if (!pick) return;
        let target=state.complexes.find((c)=>c.name===pick);
        if (!target) {
          const r=await api('./api/complexes/create',{method:'POST',body:{name:pick}});
          target=r.item;
          await loadComplexes(true);
        }
        await api(`./api/complexes/${target.id}/items/add`,{method:'POST',body:{supplement_id:id}});
        showToast(`Добавлено в комплекс ${target.name}`);
      } catch { showToast('Не удалось добавить в комплекс'); }
    });
    appEl.querySelector('[data-stack-toggle]')?.addEventListener('click', async (e)=>{
      const b=e.currentTarget; const id=Number(b.dataset.id); const inStack=b.dataset.in==='1';
      const action=inStack?'remove':'add'; haptic();
      const detail=state.catalog.detail; const prev=detail.in_stack; detail.in_stack=!inStack;
      const listItem=state.catalog.items.find(i=>i.id===id); if(listItem) listItem.in_stack=detail.in_stack; renderActiveTab();
      try { const r=await api('./api/my_supplements/toggle',{method:'POST',body:{supplement_id:id,action}}); detail.in_stack=!!r.in_stack; if(listItem) listItem.in_stack=detail.in_stack; showToast(detail.in_stack?'Добавлено в стек':'Убрано из стека'); renderActiveTab(); }
      catch { detail.in_stack=prev; if(listItem) listItem.in_stack=prev; renderActiveTab(); showToast('Не удалось обновить стек'); }
    });
  }

  function bindCatalogEvents() {
    document.getElementById('catalogSearch')?.addEventListener('input', (e) => {
      state.catalog.q = e.target.value;
      clearTimeout(state.searchDebounce);
      state.searchDebounce = setTimeout(async () => {
        state.catalog.page = 0;
        state.catalog.hasMore = true;

    });

      state.catalog.hasMore = true;
      await loadCatalog(true);
    });

      const [k,v]=el.dataset.filterRemove.split(':');
      const arr=state.catalog.filters[k] || [];

      if (idx>=0) arr.splice(idx,1);

      await loadCatalog(true);
    }));

    appEl.querySelectorAll('[data-catalog-open]').forEach((el)=>el.addEventListener('click', async ()=>{
      haptic();
      try { const d=await api(`./api/supplement/${el.dataset.catalogOpen}`); state.catalog.detail=d.item; renderActiveTab(); } catch { showToast('Не удалось открыть карточку'); }
    }));

    bindDetailModalEvents();

    appEl.querySelectorAll('[data-filter-close]').forEach((el)=>el.addEventListener('click',()=>{ state.catalog.filtersOpen=false; renderActiveTab(); }));
    appEl.querySelectorAll('[data-filter-toggle]').forEach((el)=>el.addEventListener('click',()=>{
      const [k,v]=el.dataset.filterToggle.split(':');
      const arr=state.catalog.filters[k];
      const idx=arr.indexOf(v);
      if(idx>=0) arr.splice(idx,1); else arr.push(v);
      renderActiveTab();
      const s=document.getElementById('sortSelect');
      if(s) s.value=state.catalog.filters.sort;
    }));

    document.getElementById('applyFilters')?.addEventListener('click', async ()=>{
      const s=document.getElementById('sortSelect');
      if(s) state.catalog.filters.sort=s.value;
      state.catalog.filtersOpen=false;
      state.catalog.page=0;
      state.catalog.hasMore = true;
      await loadCatalog(true);
    });

    document.getElementById('resetFilters')?.addEventListener('click', async ()=>{
      state.catalog.filters={evidence:[],targets:[],burdens:[],sort:'alpha'};
      state.catalog.filtersOpen=false;
      state.catalog.page=0;
      state.catalog.hasMore = true;
      await loadCatalog(true);
    });

    setupCatalogInfiniteScroll();
  }

      ${perms.content_bulk && a.selectionMode ? `<div class="admin-select-count">Выбрано: ${selected.length}</div>` : ''}
    `;
  }

  async function loadAdminSupplements(force) {
    if (state.admin.loading && !force) return;
    state.admin.loading = true;
    renderActiveTab();
    try {
      const a = state.admin;
      const qp = new URLSearchParams({ q: a.q || '', page: String(a.page), page_size: String(a.pageSize) });
      if (a.filters.is_active !== '') qp.set('is_active', a.filters.is_active);
      if (a.filters.evidence) qp.set('evidence', a.filters.evidence);
      const res = await api(`./api/admin/supplements?${qp.toString()}`);
      a.items = a.page === 0 ? (res.items || []) : a.items.concat(res.items || []);
      a.total = res.total || 0;
    } catch (e) {
      if (e.message === 'PERMISSION_DENIED') showToast('Только для админов');
      else showToast('Ошибка загрузки admin-списка');
    } finally {
      state.admin.loading = false;
      renderActiveTab();
    }
  }

  async function loadAdminSupplement(id) {
    try {
      const res = await api(`./api/admin/supplement/${id}`);
      state.admin.detail = res;
      state.admin.errors = {};
      renderActiveTab();
    } catch (e) {
      showToast('Не удалось открыть запись');
    }
  }

  async function saveAdminField(field) {
    const detail = state.admin.detail?.item;
    if (!detail) return;
    const value = detail[field] ?? '';
    try {
      await api(`./api/admin/supplement/${detail.id}/set_field`, { method:'POST', body:{ field, value } });
      state.admin.errors[field] = '';
      await loadAdminSupplement(detail.id);
      showToast('Сохранено');
    } catch (e) {
      state.admin.errors[field] = `Ошибка: ${e.message}`;
      renderActiveTab();
    }
  }

  const SYSTEM_LABELS = {
    brain: 'Мозг', heart: 'Сердце', liver: 'Печень', kidney: 'Почки', gut: 'ЖКТ', lungs: 'Лёгкие',
    thyroid: 'Щитовидка', pancreas: 'Поджелудочная', joints: 'Суставы', muscle: 'Мышцы', bone: 'Кости',
    skin: 'Кожа', immune: 'Иммунитет', blood: 'Кровь', endocrine: 'Эндокринная'
  };
  const BODYMAP_ORDER = ["brain","heart","liver","kidney","gut","lungs","thyroid","pancreas","immune","blood","joints","muscle","bone","skin","endocrine"];

  function clamp(v, lo, hi) {
    return Math.min(hi, Math.max(lo, v));
  }

  function bodyMapSystem(key) {
    return state.bodyMap?.systems?.[key] || { benefit_count: 0, burden_count: 0, mixed_count: 0, benefit_strength_sum: 0, burden_strength_sum: 0, mixed_strength_sum: 0, top: [] };
  }

  async function fetchOrganSvg(key) {
    if (state.organSvgs[key]) return state.organSvgs[key];
    const fallback = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="icon"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
    try {
      const res = await fetch(`./assets/icons/organs/${key}.svg`);
      state.organSvgs[key] = res.ok ? await res.text() : fallback;
    } catch {
      state.organSvgs[key] = fallback;
    }
    return state.organSvgs[key];
  }

  async function hydrateOrganIcons(keys) {
    for (const key of keys) {
      await fetchOrganSvg(key);
    }
    keys.forEach((key) => {
      appEl.querySelectorAll(`[data-organ-icon="${key}"]`).forEach((el) => {
        el.innerHTML = state.organSvgs[key] || '';
      });
    });
  }

  function tileEmoji(key, benefitI, burdenI) {
    if (burdenI >= 0.65) {
      if (key === 'liver') return '🫠';
      if (key === 'kidney') return '😮‍💨';
      if (key === 'gut') return '🤢';
    }
    if (benefitI >= 0.85) {
      if (key === 'brain') return '⚡';
      if (key === 'heart') return '❤️‍🔥';
      if (key === 'immune') return '🛡️';
      if (key === 'skin') return '✨';
    }
    return '';
  }

  function renderBodyMap() {
    if (state.loadingBodyMap && !state.bodyMap) return '<div class="card">Загружаем BodyMap...</div>';
    if (!state.bodyMap) return '<div class="card">Нет данных BodyMap. Нажмите refresh.</div>';
    const systems = BODYMAP_ORDER.map((key) => bodyMapSystem(key));
    const maxBenefitSum = Math.max(1, ...systems.map((s) => Number(s.benefit_strength_sum || 0)));
    const maxBurdenSum = Math.max(1, ...systems.map((s) => Number(s.burden_strength_sum || 0)));
    const sheet = state.bodyMapSheet ? renderBodyMapSheet(state.bodyMapSheet) : '';
    return `
      <div class="card fade"><strong>BodyMap · ${esc(state.bodyMap.day || '')}</strong>
        <div class="legend-grid">
          <div class="legend-pill legend-benefit">Свечение = польза</div>
          <div class="legend-pill legend-burden">Красный контур = нагрузка</div>
          <div class="legend-pill legend-mixed">Нажмите плитку для деталей</div>
        </div>
      </div>
      <div class="card fade">
        <div class="organs-grid">
          ${BODYMAP_ORDER.map((key)=>{
            const s = bodyMapSystem(key);
            const benefitSum = Number(s.benefit_strength_sum || 0);
            const burdenSum = Number(s.burden_strength_sum || 0);
            const mixedCount = Number(s.mixed_count || 0);
            const total = Number(s.benefit_count || 0) + Number(s.burden_count || 0) + mixedCount;
            const mixedBalanced = mixedCount > 0 && Number(s.benefit_count || 0) === Number(s.burden_count || 0);
            const benefitI = benefitSum > 0 ? clamp(benefitSum / maxBenefitSum, 0.12, 1) : 0;
            const burdenI = burdenSum > 0 ? clamp(burdenSum / maxBurdenSum, 0.12, 1) : 0;
            const colorBias = mixedBalanced ? 0.44 : null;
            const tileBenefitI = colorBias === null ? benefitI : colorBias;
            const tileBurdenI = colorBias === null ? burdenI : colorBias;
            const emoji = tileEmoji(key, benefitI, burdenI);
            return `<button class="organ-tile" data-system="${key}" data-total="${total}" style="--bI:${tileBenefitI.toFixed(3)};--rI:${tileBurdenI.toFixed(3)};">
              <div class="organ-icon" data-organ-icon="${key}"></div>
              <div class="organ-text">
                <div class="title">${SYSTEM_LABELS[key] || key}</div>
                <div class="muted">${(() => { const mc = s.mixed_count || 0; return `${s.benefit_count||0} + / ${s.burden_count||0} -${mc ? ` · ${mc} ±` : ''}`; })()}</div>
              </div>
              ${emoji ? `<div class="organ-emoji">${emoji}</div>` : ''}
            </button>`;
          }).join('')}
        </div>
      </div>
      ${sheet}
      ${state.catalog.detail ? renderDetailModal(state.catalog.detail) : ""}
    `;
  }

  function renderBodyMapSheet(systemKey) {
    const data = bodyMapSystem(systemKey);
    const list = data.top || [];
    return `<div class="sheet-backdrop" data-sheet-close></div><div class="card sheet" role="dialog">
      <div class="row"><strong>${SYSTEM_LABELS[systemKey] || systemKey}</strong><button class="btn secondary" data-sheet-close>Закрыть</button></div>
      <div class="row" style="margin-top:8px"><span class="badge plus">Польза: ${data.benefit_count || 0}</span><span class="badge minus">Нагрузка: ${data.burden_count || 0}</span>${(data.mixed_count || 0) > 0 ? `<span class="badge mixed">Смешанное: ${data.mixed_count || 0}</span>` : ''}</div>
      <div style="margin-top:10px">${list.length ? list.map((item)=>{ const cls = item.direction==='burden' ? 'minus' : (item.direction==='mixed' ? 'mixed' : 'plus'); const sign = item.direction==='burden' ? '-' : (item.direction==='mixed' ? '±' : '+'); return `<button class="item-row" data-bodymap-open="${esc(item.slug)}"><span class="badge ${cls}">${sign}</span><span>${esc(item.name_ru || item.slug)}</span></button>`; }).join('') : '<div class="sheet-empty">нет данных</div>'}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-bodymap-catalog="${systemKey}">Открыть в каталоге</button></div>
    </div>`;
  }

  function bindBodyMapEvents() {

    bindDetailModalEvents();
    appEl.querySelectorAll('[data-system]').forEach((el)=>el.addEventListener('click', ()=>{ haptic(); state.bodyMapSheet = el.dataset.system; renderActiveTab(); }));

  async function loadBodyMap(force) {
    if (state.loadingBodyMap && !force) return;
    state.loadingBodyMap = true;
    renderActiveTab();
    try {
      const map = await api('./api/body_map');

  function normalizeHHMM(value) {
    const raw = String(value || '').trim();
    const m = raw.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return '';
    const hh = Number(m[1]);
    const mm = Number(m[2]);
    if (!Number.isFinite(hh) || !Number.isFinite(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) return '';
    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  function statusClass(status) {
    if (status === "taken") return "status-taken";
    if (status === "skipped") return "status-skipped";
    return "status-none";
  }

  function statusText(status) {
    if (status === "taken") return "✅ Принято";
    if (status === "skipped") return "⛔ Пропуск";
    return "◻ Не отмечено";
  }

  async function openSupplementHub(supplementId) {
    const sid = Number(supplementId);
    if (!sid) return;
    const all = [...(state.mySupplements.active || []), ...(state.mySupplements.frozen || [])];
    const item = all.find((x) => Number(x.supplement_id) === sid);
    if (!item) return;
    state.suppHub.open = true;
    state.suppHub.loading = true;
    state.suppHub.item = item;
    state.suppHub.doseText = item.dose_text || '';
    state.suppHub.noteText = item.note_text || '';
    state.suppHub.reminderInput = '';
    renderActiveTab();
    try {
      const [scheduleRes, remRes] = await Promise.all([
        api('./api/schedule'),
        api(`./api/reminders/for_supplement?supplement_id=${sid}`),
      ]);
      const slots = Array.isArray(scheduleRes.slots) ? scheduleRes.slots : [];
      const schedules = Array.isArray(scheduleRes.schedules) ? scheduleRes.schedules : [];
      const sch = schedules.find((x) => Number(x.supplement_id) === sid);
      state.suppHub.slots = slots;
      state.suppHub.slotId = sch?.slot_id || 'morning';
      state.suppHub.time = sch?.time_hhmm || '';
      state.suppHub.reminderTimes = Array.isArray(remRes.times) ? remRes.times : [];
      state.suppHub.remindersMode = state.suppHub.reminderTimes.length ? 'custom' : 'slot';
    } catch {
      showToast('Не удалось загрузить хаб добавки');
    } finally {
      state.suppHub.loading = false;
      renderActiveTab();
    }
  }

    document.getElementById('hubSlot')?.addEventListener('change', (e) => { state.suppHub.slotId = e.target.value || 'morning'; });
    document.getElementById('hubTime')?.addEventListener('input', (e) => { state.suppHub.time = e.target.value || ''; });
    document.getElementById('hubRemTime')?.addEventListener('input', (e) => { state.suppHub.reminderInput = e.target.value || ''; });

    appEl.querySelectorAll('[data-rem-add-time]').forEach((el) => {
      el.addEventListener('click', () => {
        const time = normalizeHHMM(state.suppHub.reminderInput);
        if (!time) return showToast('Введите время HH:MM');
        if ((state.suppHub.reminderTimes || []).includes(time)) return;
        state.suppHub.reminderTimes = [...(state.suppHub.reminderTimes || []), time].sort();
        state.suppHub.reminderInput = '';
        renderActiveTab();
      });
    });

    appEl.querySelectorAll('[data-schedule-add-slot]').forEach((el) => {
      el.addEventListener('click', async () => {
        const time = normalizeHHMM(state.suppHub.time);
        if (!time) return showToast('Укажите корректное время');
        try {
          const r = await api('./api/schedule/add_slot', { method: 'POST', body: { time_local: time, title_ru: `Слот ${time}` } });
          const s = await api('./api/schedule');
          state.suppHub.slots = Array.isArray(s.slots) ? s.slots : [];
          state.suppHub.slotId = r.slot_id || state.suppHub.slotId;
          renderActiveTab();
          showToast('Слот создан');
        } catch {
          showToast('Не удалось создать слот');
        }
      });
    });

    appEl.querySelectorAll('[data-supp-hub-save]').forEach((el) => {
      el.addEventListener('click', async () => {
        const item = state.suppHub.item;
        if (!item) return;
        const sid = Number(item.supplement_id);
        const time = normalizeHHMM(state.suppHub.time) || null;
        state.suppHub.saving = true;
        renderActiveTab();
        try {
          await api('./api/my_supplements/update', { method: 'POST', body: { supplement_id: sid, dose_text: state.suppHub.doseText || '', note_text: state.suppHub.noteText || '' } });
          await api('./api/schedule/set', { method: 'POST', body: { supplement_id: sid, slot_id: state.suppHub.slotId || 'morning', time_hhmm: time } });
          await api('./api/reminders/set', { method: 'POST', body: { supplement_id: sid, mode: state.suppHub.remindersMode, times: state.suppHub.remindersMode === 'custom' ? (state.suppHub.reminderTimes || []) : [] } });
          await Promise.all([loadMySupplements(true), loadToday(true)]);
          showToast('Изменения сохранены');
        } catch {
          showToast('Не удалось сохранить изменения');
        } finally {
          state.suppHub.saving = false;
          renderActiveTab();
        }
      });
    });
  }

  function findItemById(id) {
    for (const slot of state.today?.slots || []) {
      const item = (slot.items || []).find(i => String(i.supplement_id) === String(id));
      if (item) return item;
    }
    return null;
  }

  async function toggleOne(supplementId, nextStatus) {
    haptic();
    const item = findItemById(supplementId);
    if (!item) return;

    const prev = item.status;
    item.status = nextStatus;
    renderActiveTab();

    try {
      await api("./api/today/toggle", {
        method: "POST",
        body: { supplement_id: Number(supplementId), status: nextStatus }
      });
    } catch (e) {
      item.status = prev;
      renderActiveTab();
      showToast("Ошибка синхронизации, откат");
    }
  }

  async function setSlotStatus(slotId, status) {
    haptic();
    const slot = (state.today?.slots || []).find(s => String(s.slot_id) === String(slotId));
    if (!slot) return;

    const items = slot.items || [];
    const complexes = slot.complexes || [];
    if (!items.length && !complexes.length) return;

    const snapshot = {
      items: items.map((i) => ({ id: i.supplement_id, status: i.status })),
      complexes: complexes.map((c) => ({
        id: c.complex_id,
        status: c.status,
        takenCount: c.taken_count,
        itemStatuses: (c.items || []).map((item) => ({ id: item.supplement_id, status: item.status })),
      })),
    };

    items.forEach((i) => { i.status = status; });
    complexes.forEach((complex) => {
      complex.status = status;
      complex.taken_count = status === "taken" ? (complex.total_count || 0) : 0;
      (complex.items || []).forEach((item) => { item.status = status; });
    });
    renderActiveTab();

    try {
      const complexPending = complexes.map((complex) => () => api("./api/today/toggle_complex", {
        method: "POST",
        body: { complex_id: Number(complex.complex_id), status }
      }));
      await runBatched(complexPending, 3);

      const complexItemIds = new Set(
        complexes.flatMap((complex) => (complex.items || []).map((item) => String(item.supplement_id)))
      );
      const singlePending = items
        .filter((item) => !complexItemIds.has(String(item.supplement_id)))
        .map((item) => () => api("./api/today/toggle", {
        method: "POST",
        body: { supplement_id: Number(item.supplement_id), status }
      }));

      await runBatched(singlePending, 3);
      await loadToday(true);
      showToast(status === "taken" ? "Отметил всё как принято" : "Слот сброшен");
    } catch (e) {
      items.forEach((item) => {
        const old = snapshot.items.find(s => String(s.id) === String(item.supplement_id));
        if (old) item.status = old.status;
      });
      complexes.forEach((complex) => {
        const oldComplex = snapshot.complexes.find((c) => String(c.id) === String(complex.complex_id));
        if (!oldComplex) return;
        complex.status = oldComplex.status;
        complex.taken_count = oldComplex.takenCount;
        (complex.items || []).forEach((item) => {
          const oldItem = oldComplex.itemStatuses.find((x) => String(x.id) === String(item.supplement_id));
          if (oldItem) item.status = oldItem.status;
        });
      });
      renderActiveTab();
      await loadToday(true);
      showToast("Не удалось применить к слоту");
    }
  }

  async function runBatched(tasks, batchSize) {
    for (let i = 0; i < tasks.length; i += batchSize) {
      const chunk = tasks.slice(i, i + batchSize).map((fn) => fn());
      await Promise.all(chunk);
      await new Promise((resolve) => setTimeout(resolve, 80));
    }
  }

  boot();
})();
</script>
</body>
</html>
