<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SupplyBot WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 16px; background:#fafafa; color:#111; }
    .card { background:#fff; border:1px solid #e4e4e4; border-radius:14px; padding:14px; margin:10px 0; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .tab { padding:12px; border:1px dashed #ccc; border-radius:10px; opacity:.7; }
    button { padding:10px 12px; border-radius:10px; border:1px solid #ccc; background:#fff; cursor:pointer; margin-right:8px; margin-top:8px; }
    .muted { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.ready();

function h(headers={}) {
  return {"Content-Type":"application/json", "X-Telegram-Init-Data": tg?.initData || "", ...headers};
}

async function apiMe(){
  const r = await fetch('./api/me', {headers: h()});
  return await r.json();
}

async function buy(planId, method){
  const r = await fetch('./api/billing/create_invoice_link', {
    method:'POST', headers:h(), body:JSON.stringify({plan_id:planId, method})
  });
  const j = await r.json();
  if(!j.ok){ alert('Не удалось создать счёт'); return; }
  tg?.openInvoice(j.invoice_link, async (status)=>{
    if (status === 'paid' || status === 'success') {
      const me = await apiMe();
      if (me.premium) location.reload();
    }
  });
}

function renderPaywall(me){
  const plans = me.plans || [];
  const plansHtml = plans.map(p => `
    <div class="card">
      <b>${p.plan_id}</b> · ${p.months} мес.
      <div class="muted">${p.price_stars} ⭐ / ${Math.round((p.price_rub||0)/100)} ₽</div>
      ${p.stars_enabled ? `<button onclick="buy('${p.plan_id}','stars')">Купить за ⭐</button>` : ''}
      ${p.rub_enabled ? `<button onclick="buy('${p.plan_id}','yookassa')">Купить за ₽</button>` : ''}
    </div>
  `).join('');

  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>🔒 Premium доступ</h2>
      <div class="muted">Без подписки доступна только витрина.</div>
    </div>
    <div class="card tabs">
      <div class="tab">Today (preview)</div>
      <div class="tab">Catalog (preview)</div>
      <div class="tab">BodyMap (preview)</div>
      <div class="tab">Survey (preview)</div>
    </div>
    <div class="card"><b>Как это выглядит:</b><div class="muted">Персональный Today, трекинг и AI-инсайты в полной версии.</div></div>
    ${plansHtml}
  `;
}

function renderPremium(me){
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>✅ Premium активен</h2>
      <div>До: ${me.premium_until_utc || '—'}</div>
      <button onclick="openToday()">Открыть Today</button>
    </div>
  `;
}

async function openToday(){
  const r = await fetch('./api/today', {headers:h()});
  const j = await r.json();
  alert(JSON.stringify(j, null, 2));
}

(async function init(){
  try {
    const me = await apiMe();
    if (!me.premium) return renderPaywall(me);
    return renderPremium(me);
  } catch(e){
    document.getElementById('app').textContent = String(e);
  }
})();
</script>
</body>
</html>
