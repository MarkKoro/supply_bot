<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вернуться в приложение</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin:0; background:#0b1020; color:#eef2ff; }
    .wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
    .card { max-width:520px; width:100%; border:1px solid rgba(255,255,255,.16); border-radius:16px; padding:20px; background:rgba(255,255,255,.06); }
    .btn { display:inline-block; min-height:44px; margin-top:12px; padding:10px 14px; border-radius:10px; text-decoration:none; color:#fff; background:#315ccc; transition:background-color .18s ease; }
    .btn:hover { background:#284fb8; }
    .btn:focus-visible { outline:2px solid #a9caff; outline-offset:3px; }
    @media (prefers-reduced-motion:reduce) { .btn { transition:none; } }
    .muted { opacity:.86; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 style="margin:0 0 8px">Вернуться в приложение</h1>
      <div class="muted">Вернитесь в Telegram. Подписка появится после подтверждения платежа платёжным сервисом.</div>
      <a id="openBotLink" class="btn" href="https://t.me/supplly_bot" target="_blank" rel="noopener">Открыть бота</a>
    </div>
  </div>
<script>
(function () {
  function currentProjectBasePath() {
    const path = window.location.pathname || "/";
    if (path === "/supply" || path === "/supply/") return "/supply/";
    if (path.startsWith("/supply/")) return "/supply/";
    return "/";
  }
  function projectUrl(rel) {
    const cleanRel = String(rel || "").replace(/^\/+/, "");
    return currentProjectBasePath() + cleanRel;
  }
  fetch(projectUrl('api/config'))
    .then((r) => r.json())
    .then((d) => {
      const raw = String(d?.bot_username || '').trim().replace(/^@+/, '');
      if (!raw) return;
      const link = `https://t.me/${raw}`;
      const a = document.getElementById('openBotLink');
      if (a) a.href = link;
    })
    .catch(() => {});
})();
</script>
</body>
</html>
