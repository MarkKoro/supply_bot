<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>ГУДы БАДы WebApp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-1: #070b1a;
      --bg-2: #101a44;
      --bg-3: #1b0f3a;
      --card: rgba(16, 24, 52, 0.68);
      --card-strong: rgba(24, 36, 74, 0.82);
      --text: #eef2ff;
      --muted: rgba(218, 228, 248, 0.8);
      --accent: #7db7ff;
      --green: #49d88d;
      --red: #ff5a6f;
      --neutral: rgba(255,255,255,0.17);
    }

    html[data-theme="nebula"] { --bg-1:#0c0a23; --bg-2:#25125d; --bg-3:#130b2d; --accent:#b48bff; }
    html[data-theme="aurora"] { --bg-1:#041a18; --bg-2:#0f3c3e; --bg-3:#12252f; --accent:#7df0c2; }
    html[data-theme="noir"] { --bg-1:#090909; --bg-2:#171717; --bg-3:#101010; --accent:#bbbbbb; }
    html[data-theme="solar"] { --bg-1:#2a1d08; --bg-2:#4e3310; --bg-3:#2b1a0b; --accent:#ffd36d; }
    html[data-theme="emerald"] { --bg-1:#062015; --bg-2:#0c4630; --bg-3:#0a2c1f; --accent:#6ff0b8; }
    html[data-theme="bloodline"] { --bg-1:#28050d; --bg-2:#4a0d1d; --bg-3:#25050f; --accent:#ff6a86; }
    html[data-theme="glitch"] { --bg-1:#0b1129; --bg-2:#1e255f; --bg-3:#13223e; --accent:#68e4ff; }
    html[data-theme="ivory"] { --bg-1:#1a1b20; --bg-2:#2a2d36; --bg-3:#1f2229; --accent:#f0e6ce; }
    html[data-theme="graphite"] { --bg-1:#101114; --bg-2:#1b1e24; --bg-3:#14161b; --accent:#c6ced9; }
    html[data-theme="sakura"] { --bg-1:#201824; --bg-2:#32243a; --bg-3:#261b2d; --accent:#ffbcd4; }
    html[data-theme="deepsea"] { --bg-1:#071a2b; --bg-2:#0f2f49; --bg-3:#0b2337; --accent:#7dd9ff; }
    html[data-theme="ember"] { --bg-1:#24130f; --bg-2:#3f241b; --bg-3:#2b1913; --accent:#ffb27d; }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 640px at 12% -8%, rgba(67, 132, 255, 0.42) 0%, transparent 62%),
        radial-gradient(980px 580px at 92% 2%, rgba(66, 48, 143, 0.42) 0%, transparent 58%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 54%, var(--bg-3) 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      mix-blend-mode: screen;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(900px 520px at 50% 10%, rgba(255,255,255,0.06), transparent 55%),
                  radial-gradient(1200px 900px at 50% 120%, rgba(0,0,0,0.65), transparent 55%);
      mix-blend-mode: soft-light;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 14px calc(100px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .topbar.topbar-hidden { display: none; margin-bottom: 0; }
    .topbar.topbar-today {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .topbar-main { min-width: 0; flex: 1; }
    .topbar-actions { display: flex; align-items: flex-start; justify-content: flex-end; }
    .topbar.topbar-today .topbar-actions { width: 100%; justify-content: stretch; }
    .today-header-actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .today-header-actions .btn {
      width: 100%;
      min-width: 0;
    }
    .today-header-actions .btn:first-child { justify-self: start; }
    .today-header-actions .btn:last-child { justify-self: end; }
    @media (max-width: 520px) {
      .topbar { align-items: flex-start; }
      .topbar.topbar-today { align-items: stretch; }
      .today-header-actions .btn { padding: 9px 10px; font-size: 13px; }
    }

    .headline { margin: 0; font-size: 20px; }
    .subline { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .topbar-meta-row { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
    .topbar-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .btn, .chip {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      color: var(--text);
      background: linear-gradient(170deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
      box-shadow:
        0 12px 24px rgba(0,0,0,0.34),
        0 2px 0 rgba(255,255,255,0.18) inset,
        0 -2px 0 rgba(0,0,0,0.4) inset;
    }

    .btn {
      cursor: pointer;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.2;
    }

    .btn:active, .pressed {
      transform: translateY(1px);
      box-shadow:
        0 3px 8px rgba(0,0,0,0.35),
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 -1px 0 rgba(0,0,0,0.55) inset;
    }

    .btn.secondary { opacity: 0.88; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .btn.cta-active {
      border-color: rgba(125,183,255,0.95);
      box-shadow:
        0 12px 24px rgba(0,0,0,0.34),
        0 0 0 1px rgba(125,183,255,0.55) inset,
        0 0 0 3px rgba(125,183,255,0.2);
    }

    .input-cta-active {
      border-color: rgba(125,183,255,0.95) !important;
      box-shadow: 0 0 0 1px rgba(125,183,255,0.58), 0 0 0 3px rgba(125,183,255,0.18) !important;
    }

    .card {
      border-radius: 20px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 22px 42px rgba(3,7,20,0.44),
        0 7px 14px rgba(2,6,18,0.4),
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 -2px 0 rgba(0,0,0,0.35) inset;
      backdrop-filter: blur(10px);
      margin-bottom: 12px;
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
    .mode-banner { gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .mode-banner .btn { flex: 0 0 auto; }
    .mode-banner .muted { overflow-wrap: anywhere; word-break: break-word; }
    .row > * { min-width: 0; }
    .muted { color: var(--muted); }

    .tabs {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border-radius: 22px;
      background: rgba(6, 10, 24, 0.78);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 44px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.12) inset;
      z-index: 20;
    }

    .tabs.admin-enabled { grid-template-columns: repeat(6, minmax(0, 1fr)); }

    .tab {
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      color: rgba(210, 222, 246, 0.8);
      background: rgba(255,255,255,0.03);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .tab.active {
      color: white;
      background: linear-gradient(180deg, rgba(125,183,255,0.34), rgba(73,109,198,0.24));
      box-shadow:
        0 10px 16px rgba(6,13,34,0.42),
        0 0 0 1px rgba(182, 213, 255, 0.35) inset,
        0 1px 0 rgba(255,255,255,0.2) inset;
    }

    .tab-emoji { font-size: 17px; line-height: 1; }
    .tab-emoji-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .tab-unseen-dot {
      position: absolute;
      top: -4px;
      right: -6px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #ff4d6d;
      box-shadow: 0 0 0 2px rgba(6, 10, 24, 0.92);
    }
    .tabs[data-skin="neon"] .tab.active { box-shadow: 0 0 0 1px rgba(125,210,255,.65) inset, 0 0 18px rgba(96,190,255,.55); }
    .tabs[data-skin="neon"] .tab.active::after { content:""; position:absolute; inset:-3px; border-radius:16px; border:1px solid rgba(117,226,255,.65); }
    .tabs[data-skin="thumbs"] .tab.active::after { content:"👍"; position:absolute; top:-10px; right:6px; font-size:12px; }
    .tabs[data-skin="gold"] .tab.active { box-shadow:0 0 0 1px rgba(255,211,122,.9) inset,0 8px 20px rgba(165,118,36,.45); }
    .tabs[data-skin="plasma"] .tab.active::after { content:""; position:absolute; inset:-2px; border-radius:15px; background:linear-gradient(120deg, rgba(96,163,255,.2), rgba(249,112,255,.2)); z-index:-1; filter:blur(1px);}
    .tabs[data-skin="frost"] .tab.active { box-shadow:0 0 0 1px rgba(172,236,255,.7) inset,0 0 16px rgba(141,218,255,.4);}
    .tabs[data-skin="minimal"] .tab.active { background:rgba(255,255,255,.08); box-shadow: inset 0 -2px 0 var(--accent);}
    .tabs[data-skin="glitch"] .tab.active { text-shadow: 1px 0 rgba(255,80,80,.5), -1px 0 rgba(80,220,255,.5); box-shadow:0 0 0 1px rgba(121,200,255,.35) inset, 2px 0 10px rgba(255,88,122,.2), -2px 0 10px rgba(88,195,255,.2);}
    .tabs[data-skin="glass"] { background: rgba(16,24,38,.58); border-color: rgba(198,224,255,.34); backdrop-filter: blur(18px); }
    .tabs[data-skin="glass"] .tab.active { background: rgba(168,212,255,.2); box-shadow: 0 0 0 1px rgba(194,229,255,.55) inset; }
    .tabs[data-skin="mono"] .tab { background: rgba(255,255,255,.015); color: rgba(221,226,233,.78); }
    .tabs[data-skin="mono"] .tab.active { background: rgba(255,255,255,.06); box-shadow: inset 0 -2px 0 #e1e5ec; color: #fff; }
    .tabs[data-skin="pulse2"] .tab.active { box-shadow: 0 0 0 1px rgba(255,170,200,.55) inset, 0 0 18px rgba(255,126,184,.28); animation: pulse2Active 1.4s ease-in-out infinite; }
    @keyframes pulse2Active { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } 100% { transform: translateY(0); } }
    .tab { position: relative; }
    .topbar-title-row { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; width:100%; text-align:center; }
    .badge-pill { font-size:11px; padding:5px 10px; border-radius:999px; border:1px solid rgba(130,167,255,.55); background:linear-gradient(170deg, rgba(125,183,255,0.26), rgba(73,109,198,0.16)); box-shadow: 0 1px 0 rgba(255,255,255,.2) inset; white-space:nowrap; }
    .ach-grid{display:grid;gap:8px;margin-top:8px;}
    .ach-item{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px;background:rgba(255,255,255,.05);}
    .ach-item.locked{opacity:.72;}
    .ach-category { margin-top: 10px; }
    .ach-category-title { font-size: 13px; color: var(--muted); margin: 8px 0 6px; text-transform: uppercase; letter-spacing: .02em; }
    .new-pill { margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: rgba(255,77,109,.18); border:1px solid rgba(255,77,109,.5); color:#ffd7df; font-size:11px; font-weight:800; display:inline-flex; align-items:center; max-width:100%; }
    .cos-meta { margin-top:6px; font-size:12px; color: var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .unlock-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(6, 10, 24, 0.35);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 12px calc(12px + env(safe-area-inset-bottom));
    }
    .unlock-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.2);
      background: linear-gradient(180deg, rgba(36,56,112,.95), rgba(21,30,56,.96));
      box-shadow: 0 26px 40px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.2) inset;
      animation: unlockSheetIn .22s ease-out;
      overflow: hidden;
    }
    .unlock-card.sparkle::after {
      content: "";
      position: absolute;
      inset: -40% -10%;
      background: linear-gradient(120deg, transparent 10%, rgba(255,255,255,.2) 50%, transparent 90%);
      transform: translateX(-120%) rotate(8deg);
      animation: unlockSparkle 1s ease-out;
      pointer-events: none;
    }
    .unlock-title { font-size: 17px; font-weight: 800; margin: 0 0 10px; }
    .unlock-list { display: grid; gap: 8px; max-height: 32vh; overflow: auto; padding-right: 2px; }
    .unlock-item { border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 10px; background: rgba(255,255,255,.05); }
    .unlock-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .unlock-rewards { margin-top: 10px; border-top: 1px dashed rgba(255,255,255,.2); padding-top: 8px; }
    .unlock-actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px; }
    @keyframes unlockSparkle {
      0% { transform: translateX(-120%) rotate(8deg); opacity: 0; }
      20% { opacity: .95; }
      100% { transform: translateX(120%) rotate(8deg); opacity: 0; }
    }
    @keyframes unlockSheetIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .slot-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top: 8px; }
    .chip { border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
    .chip.green { background: rgba(72,216,141,0.2); color: #bbffd9; }
    .ach-progress { margin-top: 8px; }
    .ach-progress .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
    .ach-progress .bar > i { display:block; height:100%; background: linear-gradient(90deg, #82a7ff, #49d88d); }
    .level-mini { margin-bottom: 10px; }
    .level-mini .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 8px; }
    .level-mini .bar > i { display:block; height:100%; background: linear-gradient(90deg, #8fb0ff, #66e0a6); }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.14) inset;
    }

    .seg-btn {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      min-width: 84px;
    }

    .seg-btn.active {
      color: #fff;
      background: linear-gradient(180deg, rgba(125,183,255,0.32), rgba(73,109,198,0.22));
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 14px rgba(7,15,38,0.42);
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255,255,255,0.14);
      text-align: left;
      padding: 10px;
      border-radius: 13px;
      margin-top: 8px;
      background: rgba(255,255,255,0.05);
      color: inherit;
      overflow: hidden;
    }

    .item-row > span,
    .item-row > strong {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .catalog-toolbar,
    .catalog-row,
    .catalog-list,
    .catalog-meta,
    .catalog-active-filters,
    .catalog-item-head {
      min-width: 0;
    }

    .catalog-toolbar { display: grid; gap: 8px; }
    .catalog-row { display: flex; align-items: center; gap: 8px; }
    .catalog-row > * { min-width: 0; }
    .catalog-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .catalog-active-filters { display:flex; flex-wrap:wrap; gap:8px; }
    .catalog-list { display:grid; gap:10px; }
    .catalog-status { text-align:center; font-size:12px; color: var(--muted); padding: 6px 0; }
    .catalog-skeleton { height: 72px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: linear-gradient(110deg, rgba(255,255,255,0.05) 8%, rgba(255,255,255,0.12) 18%, rgba(255,255,255,0.05) 33%); background-size: 180% 100%; animation: shimmer 1.4s linear infinite; }
    .ready-stack-list { display:grid; gap:10px; margin-top:10px; }
    .ready-stack-item { border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:12px; background: rgba(255,255,255,0.04); display:grid; gap:8px; }
    .ready-stack-item-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .ready-stack-meta { font-size:12px; color: var(--muted); }
    .ready-stack-items { display:grid; gap:6px; margin-top:4px; }
    .ready-stack-subitem { border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px; background: rgba(255,255,255,.03); text-align:left; color:inherit; }
    .ready-stack-subitem-title { font-weight:700; font-size:13px; }
    .ready-stack-subitem-meta { margin-top:4px; font-size:12px; color: var(--muted); }
    .supp-name {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.35;
    }
    .catalog-quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:8px; margin-top: 8px; }
    @media (min-width: 860px) {
      .catalog-quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .catalog-quick-card {
      display:flex;
      align-items:center;
      gap:8px;
      width:100%;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.05);
      color: inherit;
      padding: 8px 10px;
      text-align:left;
    }
    .catalog-quick-card.active {
      border-color: rgba(129,185,255,0.7);
      box-shadow: 0 0 0 1px rgba(129,185,255,0.35) inset, 0 8px 20px rgba(44,84,166,0.28);
    }
    .catalog-quick-icon {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      background: rgba(125,183,255,0.14);
      color: rgba(157,203,255,0.95);
      flex: 0 0 30px;
    }
    .catalog-quick-icon svg { width: 18px; height: 18px; display:block; color: inherit; fill: currentColor; stroke: currentColor; }


    .input, .select, .textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      background: rgba(15, 24, 54, 0.7);
      color: var(--text);
      padding: 10px 12px;
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.12) inset;
    }
    .select option { background: #ffffff; color: #1c2236; }
    .textarea { min-height: 88px; resize: vertical; }
    .input::placeholder, .textarea::placeholder, .search-input::placeholder { color: rgba(224, 232, 246, 0.72); }

    .btn, .chip, .card, .tab, .input, .select, .textarea, .search-input {
      transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .search-input {
      width: 100%;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 999px;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 10px 22px rgba(0,0,0,0.25), 0 1px 0 rgba(255,255,255,0.14) inset;
    }

    .search-input:focus,
    .input:focus,
    .select:focus,
    .textarea:focus {
      outline: none;
      border-color: rgba(125,183,255,0.75);

  function parseHexColor(input) {
    const value = String(input || "").trim();
    const hex = value.startsWith("#") ? value.slice(1) : value;
    if (!/^[\da-fA-F]{3}$|^[\da-fA-F]{6}$/.test(hex)) return null;
    const normalized = hex.length === 3
      ? hex.split("").map((ch) => ch + ch).join("")
      : hex;
    return {
      r: parseInt(normalized.slice(0, 2), 16),
      g: parseInt(normalized.slice(2, 4), 16),
      b: parseInt(normalized.slice(4, 6), 16),
    };
  }

  function relativeLuminance({ r, g, b }) {
    const toLinear = (v) => {
      const srgb = v / 255;
      return srgb <= 0.03928 ? srgb / 12.92 : Math.pow((srgb + 0.055) / 1.055, 2.4);
    };
    const lr = toLinear(r);
    const lg = toLinear(g);
    const lb = toLinear(b);
    return 0.2126 * lr + 0.7152 * lg + 0.0722 * lb;
  }

  function pickAppTextColor(themeTextColor) {
    const fallback = "#eef2ff";
    const parsed = parseHexColor(themeTextColor);
    if (!parsed) return fallback;
    const luminance = relativeLuminance(parsed);
    // The app surface is intentionally dark; reject dark Telegram text colors
    // (typical in light Telegram themes) to preserve readability.
    return luminance < 0.42 ? fallback : themeTextColor;
  }

    return "/";

  function projectUrl(rel) {
    const cleanRel = String(rel || "").replace(/^\/+/, "");
    return currentProjectBasePath() + cleanRel;
  }

  function normalizeApiPath(path) {
    const raw = String(path || "").trim();
    if (!raw) return projectUrl("");
    if (/^https?:\/\//i.test(raw)) return raw;
    let clean = raw.replace(/^\.\/+/, "");
    clean = clean.replace(/^\/+/, "");
    if (clean.startsWith("api/")) return projectUrl(clean);
    if (clean.startsWith("assets/")) return projectUrl(clean);
    if (clean === "") return projectUrl("");
    return projectUrl(clean);
  }

  function formatUtcShort(iso) {
    const value = String(iso || "").trim();
    if (!value) return "";
    const d = new Date(value.replace(" ", "T").replace("Z", "") + (value.endsWith("Z") ? "" : ""));
    if (Number.isNaN(d.getTime())) return value;
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

  function getUnlockPatchFromItems(items) {
    const details = Array.isArray(items) ? items : [];
    if (!details.length) return null;
    const byKey = new Map((state.ach?.achievements || []).map((a) => [String(a.key || ""), a]));
    const patch = {};
    for (const detail of details) {
      const ach = byKey.get(String(detail?.key || ""));
      const unlock = ach?.reward?.unlock || {};
      const theme = (unlock.themes || []).slice(-1)[0];
      const tabSkin = (unlock.tab_skins || []).slice(-1)[0];
      const badge = (unlock.badges || []).slice(-1)[0];
      if (theme) patch.theme_id = theme;
      if (tabSkin) patch.tab_skin_id = tabSkin;
      if (badge) patch.badge_id = badge;
    }
    return Object.keys(patch).length ? patch : null;

      const res = await api("./api/cosmetics/set", { method: "POST", body: patch });

  async function api(path, { method = "GET", body } = {}) {
    const doFetch = async () => fetch(normalizeApiPath(path), {
      method,
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": state.initData
      },
      body: body ? JSON.stringify(body) : undefined
    });
    let res = await doFetch();
    if (res.status === 401 && refreshInitDataFromTelegram()) {
      res = await doFetch();
    }

    if (res.status === 401) {
      showToast("Открой WebApp внутри Telegram");
      throw new Error("UNAUTHORIZED");
    }

    if (res.status === 402) {
      state.me = { ...(state.me || {}), premium: false, starter_trial_active: false, webapp_access: false };
      renderPaywall();
      throw new Error("PREMIUM_REQUIRED");
    }

    if (res.status === 403) {
      const data403 = await res.json().catch(() => ({}));
      if (data403?.code === "ADMIN_REQUIRED" || data403?.code === "PERMISSION_DENIED") throw new Error("PERMISSION_DENIED");
      if (data403?.code === "BANNED") {
        showBannedScreen(data403?.reason || "");
        throw new Error("BANNED");
      }
      throw new Error("FORBIDDEN");
    }

    const data = await res.json().catch(() => ({}));
    const detail = (data && typeof data.detail === 'object' && data.detail !== null) ? data.detail : null;
    const errPayload = detail || data;
    if (!res.ok || data.ok === false || (detail && detail.ok === false)) {
      const err = new Error(errPayload?.message || errPayload?.error || errPayload?.code || data?.message || data?.error || data?.code || `HTTP_${res.status}`);
      err.httpStatus = res.status;
      if (errPayload && typeof errPayload === 'object') {
        if (errPayload.code) err.code = String(errPayload.code);
        if (errPayload.message) err.serverMessage = String(errPayload.message);
        if (errPayload.stage) err.stage = String(errPayload.stage);
        if (errPayload.message_ru) err.messageRu = String(errPayload.message_ru);
        if (errPayload.action_ru) err.actionRu = String(errPayload.action_ru);
      }
      throw err;
    }
    return data;
  }

      },

    }
    if (res.status === 401) {
      showToast("Открой WebApp внутри Telegram");
      throw new Error("UNAUTHORIZED");
    }
    if (res.status === 402) {
      showToast("Требуется Premium");
      throw new Error("PREMIUM_REQUIRED");
    }
    if (res.status === 403) {
      const data403 = await res.json().catch(() => ({}));
      if (data403?.code === "ADMIN_REQUIRED" || data403?.code === "PERMISSION_DENIED") throw new Error("PERMISSION_DENIED");
      throw new Error("FORBIDDEN");
    }
    const data = await res.json().catch(() => ({}));

    }
    return data;
  }

  function findGuideTarget(step) {
    const selectors = String(step.selector || "").split(',').map((x) => x.trim()).filter(Boolean);
    for (const selector of selectors) {
      const el = document.querySelector(selector);
      if (el) return el;
    }
    return null;
  }

  function clamp(val, min, max) {
    return Math.min(max, Math.max(min, val));
  }

  function updateGuideLayout() {
    const g = state.guide;
    if (!g.active || !g.steps?.length) return;
    const step = g.steps[g.step];
    if (!step) return;
    const target = findGuideTarget(step);
    if (!target) return;
    const r = target.getBoundingClientRect();
    const pad = 8;
    const rect = {
      top: clamp(r.top - pad, 8, window.innerHeight - 52),
      left: clamp(r.left - pad, 8, window.innerWidth - 52),
      width: clamp(r.width + pad * 2, 44, window.innerWidth - 16),
      height: clamp(r.height + pad * 2, 36, window.innerHeight - 16)
    };
    const cardW = Math.min(360, window.innerWidth - 24);
    const preferBottom = rect.top < window.innerHeight * 0.56;
    const cardTop = preferBottom
      ? clamp(rect.top + rect.height + 18, 8, window.innerHeight - 190)
      : clamp(rect.top - 158, 8, window.innerHeight - 190);
    const cardLeft = clamp(rect.left + rect.width / 2 - cardW / 2, 8, window.innerWidth - cardW - 8);
    const fromX = rect.left + rect.width / 2;
    const fromY = preferBottom ? rect.top + rect.height : rect.top;
    const toX = cardLeft + cardW / 2;
    const toY = preferBottom ? cardTop : cardTop + 120;
    const dx = toX - fromX;
    const dy = toY - fromY;
    g.rect = rect;
    g.card = { top: cardTop, left: cardLeft, width: cardW };
    g.arrow = { left: fromX, top: fromY, width: Math.hypot(dx, dy), angle: Math.atan2(dy, dx) * 180 / Math.PI };
  }

  function renderGuideOverlay() {
    const g = state.guide;
    if (!g.active || !g.steps?.length) return "";
    const step = g.steps[g.step];
    if (!step) {
      state.guide = { active: null, step: 0, steps: [], rect: null, card: null, arrow: null };
      return "";
    }
    const target = findGuideTarget(step);
    if (!target) {
      // Пользователь мог быстро переключить экран: держим прогресс, но временно не рисуем оверлей,
      // чтобы шаг не "съедался" из-за отсутствия DOM-элемента.
      return "";
    }
    updateGuideLayout();
    if (!g.rect || !g.card || !g.arrow) return "";
    const total = g.steps.length;
    const isLast = g.step >= total - 1;
    const topH = Math.max(0, g.rect.top);
    const leftW = Math.max(0, g.rect.left);
    const rightX = g.rect.left + g.rect.width;
    const rightW = Math.max(0, window.innerWidth - rightX);
    const bottomY = g.rect.top + g.rect.height;
    const bottomH = Math.max(0, window.innerHeight - bottomY);
    return `<div class="coach-overlay" data-guide-overlay>
      <div class="coach-dim-part" style="top:0;left:0;width:100%;height:${topH}px;"></div>
      <div class="coach-dim-part" style="top:${g.rect.top}px;left:0;width:${leftW}px;height:${g.rect.height}px;"></div>
      <div class="coach-dim-part" style="top:${g.rect.top}px;left:${rightX}px;width:${rightW}px;height:${g.rect.height}px;"></div>
      <div class="coach-dim-part" style="top:${bottomY}px;left:0;width:100%;height:${bottomH}px;"></div>
      <div class="coach-highlight" style="top:${g.rect.top}px;left:${g.rect.left}px;width:${g.rect.width}px;height:${g.rect.height}px;"></div>
      <div class="coach-arrow" style="left:${g.arrow.left}px;top:${g.arrow.top}px;width:${g.arrow.width}px;transform:rotate(${g.arrow.angle}deg);"></div>
      <section class="coach-card" style="top:${g.card.top}px;left:${g.card.left}px;width:${g.card.width}px;">
        <div class="coach-card-head">
          <h4>${esc(step.title || "Подсказка")}</h4>
          <button class="btn secondary coach-skip-top" data-guide-skip>Пропустить</button>
        </div>
        <div class="muted">${esc(step.text || "")}</div>
        <div class="coach-actions">
          <div class="coach-actions-left">
            ${g.step > 0 ? '<button class="btn secondary" data-guide-prev>Назад</button>' : '<span class="coach-actions-spacer" aria-hidden="true"></span>'}
          </div>
          <span class="coach-step">${g.step + 1}/${total}</span>
          <div class="coach-actions-right">
            <button class="btn" data-guide-next>${isLast ? 'Завершить' : 'Дальше'}</button>
          </div>
        </div>
      </section>
    </div>`;
  }

  function availableGuideSteps(name) {
    const steps = Array.isArray(GUIDE_TEXT[name]) ? GUIDE_TEXT[name] : [];
    return steps.filter((step) => !!findGuideTarget(step));
  }

  function maybeStartGuide(name) {
    if (state.guide.active || hasSeenGuide(name)) return;
    const steps = availableGuideSteps(name);
    if (!steps.length) return;
    startGuide(name, steps);
  }

  function bindGuideEvents() {
    document.querySelector('[data-guide-skip]')?.addEventListener('click', () => { haptic(); closeGuide(); });
    document.querySelector('[data-guide-prev]')?.addEventListener('click', () => {

    document.querySelector('[data-guide-next]')?.addEventListener('click', () => {

      if (state.guide.step >= total - 1) {

        return;
      }
      state.guide.step += 1;
      renderMainApp();
    });
  }

    const prev = btnEl?.textContent || "";
    if (btnEl) {
      btnEl.disabled = true;
      btnEl.textContent = "Подготавливаю...";
    }
    try {
      const data = await api("api/payments/redirect/create", {
        method: "POST",
        body: { kind: "subscription", plan_id: planId }
      });
      savePendingPayment(data);
      state.payment.pending = loadPendingPayment();
      showToast("Платёж подготовлен");
      renderPaymentScreen(planId);
    } catch (e) {
      if (e?.code === 'RECEIPT_EMAIL_REQUIRED') {
        state.payment.emailError = 'Чтобы получить чек на почту, сначала укажите email.';
        showToast('Добавьте email для чека');
        renderPaymentScreen(planId);
      } else {
        showToast("Не удалось подготовить платёж");
      }
    } finally {
      if (btnEl) {
        btnEl.disabled = false;
        btnEl.textContent = prev;
      }
    }
  }

  async function checkPendingPaymentStatus(options = {}) {
    if (state.payment.checking) return;
    const pending = loadPendingPayment();
    if (!pending) return;
    if (!isPendingForCurrentProject()) return;
    state.payment.pending = pending;
    state.payment.checking = true;
    try {
      const res = await api(`api/payments/yookassa/status?payment_id=${encodeURIComponent(pending.payment_id)}`);
      state.payment.lastStatus = String(res.status || "");
      if (res.status === "succeeded") {
        clearPendingPayment();
        state.payment.success = true;
        state.me = await api("api/me");
        state.payment.successInfo = {
          plan_id: res.plan_id || pending.plan_id || "Premium",
          premium_until_utc: res.premium_until_utc || state.me?.premium_until_utc || ""
        };
        state.activeTab = "today";
        showToast("Оплата подтверждена");
        if (state.me.webapp_access) {
          renderMainApp();
          await loadToday();
        } else if (parseScreenParams().screen === "payment") {
          renderPaymentScreen(res.plan_id || pending.plan_id);
        }
      } else if (res.status === "canceled") {
        clearPendingPayment();
        showToast("Платёж отменён");
      } else if (!options.silent) {
        showToast("Платёж ещё обрабатывается");
      }
    } catch (e) {
      if (!options.silent) showToast("Не удалось проверить статус");
    } finally {
      state.payment.checking = false;
    }
  }

  function escSelector(value) {
    const raw = String(value ?? "");
    if (window.CSS?.escape) return window.CSS.escape(raw);
    return raw.replace(/["\\]/g, "\\$&");
  }

  function getFocusableSnapshot(root) {
    const active = document.activeElement;
    if (!active || !root?.contains(active)) return null;
    const tag = String(active.tagName || "").toLowerCase();
    if (!["input", "textarea", "select"].includes(tag) && !active.isContentEditable) return null;

    let selector = "";
    if (active.id) {
      selector = `#${escSelector(active.id)}`;
    } else {
      const preferredDataAttrs = [
        "data-profile-field",
        "data-profile-lines",
        "data-assistant-field",
        "data-assistant-lab",
        "data-lab-field",
        "data-admin-field",
        "data-idx",
        "name"
      ];
      const parts = [];
      preferredDataAttrs.forEach((attr) => {
        if (active.hasAttribute(attr)) {
          parts.push(`[${attr}="${escSelector(active.getAttribute(attr) || "")}"]`);
        }
      });
      if (!parts.length) {
        for (const attr of active.attributes) {
          if (String(attr.name || "").startsWith("data-")) {
            parts.push(`[${attr.name}="${escSelector(attr.value || "")}"]`);
            break;
          }
        }
      }
      if (parts.length) selector = `${tag}${parts.join("")}`;
    }
    if (!selector) return null;

    const snapshot = { selector, tag };
    if (typeof active.selectionStart === "number" && typeof active.selectionEnd === "number") {
      snapshot.selectionStart = active.selectionStart;
      snapshot.selectionEnd = active.selectionEnd;
    }
    return snapshot;
  }

  function restoreFocusableSnapshot(root, snapshot) {
    if (!root || !snapshot?.selector) return;
    const candidate = root.querySelector(snapshot.selector);
    if (!candidate) return;
    try {
      candidate.focus({ preventScroll: true });
    } catch {
      candidate.focus();
    }
    if (typeof snapshot.selectionStart === "number" && typeof snapshot.selectionEnd === "number" && typeof candidate.setSelectionRange === "function") {
      candidate.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd);
    }
  }

    const tabKey = String(state.activeTab || "");

    const previousTabKey = lastRenderedTabKey;
    if (previousTabKey === tabKey && lastRenderedTabHtml === nextHtml) return;
    const focusSnapshot = getFocusableSnapshot(target);
    target.innerHTML = nextHtml;
    lastRenderedTabKey = tabKey;
    lastRenderedTabHtml = nextHtml;
    target.scrollTop = previousTabKey === tabKey ? prevScrollTop : 0;
    restoreFocusableSnapshot(target, focusSnapshot);
    if (typeof binder === "function") binder();

      return `<div class="card fade survey-card"><button class="btn secondary survey-help-btn survey-help-corner" type="button" data-survey-help>?</button><div class="row survey-head"><div class="survey-title-wrap"><h3 style="margin:0">Рекомендации</h3></div><div class="survey-target-wrap"><span class="muted" style="font-size:12px">Рекомендация на:</span><div class="segmented" data-survey-target><button class="seg-btn ${sv.target==='today'?'active':''}" data-set-target="today">Сегодня</button><button class="seg-btn ${sv.target==='tomorrow'?'active':''}" data-set-target="tomorrow">Завтра</button></div></div></div>${sv.helpOpen ? surveyHelpHtml : ''}${rows || '<div class="muted">Нет рекомендаций</div>'}<div style="margin-top:10px"><button class="btn" id="applyAll" style="width:100%; font-weight:800" ${sv.applying ? 'disabled' : ''}>✅ Применить всё</button></div><div class="survey-actions"><button class="btn secondary" id="applySelected" ${sv.applying ? 'disabled' : ''}>Применить выбранное</button><button class="btn secondary" id="cancelSurvey" ${sv.applying ? 'disabled' : ''}>Отмена</button></div></div>`;
    }
    const step = SURVEY_STEPS[sv.step];
    const p = Math.round(((sv.step+1)/SURVEY_STEPS.length)*100);
    let body = '';
    if (step.options) {
      body = step.options.map(([v,t]) => `<button class="survey-option ${sv.answers[step.key]===v?'active':''}" data-survey-pick="${step.key}:${v}">${t}</button>`).join('');
    } else if (step.goals) {
      body = `<div class="survey-goals">${step.goals.map((g)=>`<button class="chip ${sv.answers.goals.includes(g)?'green':''}" data-goal-toggle="${g}">${GOAL_LABELS_RU[g] || g}</button>`).join('')}</div>`;
    } else {
      body = `<textarea id="surveyNote" maxlength="280" class="survey-note" placeholder="Короткая заметка">${esc(sv.answers.note || '')}</textarea><div class="muted" style="margin-top:6px">${(sv.answers.note||'').length}/280</div>`;
    }
    return `<div class="card fade survey-card"><button class="btn secondary survey-help-btn survey-help-corner" type="button" data-survey-help>?</button><div class="row survey-head"><div class="survey-title-wrap"><strong>${step.title}</strong></div><div class="survey-target-wrap"><span class="muted" style="font-size:12px">Рекомендация на:</span><div class="segmented" data-survey-target><button class="seg-btn ${sv.target==='today'?'active':''}" data-set-target="today">Сегодня</button><button class="seg-btn ${sv.target==='tomorrow'?'active':''}" data-set-target="tomorrow">Завтра</button></div><span class="muted">${sv.step+1}/${SURVEY_STEPS.length}</span></div></div>${sv.helpOpen ? surveyHelpHtml : ''}<div class="progress"><i style="width:${p}%"></i></div>${body}<div class="survey-actions" style="margin-top:12px"><button class="btn secondary" id="surveyBack" ${sv.step===0?'disabled':''}>Назад</button><button class="btn" id="surveyNext">${sv.step===SURVEY_STEPS.length-1?'Получить рекомендации':'Далее'}</button></div></div>`;
  }

  function bindSurveyEvents() {
    appEl.querySelectorAll('[data-set-target]').forEach((el)=>el.addEventListener('click', async ()=>{
      const next = el.dataset.setTarget;
      if (next === state.survey.target) return;
      haptic();
      state.survey.target = next;
      localStorage.setItem(surveyTargetKey(), next);
      state.survey.loadedKey = '';
      await loadSurveyForTarget(true);
      renderActiveTab();
    }));

    appEl.querySelectorAll('[data-survey-pick]').forEach((el)=>el.addEventListener('click', ()=>{ haptic(); const [k,v]=el.dataset.surveyPick.split(':'); state.survey.answers[k]=v; localStorage.setItem(surveyStorageKey(), JSON.stringify(state.survey.answers)); renderActiveTab(); }));
    appEl.querySelectorAll('[data-goal-toggle]').forEach((el)=>el.addEventListener('click', ()=>{ haptic(); const g=el.dataset.goalToggle; const set=new Set(state.survey.answers.goals||[]); if (set.has(g)) set.delete(g); else set.add(g); state.survey.answers.goals=[...set]; localStorage.setItem(surveyStorageKey(), JSON.stringify(state.survey.answers)); renderActiveTab(); }));
    appEl.querySelectorAll('[data-survey-help]').forEach((el)=>el.addEventListener('click', ()=>{ state.survey.helpOpen = !state.survey.helpOpen; renderActiveTab(); }));
    document.getElementById('surveyNote')?.addEventListener('input', (e)=>{ state.survey.answers.note=String(e.target.value||'').slice(0,280); localStorage.setItem(surveyStorageKey(), JSON.stringify(state.survey.answers)); const noteLen = e.target.parentElement?.querySelector('.muted'); if (noteLen) noteLen.textContent = `${state.survey.answers.note.length}/280`; });
    document.getElementById('surveyBack')?.addEventListener('click', ()=>{ haptic(); state.survey.step=Math.max(0,state.survey.step-1); renderActiveTab(); });

    document.getElementById('surveyNext')?.addEventListener('click', async ()=>{
      haptic();
      if (state.survey.step < SURVEY_STEPS.length-1) {
        state.survey.step += 1;
        renderActiveTab();
        return;
      }
      state.survey.loading=true;
      renderActiveTab();
      try {
        const res=await api('./api/checkin',{method:'POST', body:{answers: state.survey.answers, target_day: state.survey.target, client_local_iso: new Date().toISOString()}});
        state.survey.loading=false;
        state.survey.checkinId=res.checkin_id;
        state.survey.recommendations=res.recommendations||[];
        state.survey.selected=Object.fromEntries((state.survey.recommendations||[]).map((x)=>[x.supplement_id,true]));
        state.survey.view='review';
        renderActiveTab();
      } catch(e){
        state.survey.loading=false;
        showToast('AI временно недоступен, попробуйте ещё раз');
        renderActiveTab();
      }
    });

    appEl.querySelectorAll('[data-rec-toggle]').forEach((el)=>el.addEventListener('change',(e)=>{ state.survey.selected[Number(el.dataset.recToggle)] = !!e.target.checked; }));

    document.getElementById('applyAll')?.addEventListener('click', async ()=>{
      haptic();
      state.survey.applying = true;
      renderActiveTab();
      try {
        const out = await api('./api/checkin/apply',{method:'POST', body:{checkin_id: state.survey.checkinId, selected_ids:[], mode:'all'}});
        if (out.date_local === localDateISO()) showToast('✅ Применено к плану: сегодня');
        else showToast('✅ Применено на завтра');
        if (out.date_local === localDateISO()) {
          await loadToday(true);
          state.activeTab='today';
          renderActiveTab();
        } else {
          await loadSurveyForTarget(true);
          renderActiveTab();
        }
        await showUnlockToastFromPayload(out);
      } catch {
        showToast('Не удалось применить рекомендации');
      } finally {
        state.survey.applying = false;
      }
    });

    document.getElementById('applySelected')?.addEventListener('click', async ()=>{
      haptic();
      state.survey.applying = true;
      const ids=Object.keys(state.survey.selected).filter((k)=>state.survey.selected[k]).map(Number);
      try {
        const out = await api('./api/checkin/apply',{method:'POST', body:{checkin_id: state.survey.checkinId, selected_ids:ids, mode:'selected'}});
        if (out.date_local === localDateISO()) showToast('✅ Применено к плану: сегодня');
        else showToast('✅ Применено на завтра');
        if (out.date_local === localDateISO()) {
          await loadToday(true);
          state.activeTab='today';
          renderActiveTab();
        } else {
          await loadSurveyForTarget(true);
          renderActiveTab();
        }
        await showUnlockToastFromPayload(out);
      } catch {
        showToast('Не удалось применить выбранные');
      } finally {
        state.survey.applying = false;
      }
    });

    document.getElementById('cancelSurvey')?.addEventListener('click', ()=>{ haptic(); state.survey.view='wizard'; renderActiveTab(); });
  }


  function renderCatalog() {
    const c = state.catalog;
    const filters = c.filters;
    const sortLabels = { alpha: 'По алфавиту', evidence: 'По доказательности', trials: 'По исследованиям', effect: 'По эффекту' };
    const skeletons = Array.from({ length: 8 }, () => '<div class="catalog-skeleton"></div>').join('');
    const activeFilterChips = [
      ...filters.evidence.map((v) => ({ key: 'evidence', value: v, label: `Доказательность: ${v}` })),
      ...filters.targets.map((v) => ({ key: 'targets', value: v, label: `Куда/зачем: ${TARGET_LABELS_RU[v] || v}` })),
      ...filters.burdens.map((v) => ({ key: 'burdens', value: v, label: `Нагрузка: ${BURDEN_LABELS_RU[v] || v}` }))
    ];
    const itemsHtml = c.items.map((item) => `
      <button type="button" class="card item-row" data-catalog-open="${item.slug}" style="display:block; width:100%; margin-top:0;">
        <div class="row catalog-item-head"><strong class="supp-name">${esc(item.name_ru || item.name_en)}</strong><span>${item.has_purchase ? '🛒' : ''}</span></div>
        <div class="muted" style="margin-top:6px">${esc(evidenceUserLabel(item.evidence_grade))} • ${esc(confidenceUserLabel(item.confidence))} ${item.in_stack ? '• ✅ добавлено' : ''}</div>
      </button>`).join('');

    const listHtml = c.loading && !c.items.length
      ? skeletons
      : (itemsHtml || (!c.error ? '<div class="card">Ничего не найдено.</div>' : ''));
    const readyStacks = Array.isArray(c.readyStacks) ? c.readyStacks : [];
    const readyStacksHtml = c.stacksLoading
      ? '<div class="catalog-skeleton" style="height:120px"></div>'
      : (readyStacks.length
        ? `<div class="ready-stack-list">${readyStacks.map((stack) => {
          const items = Array.isArray(stack.items) ? stack.items : [];
          const tags = Array.isArray(stack.tags) ? stack.tags.filter(Boolean).slice(0, 4) : [];
          return `<div class="ready-stack-item">
            <div class="ready-stack-item-head">
              <div>
                <div style="font-weight:700">${esc(stack.title_ru || 'Готовый стек')}</div>
                <div class="ready-stack-meta">${esc(stack.author_ru || 'Без автора')} • позиций: ${Number(stack.items_total || items.length || 0)}</div>
              </div>
              <button class="btn" type="button" data-ready-stack-add="${esc(stack.slug || '')}" ${stack.has_any_new ? '' : 'disabled'}>${stack.has_any_new ? 'Добавить весь стек' : 'Уже добавлено'}</button>
            </div>
            ${stack.description_ru ? `<div class="muted">${esc(stack.description_ru)}</div>` : ''}
            ${tags.length ? `<div>${tags.map((tag) => `<span class="chip">${esc(tag)}</span>`).join(' ')}</div>` : ''}
            <div class="ready-stack-meta">Новых: ${Number(stack.addable_count || 0)} • Уже есть: ${Number(stack.already_in_stack_count || 0)} • Не найдено: ${Number(stack.missing_count || 0)}</div>
            <div class="ready-stack-items">
              ${items.map((item) => {
                const canOpen = !!String(item.resolved_slug || '').trim();
                const note = item.not_found ? '⚠️ Не найдено в каталоге' : (item.already_in_stack ? '✅ Уже в ваших БАДах' : '🆕 Добавится');
                return `<button type="button" class="ready-stack-subitem" ${canOpen ? `data-ready-item-open="${esc(item.resolved_slug)}"` : 'disabled'} title="${canOpen ? 'Открыть карточку' : 'Нет карточки в каталоге'}">
                  <div class="ready-stack-subitem-title">${esc(item.supplement_name || item.supplement_slug || 'Без названия')}</div>
                  <div class="ready-stack-subitem-meta">${esc(item.dose_ru || 'Доза не указана')} • ${esc(item.timing_ru || 'Время не указано')}</div>
                  <div class="ready-stack-subitem-meta">${esc(note)}${item.notes_ru ? ` • ${esc(item.notes_ru)}` : ''}</div>
                </button>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}</div>`
        : '<div class="card"><div class="muted">Пока нет готовых стеков.</div></div>');

    const pickForComplexId = Number(c.pickForComplexId || 0);
    const pickComplex = (state.complexes || []).find((x) => Number(x.id || 0) === pickForComplexId);
    return `
      ${pickForComplexId ? `<div class="card fade"><div class="row mode-banner"><div><strong>Режим: добавить БАД в комплекс</strong><div class="muted" style="margin-top:4px">Комплекс: ${esc(pickComplex?.name || `#${pickForComplexId}`)}. Нажмите на БАД в списке — он добавится сразу.</div></div><button class="btn secondary" type="button" data-catalog-cancel-complex-pick>Отмена</button></div></div>` : ''}
      ${c.pickForBodymapSystem ? `<div class="card fade"><div class="row mode-banner"><div><strong>Режим: добавить для органа</strong><div class="muted" style="margin-top:4px">Фильтр по системе: ${esc(SYSTEM_LABELS[c.pickForBodymapSystem] || c.pickForBodymapSystem)}. Нажмите на БАД — он сразу добавится в стек, а карта обновится.</div></div><button class="btn secondary" type="button" data-catalog-cancel-bodymap-pick>Отмена</button></div></div>` : ''}
      <div class="card fade catalog-toolbar">
        <div class="catalog-row">
          <input id="catalogSearch" class="search-input" placeholder="Поиск RU/EN..." value="${esc(c.q)}" ${c.focusSearchOnOpen ? "autofocus" : ""}/>
          <button class="btn" id="catalogFilters">Фильтры</button>
        </div>
        <div class="catalog-quick-grid">
          ${CATALOG_QUICK_CATEGORIES.map((cat)=>`<button class="catalog-quick-card ${filters.targets.includes(cat.token) ? 'active' : ''}" data-quick-target="${cat.token}"><span class="catalog-quick-icon" data-organ-icon="${cat.token}"></span><span>${esc(cat.label)}</span></button>`).join('')}
        </div>
        <div class="catalog-row">
          <button class="btn secondary" id="catalogReadyStacksToggle">${c.stacksOpen ? 'Скрыть готовые стеки' : 'Готовые стеки'}</button>
        </div>
        <div class="catalog-meta">
          <select id="catalogSortInline" class="select" style="max-width:220px;">
            <option value="alpha" ${filters.sort==='alpha'?'selected':''}>${sortLabels.alpha}</option>
            <option value="evidence" ${filters.sort==='evidence'?'selected':''}>${sortLabels.evidence}</option>
            <option value="trials" ${filters.sort==='trials'?'selected':''}>${sortLabels.trials}</option>
            <option value="effect" ${filters.sort==='effect'?'selected':''}>${sortLabels.effect}</option>
          </select>
          <span class="muted">Найдено: ${c.total}</span>
        </div>
        <div class="catalog-active-filters">
          ${activeFilterChips.length ? activeFilterChips.map((f)=>`<button class="chip" data-filter-remove="${f.key}:${f.value}">${esc(f.label)} ✕</button>`).join('') : '<span class="muted">Фильтры не выбраны</span>'}
        </div>
      </div>
      ${c.stacksOpen ? `<div class="card fade"><div class="row"><strong>Готовые стеки</strong><button class="btn secondary" type="button" id="catalogReadyStacksRefresh">Обновить</button></div>${readyStacksHtml}</div>` : ''}
      ${c.error ? '<div class="card"><div style="font-weight:700">Не удалось загрузить каталог</div><div style="margin-top:10px"><button class="btn" id="catalogRetry">Повторить</button></div></div>' : ''}
      <div class="catalog-list">${listHtml}</div>
      <div id="catalogSentinel" style="height:1px"></div>
      ${c.loadingMore ? '<div class="catalog-status">Загружаем ещё...</div>' : (!c.hasMore && c.items.length ? '<div class="catalog-status">Конец списка</div>' : '')}
      ${c.filtersOpen ? renderFilterSheet(filters) : ''}
      ${c.detail ? renderDetailModal(c.detail) : ''}
      ${renderAddToComplexModal()}
    `;
  }

  function renderAddToComplexModal() {
    const modal = state.catalog?.addToComplexModal || { open: false, creating: false };
    if (!modal.open) return '';
    const complexes = Array.isArray(state.complexes) ? state.complexes : [];
    const hasComplexes = complexes.length > 0;
    return `<div class="modal-overlay" data-add-complex-modal-close>
      <section class="card modal-card" onclick="event.stopPropagation()">
        <div class="row"><strong>Добавить в комплекс</strong><button class="btn secondary" type="button" data-add-complex-modal-close>Закрыть</button></div>
        ${!hasComplexes ? `<div class="muted" style="margin-top:8px">У вас пока нет комплексов. Создайте первый:</div>` : `<div class="muted" style="margin-top:8px">Выберите существующий комплекс:</div>`}
        ${hasComplexes ? `<div style="margin-top:10px; display:grid; gap:8px;">${complexes.map((c) => `<button class="btn secondary" type="button" data-complex-pick-existing="${Number(c.id || 0)}">${esc(c.name || `Комплекс #${c.id}`)}</button>`).join('')}</div>` : ''}
        ${hasComplexes ? `<div class="row" style="margin-top:10px"><button class="btn" type="button" data-complex-create-start>+ Добавить комплекс</button></div>` : ''}
        ${(!hasComplexes || modal.creating) ? `<div style="margin-top:10px; display:grid; gap:8px;">
          <input class="input" id="addComplexNameInput" maxlength="80" placeholder="Название нового комплекса"/>
          <button class="btn" type="button" data-complex-create-and-add>Создать и добавить</button>
        </div>` : ''}
      </section>
    </div>`;
  }

  function renderFilterSheet(filters) {
    const ev = ['A','B','C','D'];
    const tgts = ['brain','heart','gut','liver','kidney','sleep','mood','joints','muscle','skin','immune'];
    const br = ['liver','kidney','gut'];
    const chip=(v,arr,key,labels)=>`<button class="chip ${arr.includes(v)?'green':''}" data-filter-toggle="${key}:${v}">${labels?.[v] || v}</button>`;
    return `<div class="card" style="position:fixed;left:10px;right:10px;bottom:90px;z-index:30;max-height:60vh;overflow:auto">
      <div class="row"><strong>Фильтры</strong><button class="btn secondary" data-filter-close>Закрыть</button></div>
      <div style="margin-top:8px">Доказательность: ${ev.map(v=>chip(v,filters.evidence,'evidence')).join(' ')}</div>
      <div style="margin-top:8px">Куда/зачем: ${tgts.map(v=>chip(v,filters.targets,'targets',TARGET_LABELS_RU)).join(' ')}</div>
      <div style="margin-top:8px">Нагрузка: ${br.map(v=>chip(v,filters.burdens,'burdens',BURDEN_LABELS_RU)).join(' ')}</div>
      <div style="margin-top:8px"><select id="sortSelect" style="width:100%;padding:8px;border-radius:10px"><option value="alpha" ${filters.sort==='alpha'?'selected':''}>По алфавиту</option><option value="evidence" ${filters.sort==='evidence'?'selected':''}>По доказательности</option><option value="trials" ${filters.sort==='trials'?'selected':''}>По исследованиям</option><option value="effect" ${filters.sort==='effect'?'selected':''}>По эффекту</option></select></div>
      <div class="row" style="margin-top:10px"><button class="btn secondary" id="resetFilters">Сбросить</button></div>
    </div>`;
  }

  function detailParagraphs(text) {
    return String(text || '')
      .split(/\n{2,}/)
      .map((part) => part.trim())
      .filter(Boolean)
      .map((part) => `<p>${esc(part).replace(/\n/g, '<br/>')}</p>`)
      .join('');
  }

  function renderDetailModal(item) {
    const isLoading = !!item?._loading;
    const displayName = esc(item.name_ru || item.name_en || item.slug || 'Добавка');
    const summary = detailParagraphs(item.summary_verified || item.summary_theoretical || '');
    const sections = [
      { key: 'mechanisms', title: 'Механизмы', text: item.molecular_mechanisms || '' },
      { key: 'dose', title: 'Дозировка', text: item.dose_ru || '' },
      { key: 'timing', title: 'Тайминг', text: item.timing_ru || '' },
      { key: 'safety', title: 'Безопасность', text: item.safety_ru || '' },
    ];
    const available = sections.filter((s) => String(s.text || '').trim());
    const activeSection = state.catalog.detailSection;
    const sectionButtons = available.map((section) => `
      <button type="button" class="chip section-tab ${activeSection === section.key ? 'active' : ''}" data-detail-section="${section.key}" data-section-title="${esc(section.title)}" data-section-text="${esc(section.text || '')}">${section.title}</button>
    `).join('');
    const openedSection = available.find((s) => s.key === activeSection);
    return `<div class="catalog-modal-overlay" data-detail-close></div>
      <div class="catalog-modal-shell">
        <div class="card catalog-modal-head">
          <div class="row" style="align-items:flex-start; gap:8px; flex-wrap:nowrap">
            <strong class="modal-title">${displayName}</strong>
            <button type="button" class="btn secondary" data-detail-close>Закрыть</button>
          </div>
          <div class="muted" style="margin-top:6px">${isLoading ? 'Загружаем карточку…' : `${esc(evidenceUserLabel(item.evidence_grade))} • ${esc(confidenceUserLabel(item.confidence))}`}</div>
        </div>
        <div class="card catalog-modal-body">
          ${isLoading ? `<div class="catalog-skeleton" style="height:100px"></div><div class="catalog-skeleton" style="height:84px; margin-top:8px"></div><div class="catalog-skeleton" style="height:44px; margin-top:8px"></div>` : `
          <div class="modal-content">
            <div class="modal-summary">${summary || '<p class="muted">Описание скоро появится.</p>'}</div>
            ${available.length ? `<div class="section-tabs">${sectionButtons}</div>` : ''}
            <div id="catalogSectionContent">${openedSection ? `<div class="section-content">${detailParagraphs(openedSection.text)}</div>` : ''}</div>
            <div class="action-grid">
              ${item.in_stack
                ? '<button type="button" class="btn green" disabled>✅ Добавлено в стек</button><button type="button" class="btn secondary" data-stack-remove data-id="'+item.id+'">Убрать из стека</button>'
                : '<button type="button" class="btn" data-stack-add data-id="'+item.id+'">Добавить в мой стек</button>'}
              <button type="button" class="btn secondary" data-add-complex data-id="${item.id}">Добавить в комплекс</button>
              ${item.purchase_url ? '<button type="button" class="btn secondary" data-open-shop>Перейти в магазин</button>' : ''}
            </div>
          </div>`}
        </div>
      </div>`;
  }


  function defaultDetailSection(item) {
    const order = [
      ['mechanisms', item?.molecular_mechanisms],
      ['dose', item?.dose_ru],
      ['timing', item?.timing_ru],
      ['safety', item?.safety_ru],
    ];
    const found = order.find(([, text]) => String(text || '').trim());
    return found ? found[0] : null;
  }

  async function openSupplementDetail(slug, { silent = false } = {}) {
    const key = String(slug || '').trim();
    if (!key) return;
    state.catalog.detailCache = state.catalog.detailCache || {};
    const cached = state.catalog.detailCache[key];
    state.catalog.detail = cached || { slug: key, name_ru: 'Карточка добавки', _loading: true };
    state.catalog.detailSection = cached ? defaultDetailSection(cached) : null;
    renderActiveTab();
    if (cached && !silent) return;
    try {
      const d = await api(`./api/supplement/${key}`);
      state.catalog.detailCache[key] = d.item;
      state.catalog.detail = d.item;
      state.catalog.detailSection = defaultDetailSection(d.item);
      renderActiveTab();
    } catch {
      if (!cached) {
        state.catalog.detail = null;
        state.catalog.detailSection = null;
        renderActiveTab();
      }
      showToast('Не удалось открыть карточку');
    }
  }

  async function loadCatalog(force) {
    const c = state.catalog;
    if ((c.loading || c.loadingMore) && !force) return;
    if (c.page > 0) c.loadingMore = true;
    else c.loading = true;
    if (!c.items.length || c.page > 0) renderActiveTab();

    const f = c.filters;
    const qp = new URLSearchParams({ q: c.q || '', page: String(c.page), page_size: '20', sort: f.sort || 'alpha' });
    if (f.evidence.length) qp.set('evidence', f.evidence.join(','));
    if (f.targets.length) qp.set('targets', f.targets.join(','));
    if (f.burdens.length) qp.set('burdens', f.burdens.join(','));
    try {
      const res = await api(`./api/catalog?${qp.toString()}`);
      const nextItems = Array.isArray(res.items) ? res.items : [];
      const mergedItems = c.page === 0 ? nextItems : c.items.concat(nextItems);
      state.catalog.items = mergedItems;

      let total = Number(res.total);
      if (!Number.isFinite(total) || total < 0) total = 0;

      if (c.page === 0 && total === 0 && nextItems.length > 0) {
        try {
          const verify = await api(`./api/catalog?${qp.toString()}&_verify_total=1`);
          const verifiedTotal = Number(verify.total);
          if (Number.isFinite(verifiedTotal) && verifiedTotal > 0) total = verifiedTotal;
        } catch {}
        if (total === 0) {
          total = nextItems.length;
        }
      }

      if (c.page > 0) {
        total = Math.max(total, mergedItems.length, Number(state.catalog.total) || 0);
      }

      state.catalog.total = total;
      state.catalog.hasMore = mergedItems.length < total;
      state.catalog.error = false;
    } catch (e) {
      state.catalog.error = e.message !== 'PREMIUM_REQUIRED';
      if (c.page > 0) state.catalog.page = Math.max(0, c.page - 1);
    } finally {
      state.catalog.loading = false;
      state.catalog.loadingMore = false;
      renderActiveTab();
    }
  }

  async function loadCatalogMore() {
    const c = state.catalog;
    if (c.loading || c.loadingMore || !c.hasMore || c.filtersOpen || c.error) return;
    state.catalog.page += 1;
    await loadCatalog(true);
  }

  async function loadReadyStacks(force = false) {
    if (state.catalog.stacksLoading) return;
    if (!force && Array.isArray(state.catalog.readyStacks) && state.catalog.readyStacks.length) return;
    state.catalog.stacksLoading = true;
    try {
      const out = await api('./api/curated_stacks');
      state.catalog.readyStacks = Array.isArray(out.items) ? out.items : [];
    } catch {
      state.catalog.readyStacks = [];
      showToast('Не удалось загрузить готовые стеки');
    } finally {
      state.catalog.stacksLoading = false;
    }
  }

  function setupCatalogInfiniteScroll() {
    catalogObserver?.disconnect?.();
    catalogObserver = null;
    const sentinel = document.getElementById('catalogSentinel');
    if (!sentinel || state.activeTab !== 'catalog') return;
    catalogObserver = new IntersectionObserver((entries) => {
      const hit = entries.some((entry) => entry.isIntersecting);
      if (!hit) return;
      loadCatalogMore();
    }, { root: null, rootMargin: '600px 0px', threshold: 0 });
    catalogObserver.observe(sentinel);
  }

  function applyCatalogInStackState(supplementId, inStack) {
    const sid = Number(supplementId || 0);
    const next = !!inStack;
    if (!sid) return;
    for (const item of (state.catalog.items || [])) {
      if (Number(item.id || 0) === sid) item.in_stack = next;
    }
    const detail = state.catalog.detail || null;
    if (detail && Number(detail.id || 0) === sid) detail.in_stack = next;
    const slug = String(detail?.slug || '');
    if (slug && state.catalog.detailCache?.[slug]) {
      state.catalog.detailCache[slug].in_stack = next;
    }
  }

        await addSupplementToComplex(complexId, supplementId, `Добавлено в комплекс ${target?.name || ''}`.trim());

        showToast('Не удалось добавить в комплекс');

    appEl.querySelectorAll('[data-complex-create-and-add]').forEach((el) => el.addEventListener('click', async () => {

        const created = await api('./api/complexes/create', { method:'POST', body:{ name } });

        const createdId = Number(created?.item?.id || 0);
        if (!createdId) throw new Error('COMPLEX_CREATE_FAILED');

      } catch {
        showToast('Не удалось создать комплекс');

    const bindStackAction = (selector, action) => {
      appEl.querySelector(selector)?.addEventListener('click', async (e) => {
        const b = e.currentTarget;
        const id = Number(b.dataset.id || 0);

        haptic();

    appEl.querySelectorAll('[data-filter-toggle]').forEach((el)=>el.addEventListener('click', async ()=>{

  }

  function duplicateDisplayName(item) {
    const ru = String(item?.name_ru || '').trim();
    const en = String(item?.name_en || '').trim();
    const base = String(item?.name || '').trim();
    if (ru && en && ru !== en) return `${ru} (${en})`;
    return ru || en || base || String(item?.slug || 'Без названия');
  }

  function renderAdminDuplicateAlert() {
    const groups = Array.isArray(state.admin.duplicates) ? state.admin.duplicates : [];
    if (!groups.length) return '<div class="muted">Дубликаты не найдены.</div>'; 
    const busy = String(state.admin.duplicateResolveBusy || '');
    return `<div class="card fade" style="border:1px solid rgba(255,145,107,.45)">
      <div class="row"><strong>⚠️ Найдены дубликаты по имени</strong><span class="muted">${groups.length}</span></div>
      <div class="muted" style="margin-top:6px">Выберите, какую запись оставить. Вторая будет удалена.</div>
      <div style="margin-top:8px; display:grid; gap:8px;">
        ${groups.map((g)=>{
          const candidates = Array.isArray(g.candidates) ? g.candidates : [];
          if (candidates.length < 2) return '';
          const left = candidates[0];
          const right = candidates[1];
          const pairKey = `${Math.min(left.id, right.id)}:${Math.max(left.id, right.id)}`;
          const disable = busy === pairKey;
          return `<div class="card" style="padding:10px; background:rgba(255,255,255,.02)">
            <div><strong>${esc(g.name || 'duplicate')}</strong></div>
            <div class="muted" style="margin-top:4px">${candidates.length} совпадения</div>
            <div style="display:grid; gap:6px; margin-top:8px">
              <div>1) ${esc(duplicateDisplayName(left))} <span class="muted">#${left.id} · ${esc(left.slug || '')}</span></div>
              <div>2) ${esc(duplicateDisplayName(right))} <span class="muted">#${right.id} · ${esc(right.slug || '')}</span></div>
            </div>
            <div class="row" style="margin-top:8px; gap:6px; flex-wrap:wrap">
              <button class="btn" data-dup-keep="${left.id}" data-dup-remove="${right.id}" ${disable ? 'disabled' : ''}>Оставить #${left.id}</button>
              <button class="btn secondary" data-dup-keep="${right.id}" data-dup-remove="${left.id}" ${disable ? 'disabled' : ''}>Оставить #${right.id}</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

function adminField(label, field, value, kind='input') {
    const err = state.admin.errors[field] || '';
    const input = kind === 'textarea'
      ? `<textarea class="textarea" data-admin-field="${field}">${esc(value || '')}</textarea>`
      : `<input class="input" data-admin-field="${field}" value="${esc(value || '')}" />`;
    return `<div class="card" style="margin-bottom:8px"><div class="row"><strong>${label}</strong><button class="btn" data-admin-save="${field}">Сохранить</button></div>${input}${err ? `<div class="error-text">${esc(err)}</div>` : ''}</div>`;
  }

  async function loadAdminSupplements(force) {
    if (state.admin.loading && !force) return;
    state.admin.loading = true;
    renderActiveTab();
    try {
      const a = state.admin;
      const qp = new URLSearchParams({ q: a.q || '', page: String(a.page), page_size: String(a.pageSize) });
      if (a.filters.is_active !== '') qp.set('is_active', a.filters.is_active);
      if (a.filters.evidence) qp.set('evidence', a.filters.evidence);
      const res = await api(`./api/admin/supplements?${qp.toString()}`);
      a.items = a.page === 0 ? (res.items || []) : a.items.concat(res.items || []);
      a.total = res.total || 0;
    } catch (e) {
      if (e.message === 'PERMISSION_DENIED') showToast('Только для админов');
      else showToast('Ошибка загрузки admin-списка');
    } finally {
      state.admin.loading = false;
      renderActiveTab();
    }
  }

  async function loadAdminDuplicates() {
    state.admin.duplicatesLoading = true;
    try {
      const res = await api('./api/admin/duplicates');
      state.admin.duplicates = Array.isArray(res.groups) ? res.groups : [];
    } catch {
      state.admin.duplicates = [];
    } finally {
      state.admin.duplicatesLoading = false;
      renderActiveTab();
    }
  }

  async function resolveAdminDuplicate(keepId, removeId) {
    const k = Number(keepId || 0);
    const r = Number(removeId || 0);
    if (!k || !r || k === r) return;
    if (!confirm(`Оставить запись #${k} и удалить #${r}?`)) return;
    state.admin.duplicateResolveBusy = `${Math.min(k, r)}:${Math.max(k, r)}`;
    renderActiveTab();
    try {
      await api('./api/admin/duplicates/resolve', { method:'POST', body:{ keep_id: k, remove_id: r } });
      showToast('Дубликат обработан');
      state.admin.page = 0;
      await loadAdminSupplements(true);
      await loadAdminDuplicates();
    } catch (e) {
      const code = String(e?.code || '').trim();
      const messageMap = {
        duplicate_name_mismatch: 'Название дублей не совпало',
        duplicate_merge_failed: 'Не удалось объединить записи',
        supplement_not_found: 'Запись не найдена',
      };
      const humanText = messageMap[code] || e?.serverMessage || e?.message || 'Не удалось обработать дубликат';
      showToast(humanText);
    } finally {
      state.admin.duplicateResolveBusy = '';
      renderActiveTab();
    }
  }

  async function loadAdminSupplement(id) {
    try {
      const res = await api(`./api/admin/supplement/${id}`);
      state.admin.detail = res;
      state.admin.errors = {};
      renderActiveTab();
    } catch (e) {
      showToast('Не удалось открыть запись');
    }
  }

  async function saveAdminField(field) {
    const detail = state.admin.detail?.item;
    if (!detail) return;
    const value = detail[field] ?? '';
    try {
      await api(`./api/admin/supplement/${detail.id}/set_field`, { method:'POST', body:{ field, value } });
      state.admin.errors[field] = '';
      await loadAdminSupplement(detail.id);
      showToast('Сохранено');
    } catch (e) {
      state.admin.errors[field] = `Ошибка: ${e.message}`;
      renderActiveTab();
    }
  }

  async function runDiagnostics(applyMode) {
    state.admin.diagLoading = true;
    renderActiveTab();
    try {
      const res = await api('./api/admin/diagnostics/run', { method:'POST', body:{ apply: !!applyMode } });
      state.admin.diagnostics = res;
      showToast(applyMode ? 'Ремонт завершён' : 'Проверка завершена');
    } catch (e) {
      if (e.message === "PERMISSION_DENIED") { showToast('Нет прав'); }
      else showToast('Не удалось выполнить диагностику');
    } finally {
      state.admin.diagLoading = false;
      renderActiveTab();
    }
  }

  async function runBulk(op, params) {
    const ids = selectedAdminIds();
    if (!ids.length) { showToast('Выберите элементы'); return; }
    try {
      const preview = await api('./api/admin/bulk/preview', { method:'POST', body:{ ids, op, params } });
      state.admin.bulkConfirm = { preview, op, params };
      renderActiveTab();
    } catch (e) {
      if (e.message === 'PERMISSION_DENIED') { state.me.role = "none"; state.me.perms = {}; state.activeTab = 'today'; renderMainApp(); renderActiveTab(); showToast('нет прав'); return; }
      showToast('Ошибка preview');
    }
  }

  function scrollMainContentToElement(el, align = 'center') {
    if (!el || !el.getBoundingClientRect) return;
    const container = appEl.querySelector('.main-content');
    if (!container) return;
    const containerRect = container.getBoundingClientRect();
    const elementRect = el.getBoundingClientRect();
    let delta = 0;
    if (align === 'nearest') {
      const pad = 16;
      const visibleTop = containerRect.top + pad;
      const visibleBottom = containerRect.bottom - pad;
      if (elementRect.top < visibleTop) delta = elementRect.top - visibleTop;
      else if (elementRect.bottom > visibleBottom) delta = elementRect.bottom - visibleBottom;
    } else {
      const visibleCenter = containerRect.top + (containerRect.height / 2);
      const elementCenter = elementRect.top + (elementRect.height / 2);
      delta = elementCenter - visibleCenter;
    }
    if (Math.abs(delta) < 2) return;
    container.scrollTo({
      top: container.scrollTop + delta,
      behavior: 'smooth'
    });
  }

  function positionBodyMapSheet() {
    requestAnimationFrame(() => {
      const sheet = appEl.querySelector('.sheet[data-bodymap-sheet]');
      if (!sheet) return;
      const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      if (!viewportHeight) return;
      const ratio = Math.max(0, Math.min(1, Number(state.bodyMapSheetFocusRatio || 0.5)));
      const minTop = 66;
      const maxBottomOffset = 92;
      const availableBottom = viewportHeight - maxBottomOffset;
      const sheetHeight = Math.min(sheet.offsetHeight || 0, Math.max(220, viewportHeight * 0.66));
      const desiredCenter = viewportHeight * ratio;
      const rawTop = desiredCenter - (sheetHeight / 2);
      const maxTop = Math.max(minTop, availableBottom - sheetHeight);
      const top = Math.max(minTop, Math.min(maxTop, rawTop));
      sheet.style.top = `${Math.round(top)}px`;
      sheet.style.bottom = 'auto';
    });
  }

  function assistantAnalyteSortKey(item = {}) {
    const name = String(item.name || item.name_ru || item.label || '').trim();
    const bMatch = name.match(/^Витамин\s+B\s*(\d+)/i);
    return {
      name,
      isBVitamin: !!bMatch,
      bNum: bMatch ? Number(bMatch[1] || 0) : 0,
    };
  }
  function sortAssistantAnalytePresets(items = []) {
    const list = Array.isArray(items) ? items.slice() : [];
    return list.sort((a, b)=>{
      const ak = assistantAnalyteSortKey(a);
      const bk = assistantAnalyteSortKey(b);
      const byName = ak.name.localeCompare(bk.name, 'ru', { sensitivity: 'base', numeric: true });
      if (ak.isBVitamin && bk.isBVitamin && ak.bNum !== bk.bNum) return ak.bNum - bk.bNum;
      return byName;
    });
  }

  function normalizeAssistantLabItem(item = {}, opts = {}) {
    const keepUnit = !!opts.keepUnit;
    const rawCode = String(item.analyte_code || item.code || '').trim().toLowerCase();
    const preset = getAssistantAnalytePresets().find((x)=>String(x.code)===rawCode);
    const rawName = String(item.analyte_name_ru || item.analyte_name || '').trim();
    const nextUnit = String(item.unit || '').trim();
    const normalized = {
      analyte_code: rawCode,
      analyte_name_ru: preset?.name || rawName || rawCode,
      value: String(item.value ?? item.value_num ?? item.value_text ?? '').trim(),
      unit: keepUnit ? nextUnit : (nextUnit || String(preset?.units?.[0] || '').trim()),
      ref_low: String(item.ref_low ?? '').trim(),
      ref_high: String(item.ref_high ?? '').trim(),
      measured_at: String(item.measured_at || '').trim(),
      referenceOpen: !!item.referenceOpen
    };
    if (!normalized.analyte_code && !normalized.value && !normalized.unit && !normalized.ref_low && !normalized.ref_high && !normalized.measured_at) {
      normalized.analyte_name_ru = '';
    }
    return normalized;

  function stopAssistantJobPolling() {
    if (state.nutrientAssistant.jobPollTimer) {
      clearTimeout(state.nutrientAssistant.jobPollTimer);
      state.nutrientAssistant.jobPollTimer = null;
    }
  }
  function scheduleAssistantJobPolling(jobId, delayMs = 3800) {
    stopAssistantJobPolling();
    state.nutrientAssistant.jobPollTimer = setTimeout(async ()=>{
      const id = Number(jobId || state.nutrientAssistant.currentJobId || 0);
      if (!id) return;
      try {
        const job = await fetchAssistantJob(id);
        const prevStatus = String(state.nutrientAssistant.currentJobStatus || '');
        const status = String(job?.status || '');
        state.nutrientAssistant.currentJobId = id;
        state.nutrientAssistant.currentJobStatus = status;
        state.nutrientAssistant.jobPollErrors = 0;
        if (status === 'queued' || status === 'processing') {
          if (status !== prevStatus) showToast(status === 'queued' ? 'Расчёт в очереди' : 'Идёт расчёт');
          scheduleAssistantJobPolling(id, 3800);
        } else if (status === 'done' && Number(job?.result_run_id || 0) > 0) {
          stopAssistantJobPolling();
          state.nutrientAssistant.computing = false;
          state.nutrientAssistant.blocked = false;
          state.nutrientAssistant.currentJobId = null;
          state.nutrientAssistant.currentJobStatus = 'done';
          await loadNutrientPlans(true);
          await loadAssistantRunDetail(Number(job.result_run_id)).catch(()=>null);
          showToast('Расчёт готов');
        } else if (status === 'failed') {
          stopAssistantJobPolling();
          state.nutrientAssistant.computing = false;
          state.nutrientAssistant.blocked = false;
          state.nutrientAssistant.currentJobStatus = 'failed';
          state.nutrientAssistant.currentJobId = null;
          showToast(String(job?.error_message || 'Расчёт завершился с ошибкой'));
        } else {
          scheduleAssistantJobPolling(id, 3800);
        }
      } catch {
        state.nutrientAssistant.jobPollErrors = Number(state.nutrientAssistant.jobPollErrors || 0) + 1;
        if (state.nutrientAssistant.jobPollErrors <= 5) {
          scheduleAssistantJobPolling(id, 4200);
        } else {
          stopAssistantJobPolling();
          state.nutrientAssistant.computing = false;
          state.nutrientAssistant.blocked = false;
          showToast('Проблема с сетью при проверке статуса расчёта');
        }
      }
      renderActiveTab();
    }, delayMs);
  }
  async function saveNutrientDraft(partial = {}) {
    const hasProfile = Object.prototype.hasOwnProperty.call(partial, 'assistant_profile');
    const hasLabs = Object.prototype.hasOwnProperty.call(partial, 'labs');
    const hasScope = Object.prototype.hasOwnProperty.call(partial, 'compute_scope');
    const hasSource = Object.prototype.hasOwnProperty.call(partial, 'source_run_id');
    const payload = {
      assistant_profile: hasProfile ? partial.assistant_profile : collectAssistantForm(),
      labs: hasLabs ? partial.labs : collectAssistantLabs(),
      compute_scope: hasScope ? partial.compute_scope : { mode: 'current_draft' },
      source_run_id: hasSource ? partial.source_run_id : (Number(state.nutrientAssistant.draftSourceRunId || 0) || null)
    };
    const res = await api('./api/profile/nutrient-assistant/draft', { method:'POST', body: payload });
    if (res?.draft?.updated_at_utc) state.nutrientAssistant.draftUpdatedAt = String(res.draft.updated_at_utc || '');
    if (res?.draft) state.nutrientAssistant.draftSourceRunId = Number(res.draft.source_run_id || 0) || null;
    return res.draft || null;
  }

  function detectAssistantStage(form = {}, draftLabs = []){
