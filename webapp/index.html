      return chips.map((c)=>`<span class="chip">${esc(c)}</span>`).join(' ');
    };
    const options = (items, allowedIds, current) => (items||[]).filter((x)=>allowedIds.includes(x.id)).map((x)=>`<option value="${esc(x.id)}" ${x.id===current?'selected':''}>${esc(x.emoji||'')} ${esc(x.title_ru||x.id)}</option>`).join('');

    const unlockedAchievements = items.filter((x) => x.unlocked);
    const unseenUnlockedAchievements = unlockedAchievements.filter((x) => !String(x.seen_at_utc || "").trim());
    const getCosmeticUnlockInfo = (kind, id) => {
      const safeId = String(id || "").trim();
      if (!safeId) return { by: "", isNew: false };
      const by = unlockedAchievements.filter((a) => Array.isArray(a.reward?.unlock?.[kind]) && a.reward.unlock[kind].map(String).includes(safeId)).map((a) => a.title_ru).filter(Boolean);
      const isNew = unseenUnlockedAchievements.some((a) => Array.isArray(a.reward?.unlock?.[kind]) && a.reward.unlock[kind].map(String).includes(safeId));
      return { by: by[0] || "", isNew };
    };
    const newestUnlockedId = (kind, allowedIds, currentId) => {
      for (const a of unseenUnlockedAchievements) {
        const ids = Array.isArray(a.reward?.unlock?.[kind]) ? a.reward.unlock[kind].map((x) => String(x || "").trim()).filter(Boolean) : [];
        for (const id of ids) {
          if (allowedIds.includes(id) && id !== currentId) return id;
        }
      }
      return "";
    };
    const quickThemeId = newestUnlockedId("themes", allowed.themes || ["base"], cosmetics.theme_id || "base");
    const quickTabId = newestUnlockedId("tab_skins", allowed.tab_skins || ["classic"], cosmetics.tab_skin_id || "classic");
    const quickBadgeId = newestUnlockedId("badges", allowed.badges || ["none"], cosmetics.badge_id || "none");
    const themeUnlockInfo = getCosmeticUnlockInfo("themes", cosmetics.theme_id || "base");
    const tabUnlockInfo = getCosmeticUnlockInfo("tab_skins", cosmetics.tab_skin_id || "classic");
    const badgeUnlockInfo = getCosmeticUnlockInfo("badges", cosmetics.badge_id || "none");

    const filtered = items.filter((a) => {
      const isNew = Boolean(a.unlocked && !String(a.seen_at_utc || "").trim());
      if (achFilter === "unlocked" && !a.unlocked) return false;
      if (achFilter === "locked" && a.unlocked) return false;
      if (achFilter === "new" && !isNew) return false;
      if (achQuery) {
        const blob = `${String(a.title_ru || "")} ${String(a.desc_ru || "")}`.toLowerCase();
        if (!blob.includes(achQuery)) return false;
      }
      return true;
    });

    const grouped = new Map();
    filtered.forEach((a) => {
      const category = String(a.category || "Без категории");
      if (!grouped.has(category)) grouped.set(category, []);
      grouped.get(category).push(a);
    });

    const groupedHtml = [...grouped.entries()].map(([category, arr]) => {
      const sorted = [...arr].sort((a, b) => {
        if (Boolean(b.unlocked) !== Boolean(a.unlocked)) return Number(b.unlocked) - Number(a.unlocked);
        return Number(b.points || 0) - Number(a.points || 0);

      return `

          <div class="ach-category-title">${esc(category)}</div>

    const filterBtn = (key, label) => `<button class="chip ${achFilter===key?'green':''}" data-ach-filter="${key}">${label}</button>`;
    return `

      <section class="card fade">
        <div class="row"><strong>⚙️ Настройки аккаунта</strong></div>

        <div class="muted" style="margin-top:4px">${esc(accessHint)}</div>
        <div class="muted" style="margin-top:4px">После подписки: постоянный доступ к WebApp, AI check-in и удобный ежедневный трекинг.</div>
        <div class="muted" style="margin-top:6px">Документы: ${state.settingsData?.offer_url ? `<a href="${esc(state.settingsData.offer_url)}" target="_blank" rel="noopener noreferrer">Оферта</a>${state.settingsData?.offer_version ? ` (v${esc(state.settingsData.offer_version)})` : ''}` : 'Оферта недоступна'} · ${state.settingsData?.privacy_url ? `<a href="${esc(state.settingsData.privacy_url)}" target="_blank" rel="noopener noreferrer">Privacy Policy</a>${state.settingsData?.privacy_version ? ` (v${esc(state.settingsData.privacy_version)})` : ''}` : 'Privacy Policy недоступна'}</div>
        <div class="ios-group">
          <details open>
            <summary><span>🕒 Время и расписание</span><span class="ios-arrow">▾</span></summary>
            <div class="ios-content">
              <label class="muted">Часовой пояс</label>
              <select id="settingsTimezone" class="select">${timezoneOptionsHtml(state.settingsData?.tz_name || 'UTC+03:00')}</select>
              <div class="row" style="gap:8px; flex-wrap:wrap"><button class="btn secondary" id="settingsOpenToday">Открыть слот-план</button><button class="btn secondary" id="settingsOpenMySupp">Мои БАДы</button></div>
            </div>
          </details>
          <details>
            <summary><span>🧪 Подбор и проверка</span><span class="ios-arrow">▾</span></summary>
            <div class="ios-content">
              <div class="muted">Начальный подбор и цели доступны в веб-опросе.</div>
              <div><button class="btn" id="settingsOpenSurvey">Открыть опрос</button></div>
            </div>
          </details>
          <details>
            <summary><span>ℹ️ Справка</span><span class="ios-arrow">▾</span></summary>
            <div class="ios-content"><div class="muted">Те же базовые настройки, что и в боте: таймзона, расписание/слоты, напоминания и подбор. Напоминания для каждой добавки — через «Мои БАДы». ${adminHint ? 'Админка вынесена в отдельную вкладку.' : ''}</div></div>
          </details>
        </div>
      </section>
      ${(() => {
        const next = (Array.isArray(ach.next_up) ? ach.next_up : []).filter((item) => Number(item?.pct || 0) > 0 && Number(item?.pct || 0) < 100);
        const recent = Array.isArray(ach.recent_achievements) ? ach.recent_achievements : [];
        const nextHtml = !next.length ? '<div class="muted">Сейчас нет актуальных шагов.</div>' : `<div style="display:grid; gap:8px;">${next.map((item) => `<div class="ach-item"><div><strong>${esc(item.title_ru || '')}</strong></div><div class="ach-progress"><div class="bar"><i style="width:${Math.max(0, Math.min(100, Number(item.pct || 0)))}%"></i></div><div class="muted" style="margin-top:4px">Прогресс: ${Math.max(0, Math.min(100, Number(item.pct || 0)))}%</div>${item.hint_ru ? `<div class="muted">${esc(item.hint_ru)}</div>` : ''}</div></div>`).join('')}</div>`;
        const recentHtml = !recent.length ? '<div class="muted">Пока нет новых открытий.</div>' : `<div style="display:grid; gap:8px;">${recent.slice(0,8).map((item) => `<div class="ach-item"><div><strong>${esc(item.title_ru || '')}</strong></div><div class="muted">${esc(formatUtcShort(item.unlocked_at_utc || ''))}</div>${(item.reward_verbose || []).length ? `<div class="muted" style="margin-top:4px">${item.reward_verbose.map((x) => esc(x)).join(' · ')}</div>` : ''}</div>`).join('')}</div>`;
        return `<section class="card fade"><div class="row"><strong>🏆 Достижения и персонализация</strong></div><div class="ios-group">
          <details><summary><span>🎯 Дальше по плану</span><span class="ios-arrow">▾</span></summary><div class="ios-content">${nextHtml}</div></details>
          <details><summary><span>🕒 Последние открытия</span><span class="ios-arrow">▾</span></summary><div class="ios-content">${recentHtml}</div></details>
          <details id="achievementsBlock"><summary><span>🏅 Все достижения ${unseenCount > 0 ? `<span class="chip" style="margin-left:8px">Новое: ${unseenCount}</span>` : ""}</span><span class="ios-arrow">▾</span></summary><div class="ios-content"><div class="muted">Открытые: ${unlocked.length} · Закрытые: ${locked.length}</div><div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">${filterBtn('all','Все')}${filterBtn('unlocked','Открытые')}${filterBtn('locked','Закрытые')}${filterBtn('new','Новые')}</div><div style="margin-top:8px"><input class="input" id="achSearch" placeholder="Поиск по названию или описанию" value="${esc(state.ui?.achQuery || "")}" /></div>${groupedHtml || '<div class="muted" style="margin-top:10px">Ничего не найдено по выбранным фильтрам.</div>'}</div></details>
          <details><summary><span>🎨 Косметика</span><span class="ios-arrow">▾</span></summary><div class="ios-content">
            <div><label class="muted">Тема</label><select class="select" id="cosTheme">${options(catalogs.themes, allowed.themes || ["base"], cosmetics.theme_id || "base")}</select><div class="cos-meta">${themeUnlockInfo.isNew ? '<span class="new-pill">Новое</span>' : ''}${themeUnlockInfo.by ? `<span>Открыто достижением: ${esc(themeUnlockInfo.by)}</span>` : '<span>Базовая доступность</span>'}${quickThemeId ? `<button class="btn secondary" data-cos-quick="theme" data-cos-id="${esc(quickThemeId)}">Применить</button>` : ''}</div></div>
            <div><label class="muted">Таб-меню</label><select class="select" id="cosTab">${options(catalogs.tab_skins, allowed.tab_skins || ["classic"], cosmetics.tab_skin_id || "classic")}</select><div class="cos-meta">${tabUnlockInfo.isNew ? '<span class="new-pill">Новое</span>' : ''}${tabUnlockInfo.by ? `<span>Открыто достижением: ${esc(tabUnlockInfo.by)}</span>` : '<span>Базовая доступность</span>'}${quickTabId ? `<button class="btn secondary" data-cos-quick="tab" data-cos-id="${esc(quickTabId)}">Применить</button>` : ''}</div></div>
            <div><label class="muted">Бейдж</label><select class="select" id="cosBadge">${options(catalogs.badges, allowed.badges || ["none"], cosmetics.badge_id || "none")}</select><div class="cos-meta">${badgeUnlockInfo.isNew ? '<span class="new-pill">Новое</span>' : ''}${badgeUnlockInfo.by ? `<span>Открыто достижением: ${esc(badgeUnlockInfo.by)}</span>` : '<span>Базовая доступность</span>'}${quickBadgeId ? `<button class="btn secondary" data-cos-quick="badge" data-cos-id="${esc(quickBadgeId)}">Применить</button>` : ''}</div></div>
          </div></details>
        </div></section>`;
      })()}
      ${renderStatsBlock() || '<section class="card fade"><div class="row"><strong>📈 Статистика</strong></div><div class="muted" style="margin-top:8px">Пока нет данных для отображения.</div><div style="margin-top:10px"><button class="btn secondary" data-stats-refresh>Обновить</button></div></section>'}
    `;
  }

  function bindSettingsEvents() {
    document.querySelectorAll('[data-stats-refresh]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (state.loadingStats) return;
        haptic();
        try {
          await loadStatsOnly();
          showToast('Статистика обновлена');
        } catch {}
      });
    });
    document.querySelectorAll('[data-ach-scroll]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const block = document.getElementById('achievementsBlock');
        block?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    document.querySelectorAll('[data-ach-filter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.ui = state.ui || {};
        state.ui.achFilter = String(btn.dataset.achFilter || 'all');
        renderActiveTab();
      });
    });
    const achSearch = document.getElementById('achSearch');
    achSearch?.addEventListener('input', (e) => {
      state.ui = state.ui || {};
      state.ui.achQuery = e.target.value || '';
      renderActiveTab();
    });
    document.getElementById('settingsTimezone')?.addEventListener('change', async (e) => {
      const tzName = String(e.target.value || '').trim();
      if (!tzName) return;
      try {
        await api('./api/settings/timezone', { method:'POST', body:{ tz_name: tzName } });
        state.settingsData.tz_name = tzName;
        showToast('Часовой пояс сохранён');
      } catch {
        showToast('Не удалось сохранить часовой пояс');
      }
    });
    document.getElementById('settingsOpenSurvey')?.addEventListener('click', async () => {
      state.activeTab = 'survey';
      renderMainApp();
      await loadSurveyForTarget();
    });
    document.getElementById('settingsOpenToday')?.addEventListener('click', async () => {
      state.activeTab = 'today';
      renderMainApp();
      await loadToday(true);
    });
    document.getElementById('settingsOpenMySupp')?.addEventListener('click', async () => {
      state.activeTab = 'today';
      state.mySupplements.open = true;
      renderMainApp();
      await loadMySupplements(true);
    });

    const applyPatch = async () => {
      const patch = {
        theme_id: document.getElementById("cosTheme")?.value || "base",
        tab_skin_id: document.getElementById("cosTab")?.value || "classic",
        badge_id: document.getElementById("cosBadge")?.value || "none",
      };
      try {
        const res = await api("./api/cosmetics/set", { method: "POST", body: patch });
        state.ach = state.ach || {};
        state.ach.cosmetics = res.cosmetics;
        state.me = { ...(state.me || {}), cosmetics: res.cosmetics };
        applyCosmetics(res.cosmetics);
        renderMainApp();
        if (state.activeTab === "settings") renderActiveTab();
      } catch {
        showToast("Косметика пока не доступна");
      }
    };
    document.querySelectorAll('[data-cos-quick]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        haptic();
        const kind = String(btn.dataset.cosQuick || '');
        const cid = String(btn.dataset.cosId || '').trim();
        if (!cid) return;
        const patch = {};
        if (kind === 'theme') patch.theme_id = cid;
        if (kind === 'tab') patch.tab_skin_id = cid;
        if (kind === 'badge') patch.badge_id = cid;
        if (!Object.keys(patch).length) return;
        try {
          const res = await api("./api/cosmetics/set", { method: "POST", body: patch });
          state.ach = state.ach || {};
          state.ach.cosmetics = res.cosmetics;
          state.me = { ...(state.me || {}), cosmetics: res.cosmetics };
          applyCosmetics(res.cosmetics);
          renderMainApp();
          if (state.activeTab === "settings") renderActiveTab();
          showToast('Косметика применена');
        } catch {
          showToast('Не удалось применить косметику');
        }
      });
    });

    ["cosTheme", "cosTab", "cosBadge"].forEach((id) => {
      const el = document.getElementById(id);
      el?.addEventListener("change", applyPatch);
    });
  }

  function statusClass(status) {
    if (status === "taken") return "status-taken";
    if (status === "skipped") return "status-skipped";
    return "status-none";
  }

  function statusText(status) {
    if (status === "taken") return '<span class="status-pill-icon">✅</span><span class="status-pill-label">Принято</span>';
    if (status === "skipped") return '<span class="status-pill-icon">⛔</span><span class="status-pill-label">Пропуск</span>';
    return '<span class="status-pill-icon">◻</span><span class="status-pill-label">Не отмечено</span>';
  }

  async function openSupplementHub(supplementId) {
    const sid = Number(supplementId);
    if (!sid) return;
    const all = [...(state.mySupplements.active || []), ...(state.mySupplements.frozen || [])];
    const item = all.find((x) => Number(x.supplement_id) === sid);
    if (!item) return;
    state.suppHub.open = true;
    state.suppHub.loading = true;
    state.suppHub.item = item;
    state.suppHub.doseText = item.dose_text || '';
    state.suppHub.noteText = item.note_text || '';
    state.suppHub.reminderInput = '';
    state.suppHub.historyOpen = false;
    state.suppHub.history = null;
    state.suppHub.historyLoading = false;
    state.suppHub.deleting = false;
    renderActiveTab();
    try {
      const [scheduleRes, remRes] = await Promise.all([
        api('./api/schedule'),
        api(`./api/reminders/for_supplement?supplement_id=${sid}`),
      ]);
      const slots = Array.isArray(scheduleRes.slots) ? scheduleRes.slots : [];
      const schedules = Array.isArray(scheduleRes.schedules) ? scheduleRes.schedules : [];
      const sch = schedules.find((x) => Number(x.supplement_id) === sid);
      state.suppHub.slots = slots;
      state.suppHub.slotId = sch?.slot_id || 'morning';
      state.suppHub.time = sch?.time_hhmm || '';
      state.suppHub.reminderTimes = Array.isArray(remRes.times) ? remRes.times : [];
      state.suppHub.remindersMode = state.suppHub.reminderTimes.length ? 'custom' : 'slot';
    } catch {
      showToast('Не удалось загрузить хаб добавки');
    } finally {
      state.suppHub.loading = false;
      renderActiveTab();
    }
  }

  function bindTodayEvents() {
    appEl.querySelectorAll("[data-item]").forEach((row) => {
      row.addEventListener("click", (e) => {
        e.preventDefault();
        const supplementId = row.dataset.item;
        const next = row.dataset.next;
        toggleOne(supplementId, next);
      });
    });

    appEl.querySelectorAll("[data-complex-toggle]").forEach((btn)=>{
      btn.addEventListener("click", async (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const complexId = Number(btn.dataset.complexToggle);
        const next = btn.dataset.next;
        const prevSlot = findSlotByComplexId(complexId);
        const wasClosedBefore = slotProgress(prevSlot).closed;
        const complex = (prevSlot?.complexes || []).find((c) => Number(c.complex_id) === complexId);
        const snapshot = complex ? {
          status: complex.status,
          takenCount: complex.taken_count,
          items: (complex.items || []).map((it) => ({ id: it.supplement_id, status: it.status })),
        } : null;
        if (complex) {
          complex.status = next;
          complex.taken_count = next === 'taken' ? Number(complex.total_count || 0) : 0;
          (complex.items || []).forEach((it) => { it.status = next; });
          recalcTodaySnapshot();
          renderActiveTab();
        }
        haptic();
        try {
          const out = await api("./api/today/toggle_complex", { method:"POST", body:{ complex_id: complexId, status: next } });
          recalcTodaySnapshot();
          renderActiveTab();
          if (next === "taken") {
            const afterSlot = findSlotByComplexId(complexId);
            const isClosedAfter = slotProgress(afterSlot).closed;
            const perfectDay = Number(state.today?.expected || 0) >= 3 && Number(state.today?.adherence || 0) === 100;
            const gain = extractUnlockedPoints([out]);
            if (perfectDay) maybeCelebratePerfectDay(gain);
            else if (!wasClosedBefore && isClosedAfter) maybeCelebrateSlotClosed();
          }
          await showUnlockToastFromPayload(out);
        } catch {
          if (complex && snapshot) {
            complex.status = snapshot.status;
            complex.taken_count = snapshot.takenCount;
            (complex.items || []).forEach((it) => {
              const prevItem = snapshot.items.find((x) => String(x.id) === String(it.supplement_id));
              if (prevItem) it.status = prevItem.status;
            });
            recalcTodaySnapshot();
            renderActiveTab();
          }
          showToast("Не удалось отметить комплекс");
        }
      });
    });

    appEl.querySelectorAll("[data-slot-action]").forEach((btn) => {
      btn.addEventListener("click", async (e) => {
        e.preventDefault();
        const slotId = btn.dataset.slotId;
        const action = btn.dataset.slotAction;
        const status = action === "all-taken" ? "taken" : "none";
        await setSlotStatus(slotId, status);
      });
    });

    appEl.querySelectorAll("[data-open-my-supp]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        haptic();
        state.mySupplements.open = true;
        state.mySupplements.tab = "active";
        renderActiveTab();
        await loadMySupplements(true);
      });
    });

    appEl.querySelectorAll("[data-my-supp-close]").forEach((el) => {
      el.addEventListener("click", () => {
        state.mySupplements.open = false;
        renderActiveTab();
      });
    });

    appEl.querySelectorAll("[data-my-supp-tab]").forEach((el) => {
      el.addEventListener("click", () => {
        state.mySupplements.tab = el.dataset.mySuppTab === "frozen" ? "frozen" : "active";
        renderActiveTab();
      });
    });

    appEl.querySelectorAll("[data-my-supp-freeze]").forEach((el) => {
      el.addEventListener("click", async () => {
        const supplementId = Number(el.dataset.mySuppFreeze);
        const enabled = Number(el.dataset.enabled);
        state.mySupplements.busy[supplementId] = true;
        renderActiveTab();
        try {
          await api("./api/my_supplements/freeze", { method: "POST", body: { supplement_id: supplementId, enabled } });
          await Promise.all([loadMySupplements(true), loadToday(true)]);
          showToast(enabled ? "Добавка разморожена" : "Добавка заморожена");
        } catch {
          showToast("Не удалось изменить статус");
        } finally {
          delete state.mySupplements.busy[supplementId];
          renderActiveTab();
        }
      });
    });

    appEl.querySelectorAll("[data-my-supp-open]").forEach((el) => {
      el.addEventListener("click", async () => {
        await openSupplementHub(Number(el.dataset.mySuppOpen));
      });
    });

    appEl.querySelectorAll('[data-supp-hub-close]').forEach((el) => {
      el.addEventListener('click', () => {
        state.suppHub.open = false;
        renderActiveTab();
      });
    });

    appEl.querySelectorAll('[data-rem-mode]').forEach((el) => {
      el.addEventListener('click', () => {
        state.suppHub.remindersMode = el.dataset.remMode === 'custom' ? 'custom' : 'slot';
        renderActiveTab();
      });
    });

    appEl.querySelectorAll('[data-rem-remove]').forEach((el) => {
      el.addEventListener('click', () => {
        state.suppHub.reminderTimes = (state.suppHub.reminderTimes || []).filter((x) => x !== el.dataset.remRemove);
        renderActiveTab();
      });
    });

    document.getElementById('hubDose')?.addEventListener('input', (e) => { state.suppHub.doseText = e.target.value || ''; });
    document.getElementById('hubNote')?.addEventListener('input', (e) => { state.suppHub.noteText = e.target.value || ''; });
    document.getElementById('hubSlot')?.addEventListener('change', (e) => { state.suppHub.slotId = e.target.value || 'morning'; });

    appEl.querySelector('[data-supp-hub-history]')?.addEventListener('click', async () => {
      state.suppHub.historyOpen = !state.suppHub.historyOpen;
      if (!state.suppHub.historyOpen) {
        renderActiveTab();
        return;
      }
      if (state.suppHub.history || state.suppHub.historyLoading) {
        renderActiveTab();
        return;
      }
      state.suppHub.historyLoading = true;
      renderActiveTab();
      try {
        state.suppHub.history = await api(`./api/my_supplements/history?supplement_id=${Number(state.suppHub.item?.supplement_id || 0)}`);
      } catch {
        showToast('Не удалось загрузить историю');
      } finally {
        state.suppHub.historyLoading = false;
        renderActiveTab();
      }
    });

    appEl.querySelector('[data-my-supp-delete]')?.addEventListener('click', async () => {
      haptic();
      const sid = Number(state.suppHub.item?.supplement_id || 0);
      if (!sid) return;
      if (!confirm('Удалить добавку из моих БАДов? История приёмов сохранится.')) return;
      state.suppHub.deleting = true;
      renderActiveTab();
      try {
        await api('./api/my_supplements/remove', { method: 'POST', body: { supplement_id: sid } });
        state.suppHub.open = false;
        await loadMySupplements(true);
        await loadToday(true);
        renderActiveTab();
        showToast('Добавка удалена из списка');
      } catch {
        showToast('Не удалось удалить добавку');
      } finally {
        state.suppHub.deleting = false;
      }
    });
    document.getElementById('hubTime')?.addEventListener('input', (e) => { state.suppHub.time = e.target.value || ''; });
    document.getElementById('hubRemTime')?.addEventListener('input', (e) => { state.suppHub.reminderInput = e.target.value || ''; });

    appEl.querySelectorAll('[data-rem-add-time]').forEach((el) => {
      el.addEventListener('click', () => {
        const time = normalizeHHMM(state.suppHub.reminderInput);
        if (!time) return showToast('Введите время HH:MM');
        if ((state.suppHub.reminderTimes || []).includes(time)) return;
        state.suppHub.reminderTimes = [...(state.suppHub.reminderTimes || []), time].sort();
        state.suppHub.reminderInput = '';
        renderActiveTab();
      });
    });

    appEl.querySelectorAll('[data-schedule-add-slot]').forEach((el) => {
      el.addEventListener('click', async () => {
        const time = normalizeHHMM(state.suppHub.time);
        if (!time) return showToast('Укажите корректное время');
        try {
          const r = await api('./api/schedule/add_slot', { method: 'POST', body: { time_local: time, title_ru: `Слот ${time}` } });
          const s = await api('./api/schedule');
          state.suppHub.slots = Array.isArray(s.slots) ? s.slots : [];
          state.suppHub.slotId = r.slot_id || state.suppHub.slotId;
          renderActiveTab();
          showToast('Слот создан');
        } catch {
          showToast('Не удалось создать слот');
        }
      });
    });

    appEl.querySelectorAll('[data-supp-hub-save]').forEach((el) => {
      el.addEventListener('click', async () => {
        const item = state.suppHub.item;
        if (!item) return;
        const sid = Number(item.supplement_id);
        const time = normalizeHHMM(state.suppHub.time) || null;
        state.suppHub.saving = true;
        renderActiveTab();
        try {
          await api('./api/my_supplements/update', { method: 'POST', body: { supplement_id: sid, dose_text: state.suppHub.doseText || '', note_text: state.suppHub.noteText || '' } });
          await api('./api/schedule/set', { method: 'POST', body: { supplement_id: sid, slot_id: state.suppHub.slotId || 'morning', time_hhmm: time } });
          await api('./api/reminders/set', { method: 'POST', body: { supplement_id: sid, mode: state.suppHub.remindersMode, times: state.suppHub.remindersMode === 'custom' ? (state.suppHub.reminderTimes || []) : [] } });
          await Promise.all([loadMySupplements(true), loadToday(true)]);
          showToast('Изменения сохранены');
        } catch {
          showToast('Не удалось сохранить изменения');
        } finally {
          state.suppHub.saving = false;
          renderActiveTab();
        }
      });
    });
  }

  function findItemById(id) {
    for (const slot of state.today?.slots || []) {
      const item = (slot.items || []).find(i => String(i.supplement_id) === String(id));
      if (item) return item;
    }
    return null;
  }

  async function toggleOne(supplementId, nextStatus) {
    haptic();
    const item = findItemById(supplementId);
    if (!item) return;

    const prevSlot = findSlotBySupplementId(supplementId);
    const wasClosedBefore = slotProgress(prevSlot).closed;
    const prev = item.status;
    item.status = nextStatus;
    recalcTodaySnapshot();
    renderActiveTab();

    try {
      const out = await api("./api/today/toggle", {
        method: "POST",
        body: { supplement_id: Number(supplementId), status: nextStatus }
      });
      recalcTodaySnapshot();
      if (nextStatus === "taken") {
        const afterSlot = findSlotBySupplementId(supplementId);
        const isClosedAfter = slotProgress(afterSlot).closed;
        const perfectDay = Number(state.today?.expected || 0) >= 3 && Number(state.today?.adherence || 0) === 100;
        const gain = extractUnlockedPoints([out]);
        if (perfectDay) maybeCelebratePerfectDay(gain);
        else if (!wasClosedBefore && isClosedAfter) maybeCelebrateSlotClosed();
      }
      await showUnlockToastFromPayload(out);
    } catch (e) {
      item.status = prev;
      recalcTodaySnapshot();
      renderActiveTab();
      showToast("Ошибка синхронизации, откат");
    }
  }

  async function setSlotStatus(slotId, status) {
    haptic();
    const slot = (state.today?.slots || []).find(s => String(s.slot_id) === String(slotId));
    if (!slot) return;

    const items = slot.items || [];
    const complexes = slot.complexes || [];
    if (!items.length && !complexes.length) return;

    const snapshot = {
      items: items.map((i) => ({ id: i.supplement_id, status: i.status })),
      complexes: complexes.map((c) => ({
        id: c.complex_id,
        status: c.status,
        takenCount: c.taken_count,
        itemStatuses: (c.items || []).map((item) => ({ id: item.supplement_id, status: item.status })),
      })),
    };

    items.forEach((i) => { i.status = status; });
    complexes.forEach((complex) => {
      complex.status = status;
      complex.taken_count = status === "taken" ? (complex.total_count || 0) : 0;
      (complex.items || []).forEach((item) => { item.status = status; });
    });
    recalcTodaySnapshot();
    renderActiveTab();

    try {
      const unlockPayloads = [];
      const complexPending = complexes.map((complex) => async () => {
        const out = await api("./api/today/toggle_complex", {
          method: "POST",
          body: { complex_id: Number(complex.complex_id), status }
        });
        unlockPayloads.push(out);
      });
      await runBatched(complexPending, 3);

      const complexItemIds = new Set(
        complexes.flatMap((complex) => (complex.items || []).map((item) => String(item.supplement_id)))
      );
      const singlePending = items
        .filter((item) => !complexItemIds.has(String(item.supplement_id)))
        .map((item) => async () => {
          const out = await api("./api/today/toggle", {
            method: "POST",
            body: { supplement_id: Number(item.supplement_id), status }
          });
          unlockPayloads.push(out);
        });

      await runBatched(singlePending, 3);
      showToast(status === "taken" ? "Отметил всё как принято" : "Слот сброшен");
      if (status === "taken") {
        const afterSlot = (state.today?.slots || []).find((s) => String(s.slot_id) === String(slotId));
        const wasClosedBefore = (snapshot.items.every((x) => x.status === "taken") && snapshot.complexes.every((c) => (c.itemStatuses || []).every((x) => x.status === "taken")));
        const isClosedAfter = slotProgress(afterSlot).closed;
        const perfectDay = Number(state.today?.expected || 0) >= 3 && Number(state.today?.adherence || 0) === 100;
        const gain = extractUnlockedPoints(unlockPayloads);
        if (perfectDay) maybeCelebratePerfectDay(gain);
        else if (!wasClosedBefore && isClosedAfter) maybeCelebrateSlotClosed();
      }
      const mergedDetails = unlockPayloads.flatMap((x) => Array.isArray(x?.newly_unlocked_details) ? x.newly_unlocked_details : []);
      if (mergedDetails.length) {
        await showUnlockToastFromPayload({ newly_unlocked_details: mergedDetails });
      }
    } catch (e) {
      items.forEach((item) => {
        const old = snapshot.items.find(s => String(s.id) === String(item.supplement_id));
        if (old) item.status = old.status;
      });
      complexes.forEach((complex) => {
        const oldComplex = snapshot.complexes.find((c) => String(c.id) === String(complex.complex_id));
        if (!oldComplex) return;
        complex.status = oldComplex.status;
        complex.taken_count = oldComplex.takenCount;
        (complex.items || []).forEach((item) => {
          const oldItem = oldComplex.itemStatuses.find((x) => String(x.id) === String(item.supplement_id));
          if (oldItem) item.status = oldItem.status;
        });
      });
      recalcTodaySnapshot();
      renderActiveTab();
      showToast("Не удалось применить к слоту");
    }
  }

  async function runBatched(tasks, batchSize) {
    for (let i = 0; i < tasks.length; i += batchSize) {
      const chunk = tasks.slice(i, i + batchSize).map((fn) => fn());
      await Promise.all(chunk);
      await new Promise((resolve) => setTimeout(resolve, 80));
    }
  }

  function renderSuppHistory(history) {
    if (!history) return '<div class="muted">История пока недоступна.</div>';
    const summary = history.summary || {};
    const rows = history.entries || [];
    const summaryHtml = `<div class="history-item"><strong>Последний приём: ${esc(summary.last_taken_day || '—')}</strong><div class="muted" style="margin-top:4px">Дней с приёмом: ${Number(summary.taken_days || 0)} · Период: ${esc(summary.first_taken_day || '—')} → ${esc(summary.last_taken_day || '—')}</div></div>`;
    const rowsHtml = rows.length ? rows.map((row)=>`<div class="history-item"><strong>${esc(row.day || '—')} · ${esc(row.status_label || '—')}</strong><div class="muted" style="margin-top:4px">Доза: ${esc(row.dose_text || 'не указана')} · Время: ${esc(row.time_hint || '—')}</div></div>`).join('') : '<div class="muted">Пока нет записей о приёме этой добавки.</div>';
    return `${summaryHtml}${rowsHtml}`;
  }

  boot();
})();
</script>
</body>
</html>
